name: Deploy 한끼 PWA to GitHub Pages

# GitHub 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하면 동작합니다.
on:
  push:
    branches:
      - claude/chatgpt-conversation-link-kvn5ph
    paths:
      - 'hankki/**'
      - '.github/workflows/deploy-hankki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hankki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hankki/package-lock.json
      - run: npm ci
      - run: npm run build
      # ── 배포 전 스모크 테스트 — 실제 브라우저로 '저장' 등 핵심 흐름을 눌러보고
      #    런타임 크래시(pageerror)가 나면 build 를 실패시켜 배포를 막는다.
      #    (v8.58~8.66 저장 먹통이 자동점검 부재로 8판 배포된 사건 재발 방지) ──
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('hankki/package-lock.json') }}
      # ⛔⛔ [2026-08-19] 여기서 배포 «둘»이 멎었다 — 우리 코드가 아니라 러너 «바깥» 문제였다.
      #    run #1537 = 33분 멎다가 취소 · #1538 = 15분. 그 앞 #1536 은 같은 단계를 «19초»에 끝냈다.
      #    로그가 `Get:5 … noble-security InRelease` 뒤로 33분간 «백지»였다 —
      #    `--with-deps` 가 부르는 `apt-get` 이 우분투 패키지 서버에서 멎은 것이다
      #    (`azure.archive.ubuntu.com` 이 전부 `Ign:` 로 무시되고 폴백 서버에서 멈췄다).
      #    ⭐ #1537 은 «문서만» 고친 커밋인데도 멎었다 = 우리 코드와 무관하다는 증거.
      #
      # ⭐⭐ 갈라야 할 두 가지 — **`--with-deps` 만 apt 를 쓴다.**
      #    브라우저 바이너리 자체는 playwright CDN 에서 받으므로 apt 와 상관이 없다.
      #    그래서 apt 가 멎으면 «잘라내고» 브라우저만 받는다.
      #    ubuntu-latest 이미지엔 크로미움 의존 라이브러리가 대부분 이미 깔려 있다.
      # ⛔ 폴백이 모자라면 스모크가 브라우저를 못 띄워 «실패»한다 = 배포가 막힌다.
      #    **안전한 쪽으로 넘어진다** — 검사를 건너뛰고 나가는 일은 없다.
      # ⏱ 시간 제한이 «없으면» job 기본값인 **6시간**까지 매달린다. 그게 이 날 겪은 일이다.
      #    `timeout-minutes` 는 단계 전체의 상한이고, 셸 안의 `timeout` 이 apt 만 따로 자른다.
      #    ⛔ `timeout-minutes` 만으로는 폴백이 안 돈다(단계째로 죽는다) — 둘 다 필요하다.
      - name: Install Chromium (smoke)
        timeout-minutes: 10
        run: |
          timeout 300 npx playwright install --with-deps chromium || {
            echo "⚠️ --with-deps 가 5분 안에 안 끝났다(apt 지연) — 브라우저만 받는다"
            timeout 240 npx playwright install chromium
          }
      - name: Smoke test — 저장·핵심 흐름 (실패 시 배포 차단)
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hankki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
