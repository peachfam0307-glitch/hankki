name: Deploy 한끼 PWA to GitHub Pages

# GitHub 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하면 동작합니다.
on:
  push:
    branches:
      - claude/chatgpt-conversation-link-kvn5ph
    paths:
      - 'hankki/**'
      - '.github/workflows/deploy-hankki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hankki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hankki/package-lock.json
      - run: npm ci
      - run: npm run build
      # ── 배포 전 스모크 테스트 — 실제 브라우저로 '저장' 등 핵심 흐름을 눌러보고
      #    런타임 크래시(pageerror)가 나면 build 를 실패시켜 배포를 막는다.
      #    (v8.58~8.66 저장 먹통이 자동점검 부재로 8판 배포된 사건 재발 방지) ──
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('hankki/package-lock.json') }}
      - name: Install Chromium (smoke)
        run: npx playwright install --with-deps chromium
      - name: Smoke test — 저장·핵심 흐름 (실패 시 배포 차단)
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hankki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
