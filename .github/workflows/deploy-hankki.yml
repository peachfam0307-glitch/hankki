name: Deploy 한끼 PWA to GitHub Pages

# GitHub 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하면 동작합니다.
on:
  push:
    branches:
      - claude/chatgpt-conversation-link-kvn5ph
    paths:
      - 'hankki/**'
      - '.github/workflows/deploy-hankki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hankki
    steps:
      # 🐢➡️🐇 [2026-08-27] 스티커 «원본 그림»은 받지 않는다 — checkout 이 45분까지 늘어났다.
      #
      #   📮 창업자 = *"파일지워도돼 폐기할건폐기해야지 앞으로계속쌓일텐데"* → 갈래 둘 중 **"b"**
      #      ⭐ ⓐ「지운다」가 아니라 ⓑ「CI 만 안 받는다」다. **파일은 하나도 안 지운다** —
      #         2026-08-27 에 «원본을 다시 열어» 시트23 잘림이 「원본 문제」임을 확정했다.
      #         원본이 없으면 「자르기가 깎았나 원본이 그런가」를 영영 못 가린다.
      #
      #   🔢 실측 = 뺀 파일 **5,169개 · 1.7GB** (워킹트리 4.02GB → 1.3GB)
      #      ⛔ 빠지면 안 되는 것은 «한 건도» 안 걸린다 — 앱 자산 2,696장 · design 150 ·
      #         public 41 · 문서(.md/.json) 443 · scripts 640 전부 그대로 받는다.
      #
      #   ✅ 흉내가 아니라 **진짜 sparse worktree 를 만들어** 확인했다:
      #      · `git ls-files -v` 의 SKIP_WORKTREE 5,169개가 패턴 계산과 정확히 일치
      #      · 그중 스티커 폴더 «밖» 0건 · 그림이 «아닌» 것 0건
      #      · 그 상태에서 **build exit 0 · smoke exit 0**(게이트 88개 전부)
      #
      #   ⚠️ 반쪽만 보게 되는 검사 셋 — **전부 «경고·현황»이고 배포를 막는 게이트가 아니다**
      #      `check-packprefix`(재고 접두어 겹침) · `doc-guard --stale`(끝난 걸 대기로 둠) ·
      #      `asset-map`(재고 컷 수). 셋 다 **로컬에서 돌 때는 제대로 일한다** —
      #      우리는 배포 전에 늘 로컬 스모크를 돌리므로 실질 손실이 없다.
      #      ⛔ 나중에 `docs/stickers` 그림을 «배포를 막는» 게이트에 쓰게 되면 이 설정을 다시 볼 것.
      #
      #   ⛔ `cone-mode: false` 가 필수다 — cone 모드는 «디렉터리 단위»라 「PNG만 빼기」를 못 한다.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/hankki/docs/stickers/**/*.png
            !/hankki/docs/stickers/**/*.jpg
            !/hankki/docs/stickers/**/*.jpeg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hankki/package-lock.json
      - run: npm ci
      - run: npm run build
      # ── 배포 전 스모크 테스트 — 실제 브라우저로 '저장' 등 핵심 흐름을 눌러보고
      #    런타임 크래시(pageerror)가 나면 build 를 실패시켜 배포를 막는다.
      #    (v8.58~8.66 저장 먹통이 자동점검 부재로 8판 배포된 사건 재발 방지) ──
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('hankki/package-lock.json') }}
      # ⛔⛔ [2026-08-19] 여기서 배포 «둘»이 멎었다 — 우리 코드가 아니라 러너 «바깥» 문제였다.
      #    run #1537 = 33분 멎다가 취소 · #1538 = 15분. 그 앞 #1536 은 같은 단계를 «19초»에 끝냈다.
      #    로그가 `Get:5 … noble-security InRelease` 뒤로 33분간 «백지»였다 —
      #    `--with-deps` 가 부르는 `apt-get` 이 우분투 패키지 서버에서 멎은 것이다
      #    (`azure.archive.ubuntu.com` 이 전부 `Ign:` 로 무시되고 폴백 서버에서 멈췄다).
      #    ⭐ #1537 은 «문서만» 고친 커밋인데도 멎었다 = 우리 코드와 무관하다는 증거.
      #
      # ⭐⭐ 갈라야 할 두 가지 — **`--with-deps` 만 apt 를 쓴다.**
      #    브라우저 바이너리 자체는 playwright CDN 에서 받으므로 apt 와 상관이 없다.
      #    그래서 apt 가 멎으면 «잘라내고» 브라우저만 받는다.
      #    ubuntu-latest 이미지엔 크로미움 의존 라이브러리가 대부분 이미 깔려 있다.
      # ⛔ 폴백이 모자라면 스모크가 브라우저를 못 띄워 «실패»한다 = 배포가 막힌다.
      #    **안전한 쪽으로 넘어진다** — 검사를 건너뛰고 나가는 일은 없다.
      # ⏱ 시간 제한이 «없으면» job 기본값인 **6시간**까지 매달린다. 그게 이 날 겪은 일이다.
      #    `timeout-minutes` 는 단계 전체의 상한이고, 셸 안의 `timeout` 이 apt 만 따로 자른다.
      #    ⛔ `timeout-minutes` 만으로는 폴백이 안 돈다(단계째로 죽는다) — 둘 다 필요하다.
      - name: Install Chromium (smoke)
        timeout-minutes: 10
        run: |
          timeout 300 npx playwright install --with-deps chromium || {
            echo "⚠️ --with-deps 가 5분 안에 안 끝났다(apt 지연) — 브라우저만 받는다"
            timeout 240 npx playwright install chromium
          }
      # 🐢 [2026-09-06 02:1x] 동시 실행 수를 4 → 2 로. ubuntu-latest(4 vCPU)에서 크로미움 판 4개가 같이 돌면
      #    페이지가 30초 안에 안 떠서 «매번 다른» 재현판이 죽었다(v12.64 run: 1차 _repro-레꾸겹침 클릭 30초 초과 ·
      #    2차 재실행 _repro-원문보기 화면이 빈 채로 판정). 둘 다 같은 커밋에서 로컬 통과. 뿌리 = CPU 부족.
      #    ⛔ 검사를 빼거나 타임아웃을 늘리는 게 아니라 «동시에 도는 수»를 줄인다 — 멈춘 판은 480초 상한이 그대로 잡는다.
      - name: Smoke test — 저장·핵심 흐름 (실패 시 배포 차단)
        env:
          SMOKE_JOBS: 2
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hankki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
