name: Deploy 한끼 PWA to GitHub Pages

# GitHub 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하면 동작합니다.
on:
  push:
    branches:
      - claude/chatgpt-conversation-link-kvn5ph
    paths:
      - 'hankki/**'
      - '.github/workflows/deploy-hankki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hankki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hankki/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hankki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
