name: AAB 빌드 (targetSdk 지정)

# 🅱️ PWABuilder 대체용 예비 빌드.
#
# 왜 있나: PWABuilder가 뽑아주는 AAB의 **targetSdk가 35**라서, Google Play가
# 요구하는 **36**을 맞출 방법이 없다(2026-07-29 확인, 기한 2026-08-31).
# 여기서는 bubblewrap 으로 직접 만들어 targetSdk 를 우리가 지정한다.
#
# ⚠️⚠️ 먼저 PWABuilder 를 다시 시도해 볼 것.
#   8월 중순쯤 https://www.pwabuilder.com 에서 다시 뽑아 targetSdk 가 36 이면
#   이 워크플로는 쓸 필요가 없다(창업자가 5분이면 끝나는 길). 그게 안 될 때만 여기로.
#
# ✅ **이제는 검증된 길이다** — 2026-08-05 기준 8판을 돌려 «최근 4판 전부 성공»했고
#   versionCode 7·9·10·11 이 이 워크플로로 구워져 Play Console 에 올라갔다.
#   ⛔ 위 「한 번도 실행해 본 적이 없다」는 낡은 메모였다(2026-08-01 첫 성공 이후 안 고쳤다).
#   ⚠️ 처음 두 판(#1·#3)은 실패했는데 원인은 둘 다 «대화형 질문»이었다 — 아래 「질문이 안 나오게」 절 참고.
#
# 돌리기 전 준비 (저장소 Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  ← signing.keystore 를 base64 로 바꾼 문자열
#                               (윈도우 PowerShell:
#                                [Convert]::ToBase64String([IO.File]::ReadAllBytes("signing.keystore")) > key.txt)
#   ANDROID_KEYSTORE_PASSWORD ← signing-key-info 의 key store password
#   ANDROID_KEY_PASSWORD      ← signing-key-info 의 key password
#   ANDROID_KEY_ALIAS         ← signing-key-info 의 alias
#
# 결과물: Actions 실행 화면 맨 아래 Artifacts 에서 zip 으로 내려받는다.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: '버전코드 — 콘솔에 올라간 최신보다 커야 함. ✅2026-08-05 밤 확인(창업자 콘솔 실물): Play 최신 = 12 (9.79 · 비공개 테스트-베타테스트 게시)'
        required: true
        default: '13'
      versionName:
        description: '버전 이름 — 비워두면 hankki/src/version.js 에서 자동으로 읽는다'
        required: false
        default: ''
      targetSdk:
        description: '타겟 SDK (Google Play 요구치. 2026-08-31부터 36)'
        required: true
        default: '36'
      dryRun:
        description: '연습 실행 — 서명키 없이 프로젝트 생성·targetSdk 확인까지만 (첫 실행 권장)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # bubblewrap 은 JDK 17 을 쓴다. 러너에 이미 설치돼 있어 경로만 잡아준다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: bubblewrap 설치
        run: npm i -g @bubblewrap/cli

      # 🏷 런처명이 «앞뒤 대칭 4글자»인지 먼저 본다 — 틀린 채로 뽑으면 폰에서 이름이 쏠린다.
      #    (안 보이는 글자는 눈으로 못 세지만 코드는 센다 — 2026-08-01 게이트)
      - name: 런처명 검사
        run: node hankki/scripts/check-launcher.mjs

      - name: twa-manifest 준비 (버전 주입)
        run: |
          mkdir -p build && cp android/twa-manifest.json build/twa-manifest.json
          cd build
          node -e "
            const fs = require('fs')
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'))
            // ⭐ 버전 이름은 **손으로 옮겨적지 않는다** — 비워두면 앱이 쓰는 값을 그대로 읽는다.
            //   (사람이 옮겨적는 자리는 반드시 언젠가 낡는다. 실제로 기본값이 9.33에서 안 바뀌어 있었다)
            const inName = '${{ inputs.versionName }}'.trim()
            const auto = (fs.readFileSync('../hankki/src/version.js','utf8').match(/APP_VERSION\s*=\s*'v?([0-9.]+)'/) || [])[1]
            const name = inName || auto
            if (!name) throw new Error('버전 이름을 못 정했다 — src/version.js 를 못 읽음')
            m.appVersionCode = Number('${{ inputs.versionCode }}')
            m.appVersionName = name
            m.appVersion = name
            m.signingKey = { path: './signing.keystore', alias: process.env.ALIAS }
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2))
            console.log('버전코드', m.appVersionCode, '/ 버전이름', m.appVersionName, inName ? '(직접 입력)' : '(version.js 에서 읽음)')
            console.log('런처명 글자수', [...m.launcherName].length)
          "
        env:
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: 서명키 복원
        if: ${{ !inputs.dryRun }}
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "⛔ 서명키 Secret 이 비어 있다. 저장소 Settings → Secrets and variables → Actions 에"
            echo "   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_PASSWORD · ANDROID_KEY_ALIAS 를 넣을 것."
            echo "   (연습만 해보려면 dryRun 을 켜고 다시 돌리면 된다)"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > build/signing.keystore

      # 🤖🤖 **bubblewrap 은 JDK·Android SDK 가 없으면 «대화형 질문»을 던진다.**
      #   CI 에는 사람이 없어서 그 자리에서 멈춘다 — 2026-08-01 첫 연습 실행이 정확히 여기서 죽었다:
      #     `? Do you want Bubblewrap to install the JDK (recommended)? (Y/n)` → exit 130
      #   ⭐ 답 = **미리 깔고 설정 파일을 써둔다.** 그러면 물어볼 게 없어진다.
      #   ⚠️ 옛 주석에 *"bubblewrap 이 알아서 내려받는다"* 고 적어뒀는데 **틀렸다** —
      #      내려받기 «전에» 물어본다. 사람이 있어야 한다는 뜻이었다.
      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: bubblewrap 설정 미리 써두기 (질문이 안 나오게)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          echo "── bubblewrap 설정 ──"; cat ~/.bubblewrap/config.json

      # twa-manifest.json 을 바탕으로 안드로이드 프로젝트를 새로 만든다.
      - name: 안드로이드 프로젝트 생성
        working-directory: build
        run: bubblewrap update --skipVersionUpgrade

      # ⭐ 이 워크플로의 존재 이유 — PWABuilder 로는 못 바꾸는 값.
      - name: targetSdk 상향
        working-directory: build
        run: |
          sed -i "s/targetSdkVersion .*/targetSdkVersion ${{ inputs.targetSdk }}/" app/build.gradle
          sed -i "s/compileSdkVersion .*/compileSdkVersion ${{ inputs.targetSdk }}/" app/build.gradle
          echo "── 확인 ──"
          grep -nE "compileSdkVersion|targetSdkVersion|versionCode|versionName" app/build.gradle
          # 📱 가로모드 — 2026-08-09 에 `portrait` → `default` 로 풀었는데 **로그에 안 찍혀서 확인을 못 했다.**
          #   bubblewrap 은 twa-manifest.json 의 orientation 을 `resValue "string","orientation"` 으로 넣는다.
          #   ⛔ 눈으로 못 보면 「됐겠지」가 된다 → 찍어 놓고, portrait 이면 **여기서 죽인다.**
          echo "── 화면 방향 ──"
          ORI="$(grep -oE 'resValue "string", "orientation", "[^"]*"' app/build.gradle | sed 's/.*, "//;s/"$//')"
          echo "orientation = ${ORI:-(못 읽음)}"
          case "$ORI" in
            portrait*) echo "⛔ 세로로 잠겨 있다 — android/twa-manifest.json 을 볼 것"; exit 1 ;;
            "") echo "⚠️ 값을 못 읽었다 — bubblewrap 판이 바뀌었을 수 있다(빌드는 계속한다)" ;;
            *) echo "✅ 세로 잠금 없음" ;;
          esac

      - name: 연습 실행이면 여기서 끝
        if: ${{ inputs.dryRun }}
        run: |
          echo "✅ 연습 실행 통과 — 프로젝트 생성과 targetSdk 상향까지 확인됐다."
          echo "   이제 Secret 4개를 넣고 dryRun 을 끄고 다시 돌리면 AAB 가 나온다."

      - name: AAB 빌드
        if: ${{ !inputs.dryRun }}
        working-directory: build
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 결과물 올리기
        if: ${{ !inputs.dryRun }}
        uses: actions/upload-artifact@v4
        with:
          name: hankki-aab-${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: |
            build/app-release-bundle.aab
            build/app-release-signed.apk
          if-no-files-found: warn
