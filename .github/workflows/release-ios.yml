name: 🍎 iOS 서명 빌드 → TestFlight

# 🍎 2026-09-12 — 애플 개발자 가입 완료(12:50 · 등록 ID T9R4W65K68) 뒤 «서명» 빌드.
#
# 무엇 = 깃허브 맥(macos-26)에서 우리 웹(hankki/dist)을 껍데기에 넣고 «애플 열쇠로 서명»해 .ipa 를 만든다.
#   커밋 제목에 [testflight] 가 있으면(또는 dispatch upload=true) 그 자리에서 App Store Connect(TestFlight)로 올린다.
#
# 열쇠 = App Store Connect API 키 셋(깃허브 비밀 칸 · 2026-09-12 창업자가 넣음)
#   ASC_KEY_ID · ASC_ISSUER_ID · ASC_API_KEY_P8(.p8 본문)
#
# 🔁🔁 2026-09-13 9판 — 서명 방식을 «기기 없이 수동 서명»으로 바꿨다 (ios-app/fastlane/Fastfile 머리말에 전말)
#   1판 자동 서명 = "Your team has no devices" · 2~6판 서명 없는 archive = applesignin 권한 누락(Apple 로그인 죽음)
#   7판 ad-hoc = iOS SDK 금지 · 8판 자동 서명 되돌림 = 기기 등록이 창업자 컴퓨터(드라이버)에서 막힘
#   ⇒ fastlane match 가 API 열쇠로 배포 인증서·App Store 프로필을 «만들어» 서명한다. 기기 0대여도 된다.
#      매 판 nuke(팀 배포 인증서 비움 · 애플 한도 = 팀당 1개) → 새로 1개. 저장소는 러너 안 임시 git(남는 것 0).
#   ⛔ 서명 확인 단계가 applesignin 권한을 «반드시» 확인한다 — 없으면 죽는다(4·6판 사고 재발 금지).
#
# 앱 ID kr.hankki.app(Sign In with Apple 켜짐) · Team ID 6YM72N6FPD · App Store Connect 앱 「한끼 - 캡처로 만드는 레시피앱」(09-12 14:00).
# 빌드 번호 = 이 워크플로 실행 번호(run_number) · 버전 = hankki/src/version.js 의 APP_VERSION(v13.19 → 13.19).
#
# ⚠️ workflow_dispatch(손으로 돌리기)는 깃허브 규칙상 «기본 갈래»에 있는 워크플로만 된다(2026-09-12 실측 404).
#    이 파일은 아이폰 갈래에만 있으므로 push 로도 돈다.
#    ⭐ push 로 TestFlight 에 «올리려면» 커밋 제목에 [testflight] 를 넣는다. 없으면 .ipa 만 만든다.
#    ⛔ 3판 실측 = 커밋 제목에 그 글자를 «설명으로» 적었더니 스위치가 켜졌다 → 올릴 생각이 없으면 커밋 글에 그 글자를 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'TestFlight 로 올리기 (false = .ipa 만 만들어 결과물로)'
        type: boolean
        default: false
  push:
    branches:
      - claude/annyeong-yoi12y
    paths:
      - '.github/workflows/release-ios.yml'
      - 'ios-app/**'

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 6YM72N6FPD
      BUNDLE_ID: kr.hankki.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🧰 러너 확인
        run: |
          sw_vers
          xcodebuild -version
          fastlane --version | tail -1
          uname -m

      - name: 🔐 비밀 칸 셋이 다 있나 (값은 안 찍는다)
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          ok=1
          [ -n "$K" ] || { echo "⛔ ASC_KEY_ID 비어 있음"; ok=0; }
          [ -n "$I" ] || { echo "⛔ ASC_ISSUER_ID 비어 있음"; ok=0; }
          [ -n "$P" ] || { echo "⛔ ASC_API_KEY_P8 비어 있음"; ok=0; }
          case "$P" in *"BEGIN PRIVATE KEY"*) ;; *) echo "⛔ ASC_API_KEY_P8 가 .p8 본문이 아니다(BEGIN PRIVATE KEY 줄이 없다)"; ok=0;; esac
          [ "$ok" = 1 ] || exit 1
          echo "✅ 셋 다 있음 · 키 ID 길이=${#K} · Issuer 길이=${#I}"

      - name: 🌐 웹 빌드 (hankki/dist)
        working-directory: hankki
        run: |
          npm ci --no-audit --no-fund
          npm run build
          du -sh dist

      - name: 📦 껍데기에 웹 넣기 (cap sync)
        working-directory: ios-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
          du -sh ios/App/App/public

      - name: 🔢 버전·빌드 번호 · 올리기 스위치
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          V=$(grep -o "APP_VERSION = 'v[0-9.]*'" hankki/src/version.js | grep -o '[0-9][0-9.]*')
          echo "MARKETING_VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          # 올리는 길 둘 = ⓐ dispatch upload=true(기본 갈래 전용이라 지금은 못 씀) ⓑ push 커밋 제목에 [testflight]
          UP=false
          [ "${{ inputs.upload }}" = "true" ] && UP=true
          case "$HEAD_MSG" in *"[testflight]"*) UP=true;; esac
          echo "UPLOAD=$UP" >> "$GITHUB_ENV"
          echo "버전 $V · 빌드 ${{ github.run_number }} · 올리기=$UP"

      - name: 🗄 match 임시 저장소 (러너 안 빈 git · 판 끝나면 사라진다)
        run: |
          set -e
          D="$RUNNER_TEMP/match-store.git"
          git init -q --bare -b main "$D"
          echo "MATCH_LOCAL_REPO=file://$D" >> "$GITHUB_ENV"
          echo "MATCH_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          git config --global user.email "ci@hankki.local"
          git config --global user.name "hankki-ci"
          echo "✅ $D"

      # 🍎 서명 ＋ archive ＋ export(＋ 올리기) — 전부 ios-app/fastlane/Fastfile 의 release 레인이 한다
      - name: 🍎 fastlane release (기기 없이 수동 서명 → .ipa → upload 면 TestFlight)
        working-directory: ios-app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          fastlane ios release upload:"$UPLOAD"

      # ⛔ 4·6판 사고 = 서명된 앱에 applesignin 이 없었는데 «빈 줄»로 지나갔다 → 이제 .ipa 실물을 풀어서 없으면 죽는다
      - name: 🔍 서명 확인 (.ipa 안 실물 · 누가 서명했나 · applesignin 있나)
        working-directory: ios-app
        run: |
          IPA=build/out/App.ipa
          test -f "$IPA" || { echo "⛔ $IPA 가 없다"; exit 1; }
          rm -rf build/ipa-check && mkdir -p build/ipa-check
          unzip -q "$IPA" -d build/ipa-check
          APP=$(ls -d build/ipa-check/Payload/*.app | head -1)
          echo "── $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -i "Authority\|TeamIdentifier\|Identifier=" || true
          echo "── entitlements"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A1 "applesignin\|team-identifier\|application-identifier\|aps-environment" || true
          echo "── Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist" || true
          echo "── 서명이 팀 $TEAM_ID 인가 · applesignin 권한이 있나"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "TeamIdentifier=$TEAM_ID" || { echo "⛔ TeamIdentifier 가 $TEAM_ID 가 아니다"; exit 1; }
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.applesignin" || { echo "⛔ 서명된 앱에 applesignin 권한이 없다(빌드 4·6 사고) — 이 빌드는 올리면 안 된다"; exit 1; }
          echo "✅ 서명 = 팀 $TEAM_ID · applesignin 있음 · 올리기=$UPLOAD"

      - name: ⬆️ 결과물 (.ipa · 로그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.run_number }}
          path: |
            ios-app/build/out/*.ipa
            ios-app/build/out/*.plist
            ios-app/build/out/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore

      - name: 🧹 열쇠·임시 저장소·키체인 지우기
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/match-store.git" ~/private_keys || true
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
