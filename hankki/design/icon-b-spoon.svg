<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 한끼 앱 아이콘 (보관 · 다음에 사용) — 딥차콜 + 골드 프레임 + 한끼 + 입체 금색 스푼 언더라인 -->
  <defs>
    <radialGradient id="bgv" cx=".5" cy=".4" r=".9">
      <stop offset="0" stop-color="#3c3b36"/><stop offset="1" stop-color="#282723"/>
    </radialGradient>
    <radialGradient id="sbowl" cx=".4" cy=".33" r=".82">
      <stop offset="0" stop-color="#eed9b0"/><stop offset=".55" stop-color="#ceae79"/><stop offset="1" stop-color="#a9884f"/>
    </radialGradient>
    <linearGradient id="shandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c795"/><stop offset=".5" stop-color="#c9a86f"/><stop offset="1" stop-color="#a5854e"/>
    </linearGradient>
    <filter id="drop" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bgv)"/>
  <rect x="30" y="30" width="452" height="452" rx="94" fill="none" stroke="#c7ac82" stroke-width="3.5" opacity=".72"/>
  <text x="256" y="288" font-size="140" font-weight="800" letter-spacing="-6" fill="#f1ece2" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">한끼</text>
  <g filter="url(#drop)">
    <path d="M188 338 H352 a9 9 0 0 1 0 18 H188 Z" fill="url(#shandle)"/>
    <ellipse cx="170" cy="347" rx="27" ry="21" fill="url(#sbowl)"/>
    <ellipse cx="173" cy="348" rx="15" ry="11" fill="#8f6f3f" opacity=".4"/>
    <ellipse cx="161" cy="340" rx="9" ry="4.5" fill="#fff" opacity=".55"/>
  </g>
</svg>
