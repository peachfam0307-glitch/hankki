<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>

.circ{width:210px;height:210px;border-radius:50%;background:#f5f3ee;display:flex;align-items:center;justify-content:center;overflow:hidden}

<script>

  <circle cx="32.1" cy="26" r="1" fill="#fff"/>

  </g>`;
const walnutFixed = `
  <g transform="rotate(-10 39.2 33)">
    <path d="M39.2 28.9c.5 0 1 .4 1.3.9 1 .1 2.2.9 2.5 2.3.4 1.8-.4 3.5-1.8 4.3-1.2.7-2.8.7-4 0-1.4-.8-2.2-2.5-1.8-4.3.3-1.4 1.5-2.2 2.5-2.3.3-.5.8-.9 1.3-.9z" fill="#b5895c"/>

// B. 토마토 요리타이머 — 다이얼 + 바늘 + 잎꼭지
const timer = `
  <g transform="rotate(9 39.2 32.6)">

    <path d="M39.2 28.7v-1.1" stroke="#7fa05a" stroke-width=".9" stroke-linecap="round"/>

document.write(`

</script>
</body></html>
