<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한끼 버디 — 내 큐레이션</title>
<style>
  body { background:#f5f6f4; font-family:sans-serif; margin:0; padding:28px; color:#3a3128; }
  h1 { font-size:15px; margin:26px 0 4px; color:#6b4f3a; }
  .desc { font-size:12px; color:#8a7a6a; margin:0 0 14px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .circ { width:100px; height:100px; border-radius:50%; overflow:hidden; box-shadow:0 3px 12px rgba(107,79,58,.14); }
  .name { font-size:11.5px; font-weight:700; color:#6b4f3a; }
</style>
</head>
<body>

<h1>스타일 A — 라인 심볼 (미니멀 · 고급 · 앱 아이콘st)</h1>
<div class="desc">브랜드 브라운 한 색, 얇은 선 하나로. 프리미엄 앱 느낌. 작아져도 안 뭉개짐.</div>
<div class="row" id="A"></div>

<h1>스타일 B — 플랫 (노라인 · 볼드 · 요즘 앱st)</h1>
<div class="desc">선 없이 색 덩어리만. 토스·당근 삽화 결. MZ한테 제일 익숙한 '요즘 것'.</div>
<div class="row" id="B"></div>

<h1>스타일 C — 톤온톤 (크림·브라운 한 계열 · 세트 통일감)</h1>

    <circle cx="18" cy="20" r="7" fill="#c79663"/><circle cx="46" cy="20" r="7" fill="#c79663"/>

    <circle cx="25" cy="33" r="2.4" fill="#3a2f26"/><circle cx="39" cy="33" r="2.4" fill="#3a2f26"/>
    <ellipse cx="32" cy="40" rx="7" ry="5.2" fill="#f0dcbb"/>

    <circle cx="18" cy="21" r="3" fill="#ddc199"/><circle cx="46" cy="21" r="3" fill="#ddc199"/>

    <ellipse cx="23" cy="42" rx="4" ry="2.6" fill="#d99a86" opacity=".7"/><ellipse cx="41" cy="42" rx="4" ry="2.6" fill="#d99a86" opacity=".7"/>
    <circle cx="25.5" cy="34" r="2.1" fill="#6b4f3a"/><circle cx="38.5" cy="34" r="2.1" fill="#6b4f3a"/>

</body>
</html>
