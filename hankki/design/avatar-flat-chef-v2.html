<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한끼 버디 — 완성 세트 v2</title>
<style>
  body { background:#f5f6f4; font-family:sans-serif; margin:0; padding:28px; }
  h1 { font-size:15px; color:#6b4f3a; margin:0 0 14px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .circ { width:110px; height:110px; border-radius:50%; overflow:hidden; box-shadow:0 5px 15px rgba(107,79,58,.15); }
  .name { font-size:12px; font-weight:700; color:#6b4f3a; }
  .small .circ { width:56px; height:56px; }
  .small svg { width:56px; height:56px; }
</style>
</head>
<body>
<h1>완성 세트 v2 — 눈 간격↑·살짝 아래 · 뒤 4마리 입 크게 · 소품 크고 잘 보이게</h1>
<div class="row" id="main"></div>
<h1 style="margin-top:24px">앱 크기(56px)</h1>
<div class="row small" id="tiny"></div>

<script>
const wrap = (defs, inner) =>
  `<svg viewBox="0 0 64 64" width="110" height="110" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${inner}</svg>`;
const bgG = (id, t, b) => `<radialGradient id="${id}" cx="50%" cy="34%" r="80%"><stop offset="0%" stop-color="${t}"/><stop offset="100%" stop-color="${b}"/></radialGradient>`;
const bodG = (id, l, d) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${l}"/><stop offset="100%" stop-color="${d}"/></linearGradient>`;

const face = (g) => `<ellipse cx="32" cy="36.5" rx="21" ry="17.5" fill="url(#${g})"/>`;
const hi = (c) => `<ellipse cx="32" cy="27.5" rx="16" ry="8.5" fill="${c}" opacity=".4"/>`;

const toque = (x, y, tilt, sh='#e7e0d0') => `
  <g transform="rotate(${tilt} ${x} ${y})">
    <rect x="${x-9.4}" y="${y+2.4}" width="18.8" height="5.6" rx="2.8" fill="#fff"/>
    <rect x="${x-9.4}" y="${y+6}" width="18.8" height="2" rx="1" fill="${sh}"/>
    <path d="M${x-9.6} ${y+4}c-1.4-6 3.6-8.8 6.6-6.8 1-3.6 6.6-3.6 7.6 0 3-2 8-.8 6.6 6.8z" fill="#fff"/>
    <circle cx="${x-6.2}" cy="${y-2}" r="5.4" fill="#fff"/>
    <circle cx="${x+6.2}" cy="${y-2}" r="5.4" fill="#fff"/>
    <circle cx="${x}" cy="${y-5.2}" r="6.1" fill="#fff"/>
    <path d="M${x-8} ${y+1}c4.2 1.8 11.8 1.8 16 0" fill="none" stroke="${sh}" stroke-width="1" opacity=".45" stroke-linecap="round"/>
  </g>`;

const eye = (x, y, r=2.75) => `
  <ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.2}" fill="#2f2822"/>
  <circle cx="${x-r*0.28}" cy="${y-r*0.48}" r="${r*0.36}" fill="#fff"/>
  <circle cx="${x+r*0.34}" cy="${y+r*0.52}" r="${r*0.15}" fill="#fff" opacity=".75"/>`;
const blush = (x, y, c='#ffc2cd', o=.38) => `<ellipse cx="${x}" cy="${y}" rx="3.2" ry="1.9" fill="${c}" opacity="${o}"/>`;

// 눈 표준 위치: 간격 넓게(≈19) + 살짝 아래(34.6)
const EL = 22.5, ER = 41.5, EY = 34.6;

const C = [];

// 1) 꿀곰 — 꿀 드리퍼(크게)
C.push(['꿀곰 셰프', wrap(
  bgG('g1','#eef4fb','#dbe8f4')+bodG('b1','#d9ad76','#c2914f')+bodG('m1','#f7e7c8','#efd6ab'),
`<rect width="64" height="64" fill="url(#g1)"/>
  <circle cx="14.5" cy="23" r="7.5" fill="#c2914f"/><circle cx="14.5" cy="23" r="3.6" fill="#e4c599"/>
  <circle cx="49.5" cy="23" r="7.5" fill="#c2914f"/><circle cx="49.5" cy="23" r="3.6" fill="#e4c599"/>
  ${face('b1')} ${hi('#e0b784')}
  ${toque(32,12.5,6)}
  ${blush(19.5,40.5)} ${blush(44.5,40.5)}
  ${eye(EL,EY)} ${eye(ER,EY)}
  <ellipse cx="32" cy="42" rx="7.8" ry="5.6" fill="url(#m1)"/>
  <ellipse cx="32" cy="39.8" rx="1.8" ry="1.3" fill="#5c4029"/>
  <path d="M32 41v1.8m0 0c-1.1 1.1-2.7.7-3.1-.4m3.1.4c1.1 1.1 2.7.7 3.1-.4" fill="none" stroke="#5c4029" stroke-width="1.4" stroke-linecap="round"/>
  <g transform="rotate(20 49 51)">
    <rect x="48" y="47" width="2" height="10" rx="1" fill="#c99a52"/>
    <ellipse cx="49" cy="53" rx="4" ry="4.2" fill="#f2b24a"/>
    <ellipse cx="47.6" cy="51.6" rx="1.1" ry=".8" fill="#ffd487"/>
    <path d="M49 57c0 2.6.2 3.6-.8 3.8" stroke="#f2b24a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
`)]);

// 2) 삐약 — 계란후라이(크게)
C.push(['삐약 셰프', wrap(
  bgG('g2','#fff7d8','#ffe9a8')+bodG('b2','#ffdb54','#ffc82e'),
`<rect width="64" height="64" fill="url(#g2)"/>
  ${face('b2')} ${hi('#fff0b0')}
  <path d="M44 13.5c2.4-2 5.4-1.6 6.6.6" fill="none" stroke="#f0b23a" stroke-width="1.8" stroke-linecap="round"/>
  ${toque(27,11.5,-10)}
  ${blush(19,40.5,'#ff9db0')} ${blush(45,40.5,'#ff9db0')}
  ${eye(EL,EY)} ${eye(ER,EY)}
  <path d="M27.8 40a4.2 2.6 0 0 1 8.4 0 4.2 4 0 0 1-8.4 0z" fill="#ff9a1f"/>
  <path d="M27.8 40a4.2 2.6 0 0 1 8.4 0 4.2 1.8 0 0 1-8.4 0z" fill="#ffb84a"/>
  <ellipse cx="30.2" cy="39.4" rx="1.4" ry="1" fill="#ffd487"/>
  <g transform="rotate(6 47 53)">
    <path d="M50 50c-3-.7-6 .3-6.7 2.8-.6 2.2 1.2 3.9 4 4.1 2.7.2 5.6-.5 7.2-2.2 1.8-1.9 1.4-4.3-.8-5-1.2-.4-2.6-.3-3.7.3z" fill="#fff"/>
    <circle cx="51" cy="52.8" r="2.7" fill="#ffb200"/>
    <circle cx="50" cy="52" r=".9" fill="#ffce55"/>
  </g>
`)]);

// 3) 호두 — 게코, 눈 3.2, 파(크게)
C.push(['호두 셰프', wrap(
  bgG('g3','#eef6e2','#d8e9c2')+bodG('b3','#b6d05a','#9cbb42'),
`<rect width="64" height="64" fill="url(#g3)"/>
  <path d="M12 34c0-11 9-16 20-16s20 5 20 16-9 16-20 16-20-5-20-16z" fill="url(#b3)"/>
  <ellipse cx="32" cy="27" rx="16" ry="8.5" fill="#c8dd7e" opacity=".5"/>
  <path d="M14 25c1.5-3.5 5-6 9-6.5" fill="none" stroke="#9cbb42" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 25c-1.5-3.5-5-6-9-6.5" fill="none" stroke="#9cbb42" stroke-width="2" stroke-linecap="round"/>
  ${toque(32,11.5,-5)}
  ${blush(18.5,39.5,'#ed9aac')} ${blush(45.5,39.5,'#ed9aac')}
  ${eye(22,33.6,3.2)} ${eye(42,33.6,3.2)}
  <g fill="#88a63a"><circle cx="30.4" cy="39.4" r=".65"/><circle cx="33.6" cy="39.4" r=".65"/></g>
  <path d="M26 41.4q6 4.2 12 0" fill="none" stroke="#6f8a30" stroke-width="1.8" stroke-linecap="round"/>
  <g transform="rotate(-16 49 51)">
    <rect x="46.6" y="49" width="2" height="10" rx="1" fill="#eae0c0"/>
    <rect x="49" y="49" width="2" height="10" rx="1" fill="#eae0c0"/>
    <path d="M47.6 49.6c-.8-4.2.2-7.6 1.2-9.6M49.8 49.6c.8-4 0-7.4-1-9.4" stroke="#5fa03a" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  </g>
`)]);

// 4) 깡총 — 토끼: 눈 넓게·아래, 입 크게(코+큰 앞니), 당근 크게
C.push(['깡총 셰프', wrap(
  bgG('g4','#ffeef3','#ffd9e4')+bodG('b4','#ffffff','#f2ebe1'),
`<rect width="64" height="64" fill="url(#g4)"/>
  <ellipse cx="23" cy="12" rx="4" ry="10.5" fill="#fff"/><ellipse cx="23" cy="13" rx="1.9" ry="7" fill="#ffc6d6"/>
  <g transform="rotate(24 41 10)"><ellipse cx="41" cy="12" rx="4" ry="10" fill="#fff"/><ellipse cx="41" cy="13" rx="1.9" ry="6.6" fill="#ffc6d6"/></g>
  ${face('b4')} ${hi('#fff')}
  ${toque(32,12.5,-5)}
  ${blush(19,40.5,'#ffb0c2')} ${blush(45,40.5,'#ffb0c2')}
  ${eye(EL,EY)} ${eye(ER,EY)}
  <path d="M30 40c1.1-1.3 2.9-1.3 4 0 .5.7-.3 1.6-2 1.6s-2.5-.9-2-1.6z" fill="#ff8fa3"/>
  <path d="M32 41.4v1.2" stroke="#c98a80" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M32 42.6c-1.2 1.2-2.7.8-3.1-.3M32 42.6c1.2 1.2 2.7.8 3.1-.3" fill="none" stroke="#c98a80" stroke-width="1.1" stroke-linecap="round"/>
  <rect x="29.8" y="42.8" width="2" height="3.2" rx=".8" fill="#fff" stroke="#e6d8cc" stroke-width=".5"/>
  <rect x="32.2" y="42.8" width="2" height="3.2" rx=".8" fill="#fff" stroke="#e6d8cc" stroke-width=".5"/>
  <g transform="rotate(26 48 50)">
    <path d="M45.2 48h5.6l-2.2 9c-.3 1.1-.9 1.1-1.2 0z" fill="#ff8a3c"/>
    <path d="M45.4 48.8c2.6 1 3.4 1 5.2 0" stroke="#e8701f" stroke-width=".6"/>
    <path d="M44.6 46.8c-1-2-.5-3.6.8-4.2M47.8 46.6c0-2.4.8-3.6 2.2-3.8M50.4 47c1.3-1.7 1.3-3.2.6-4.2" stroke="#5fa03a" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  </g>
`)]);

// 5) 나비 — 고양이: 눈 넓게·아래, 큰 w입, 생선 크게
C.push(['나비 셰프', wrap(
  bgG('g5','#fbeee0','#f6dcc0')+bodG('b5','#ffb96e','#f2a24c'),
`<rect width="64" height="64" fill="url(#g5)"/>
  <path d="M16 22 19 8l9 7z" fill="#f2a24c"/><path d="M18.6 18.4 20 11l4.6 3.8z" fill="#ffd0c2"/>
  <path d="M48 22 45 8l-9 7z" fill="#f2a24c"/><path d="M45.4 18.4 44 11l-4.6 3.8z" fill="#ffd0c2"/>
  ${face('b5')} ${hi('#ffcf9e')}
  <path d="M26 20c1 2.4 1 3.8 0 6.2M32 19c.8 2.7.8 4.4 0 7M38 20c-1 2.4-1 3.8 0 6.2" stroke="#e8903a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  ${toque(25,11,-11)}
  ${blush(19,40.5,'#f79b86')} ${blush(45,40.5,'#f79b86')}
  ${eye(EL,EY)} ${eye(ER,EY)}
  <path d="M30.2 40.2c1.1-1.2 2.6-1.2 3.6 0 .5.6-.3 1.5-1.8 1.5s-2.3-.9-1.8-1.5z" fill="#e2705a"/>
  <path d="M32 41.7v1.3m0 0c-1.4 1.4-3.2.9-3.6-.4m3.6.4c1.4 1.4 3.2.9 3.6-.4" fill="none" stroke="#8a5038" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M7 34l7 .6M7 37.8l7-.4M57 34l-7 .6M57 37.8l-7-.4" stroke="#c98a52" stroke-width=".85" stroke-linecap="round" opacity=".7"/>
  <g transform="rotate(-10 48 52)">
    <ellipse cx="46" cy="52" rx="8" ry="3.4" fill="#bcd7e4"/>
    <path d="M53.4 52l4.6-2.8-.7 2.8.7 2.8z" fill="#9cc0d2"/>
    <circle cx="41.5" cy="51.2" r=".85" fill="#3a3128"/>
    <path d="M41.5 52.6c3.6 1.2 7.4 1.2 11 0" stroke="#8fb2c4" stroke-width=".7" fill="none"/>
  </g>
`)]);

// 6) 몽실 — 강아지: 눈 넓게·아래, 큰 코+입+혀, 국자 크게
C.push(['몽실 셰프', wrap(
  bgG('g6','#efe9f7','#ddd3ee')+bodG('b6','#f2e0bd','#e6cd9e'),
`<rect width="64" height="64" fill="url(#g6)"/>
  ${face('b6')}
  <path d="M13 26c-3.4 3-4.4 10-2.4 14.4 1.4 3 5 3.2 6.8.6 1.4-2 1.5-5.8 1-8.8z" fill="#c99a63"/>
  <path d="M51 26c3.4 3 4.4 10 2.4 14.4-1.4 3-5 3.2-6.8.6-1.4-2-1.5-5.8-1-8.8z" fill="#c99a63"/>
  <ellipse cx="42" cy="30" rx="6" ry="5" fill="#d9b884" opacity=".8"/>
  ${hi('#f7ecd4')}
  ${toque(31,11.5,7)}
  ${blush(19.5,41,'#f2a58e')} ${blush(44.5,41,'#f2a58e')}
  ${eye(EL,EY)} ${eye(ER,EY)}
  <ellipse cx="32" cy="41" rx="2.9" ry="2.2" fill="#5c4029"/>
  <path d="M32 43v1.6m0 0c-1.3 1.3-3 .8-3.4-.4m3.4.4c1.3 1.3 3 .8 3.4-.4" fill="none" stroke="#5c4029" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M30 44.6c0 2.6 4 2.6 4 0v-1h-4z" fill="#ff9db0"/>
  <g transform="rotate(16 49 51)">
    <rect x="48" y="45" width="2" height="12" rx="1" fill="#b9925c"/>
    <path d="M44 54c0 3.4 9 3.4 9 0 0-2.6-9-2.6-9 0z" fill="#cfa46a"/>
    <ellipse cx="48.5" cy="53.6" rx="4.2" ry="1.7" fill="#e0bd88"/>
  </g>
`)]);

// 7) 볼통 — 햄스터: 눈 넓게·아래, 입 크게, 씨앗 크게
C.push(['볼통 셰프', wrap(
  bgG('g7','#fff0dc','#ffe2bd')+bodG('b7','#ffd489','#f2bd6b'),
`<rect width="64" height="64" fill="url(#g7)"/>
  <circle cx="16" cy="21" r="6" fill="#f2bd6b"/><circle cx="16" cy="21" r="2.6" fill="#ffe6ae"/>
  <circle cx="48" cy="21" r="6" fill="#f2bd6b"/><circle cx="48" cy="21" r="2.6" fill="#ffe6ae"/>
  ${face('b7')} ${hi('#ffe9c0')}
  <ellipse cx="14.5" cy="42" rx="6.8" ry="5.6" fill="#ffdfa0"/>
  <ellipse cx="49.5" cy="42" rx="6.8" ry="5.6" fill="#ffdfa0"/>
  ${toque(29,11.5,-8)}
  ${blush(17.5,42.5,'#f79b86',.3)} ${blush(46.5,42.5,'#f79b86',.3)}
  ${eye(EL,EY)} ${eye(ER,EY)}
  <path d="M30.6 40.6c.9-.6 1.9-.6 2.8 0" fill="none" stroke="#8a5a3a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M32 41v1.2m0 0c-1 1-2.4.7-2.8-.3m2.8.3c1 1 2.4.7 2.8-.3" fill="none" stroke="#8a5a3a" stroke-width="1.15" stroke-linecap="round"/>
  <g transform="rotate(24 48 50)">
    <ellipse cx="48" cy="50" rx="2.7" ry="4" fill="#7a5a3e"/><ellipse cx="48" cy="50" rx="1.4" ry="2.5" fill="#b58a5e"/>
    <path d="M46.4 47.6l3.2 4.8" stroke="#5c4530" stroke-width=".5"/>
  </g>
`)]);

const render = (id) => {
  document.getElementById(id).innerHTML = C.map(([n, s]) =>
    `<div class="cell"><div class="circ">${s}</div><div class="name">${n}</div></div>`).join('');
};
render('main'); render('tiny');
</script>
</body>
</html>
