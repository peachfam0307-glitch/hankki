<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body{background:#8a8a8a;padding:40px;display:flex;flex-direction:column;gap:34px;align-items:flex-start}
  .row{display:flex;gap:34px;align-items:flex-end}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .ico{width:300px;height:300px;border-radius:66px;overflow:hidden;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.22)}
  .small{width:96px;height:96px;border-radius:21px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.25)}
  .lbl{font-family:'GowunDodum';font-size:20px;color:#fff}
  .word{font-family:'Jua';line-height:.9;letter-spacing:-1px}
  .bear-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
</style></head><body>

<div class="row">
  <!-- A. 크림 배경 + 브라운 한끼 -->
  <div class="col">
    <div class="ico" id="A" style="background:radial-gradient(120% 120% at 30% 20%,#faf7f0,#f2ece0)">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
        <div class="word" style="font-size:120px;color:#5f4d3b">한끼</div>
        <div style="width:96px;height:8px;background:#c47a58;border-radius:99px"></div>
      </div>
    </div>
    <div class="lbl">A · 크림 + 브라운</div>
  </div>

  <!-- B. 클레이 배경 + 크림 한끼 -->
  <div class="col">
    <div class="ico" id="B" style="background:radial-gradient(120% 120% at 30% 20%,#cf8863,#bd6f4c)">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
        <div class="word" style="font-size:122px;color:#fbf3e9">한끼</div>
        <div style="width:96px;height:8px;background:rgba(255,255,255,.72);border-radius:99px"></div>
      </div>
    </div>
    <div class="lbl">B · 클레이 + 크림</div>
  </div>

  <!-- C. 크림 배경 + 곰곰 셰프 -->
  <div class="col">
    <div class="ico" id="C" style="background:radial-gradient(120% 120% at 30% 18%,#faf7f0,#f0eadd)">
      <div class="bear-wrap"><svg viewBox="0 0 48 48" style="width:212px;height:212px">
        <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
        <circle cx="14.5" cy="18" r="2.2" fill="#d9b593"/><circle cx="33.5" cy="18" r="2.2" fill="#d9b593"/>
        <circle cx="24" cy="28" r="13" fill="#b98a63"/>
        <ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
        <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
        <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
        <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
        <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
        <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      </svg></div>
    </div>
    <div class="lbl">C · 크림 + 곰곰 셰프</div>
  </div>

  <!-- D. 클레이 배경 + 곰곰 + 한끼 -->
  <div class="col">
    <div class="ico" id="D" style="background:radial-gradient(120% 120% at 30% 18%,#cf8863,#bd6f4c)">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <svg viewBox="0 0 48 48" style="width:150px;height:150px;margin-top:10px">
          <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
          <circle cx="14.5" cy="18" r="2.2" fill="#d9b593"/><circle cx="33.5" cy="18" r="2.2" fill="#d9b593"/>
          <circle cx="24" cy="28" r="13" fill="#c69a72"/>
          <ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#efe0c9"/>
          <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
          <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
          <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
          <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.7"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.7"/>
          <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
          <circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
          <circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
          <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        </svg>
        <div class="word" style="font-size:60px;color:#fbf3e9;margin-top:-4px">한끼</div>
      </div>
    </div>
    <div class="lbl">D · 클레이 + 곰돌이 + 한끼</div>
  </div>
</div>

<div class="row" id="smalls" style="gap:44px"></div>
<script>
  const ids=['A','B','C','D']
  const host=document.getElementById('smalls')
  ids.forEach(id=>{
    const src=document.getElementById(id)
    const c=document.createElement('div');c.className='col'
    const box=document.createElement('div')
    box.style.cssText='width:96px;height:96px;overflow:hidden;border-radius:21px;box-shadow:0 5px 14px rgba(0,0,0,.25)'
    const s=src.cloneNode(true);s.removeAttribute('id')
    s.style.cssText='width:300px;height:300px;border-radius:66px;position:relative;overflow:hidden;transform:scale(0.32);transform-origin:top left'
    box.appendChild(s)
    const l=document.createElement('div');l.className='lbl';l.textContent=id+' (작게)'
    c.appendChild(box);c.appendChild(l);host.appendChild(c)
  })
</script>
</body></html>
