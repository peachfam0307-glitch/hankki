<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  :root{--ink:#4a4136;--ink2:#94897a;--clay:#c47a58;--card:#fffdf8;--line:#e6ded0}
  body{background:#777}
  .card{position:relative;overflow:hidden;width:1080px;height:1350px;
    background:radial-gradient(130% 90% at 50% -5%,#fdfcf9,#f3eee4);padding:78px 76px 60px;display:flex;flex-direction:column;align-items:center}
  .tag{font-family:'GowunDodum';font-size:24px;letter-spacing:2px;color:#fff;background:var(--clay);padding:10px 26px;border-radius:999px}
  .title{font-family:'Jua';font-size:60px;color:var(--ink);letter-spacing:-1px;margin-top:22px;text-align:center}
  .title .c{color:var(--clay)}
  .sub{font-family:'GowunDodum';font-size:26px;color:var(--ink2);margin-top:12px;text-align:center}
  .urlchip{margin-top:20px;font-family:'GowunDodum';font-size:26px;color:var(--clay);background:#fff;border:2px dashed #e0cdb9;border-radius:16px;padding:14px 28px;letter-spacing:.3px}
  .steps{margin-top:34px;width:100%;display:flex;flex-direction:column;gap:20px}
  .st{display:flex;align-items:center;gap:26px;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:24px 32px;box-shadow:0 10px 26px rgba(120,95,65,.06)}
  .num{flex:0 0 auto;width:60px;height:60px;border-radius:50%;background:var(--clay);color:#fff;font-family:'Jua';font-size:33px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(150,95,60,.24)}
  .st .tx{font-family:'GowunDodum';font-size:30px;color:var(--ink);line-height:1.35;flex:1}
  .st .tx b{color:var(--clay);font-weight:400}
  .st .tx small{display:block;font-size:22px;color:var(--ink2);margin-top:4px}
  .st .ic{flex:0 0 auto;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
  .st .ic svg{width:46px;height:46px}
  .foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:18px;justify-content:center}
  .foot svg{width:62px;height:62px}
  .foot .t{font-family:'Gaegu';font-weight:700;font-size:32px;color:var(--clay);line-height:1.3;text-align:center}
</style></head><body>
<div class="card">
  <div class="tag">한끼 · 아이폰에서 써보기</div>
  <div class="title">이렇게 설치해요 <span class="c">(2분)</span></div>
  <div class="sub">앱스토어 없이 · 아이폰은 꼭 <b style="color:var(--clay)">사파리</b>로 열어주세요</div>
  <div class="urlchip">peachfam0307-glitch.github.io/hankki</div>

  <div class="steps">
    <div class="st">
      <div class="num">1</div>
      <div class="tx"><b>사파리(Safari)</b>로 위 주소 열기<small>크롬 말고 꼭 사파리로!</small></div>
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#c47a58" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><path d="M31 17l-4 10-10 4 4-10z" fill="#c47a58" stroke="none"/></svg></div>
    </div>
    <div class="st">
      <div class="num">2</div>
      <div class="tx">화면 아래 <b>공유 버튼</b> 탭<small>네모에 위 화살표 모양</small></div>
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#c47a58" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7v22"/><path d="M17 14l7-7 7 7"/><path d="M14 21h-3v18h26V21h-3"/></svg></div>
    </div>
    <div class="st">
      <div class="num">3</div>
      <div class="tx">목록에서 <b>‘홈 화면에 추가’</b> → 추가<small>메뉴를 조금 내리면 있어요</small></div>
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#c47a58" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="32" height="32" rx="8"/><path d="M24 17v14M17 24h14"/></svg></div>
    </div>
    <div class="st">
      <div class="num">4</div>
      <div class="tx">홈 화면 <b>한끼 아이콘</b>으로 앱처럼!<small>전체화면으로 예쁘게 열려요</small></div>
      <div class="ic"><svg viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="8" fill="#fdfbf6" stroke="#e2d6c4" stroke-width="1.5"/><circle cx="20" cy="23" r="3.6" fill="#b98a63"/><circle cx="28" cy="23" r="3.6" fill="#b98a63"/><circle cx="24" cy="29" r="6.5" fill="#b98a63"/></svg></div>
    </div>
  </div>

  <div class="foot">
    <svg viewBox="0 0 48 48">
      <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
      <circle cx="24" cy="28" r="13" fill="#b98a63"/><ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
      <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
      <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
      <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
      <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
      <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/><circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/><circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    </svg>
    <div class="t">써봐 주셔서 감사해요!<br>불편한 점은 앱 안 ‘의견 보내기’로 💛</div>
  </div>
</div>
</body></html>
