<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  :root{--bg:#f4efe6;--ink:#4a4136;--ink2:#94897a;--clay:#c47a58;--card:#fbf8f1;--line:#e6ded0}
  body{background:#777}
  .fg{position:relative;overflow:hidden;width:1024px;height:500px;background:var(--bg);
    background-image:radial-gradient(120% 130% at 82% -10%, #f8f2e7 0%, #f2ece1 55%, #ece5d8 100%);
    display:flex;align-items:center;padding:0 74px}
  .left{position:relative;z-index:3;width:600px}
  .word{font-family:'Jua';font-size:74px;color:#5f4d3b;letter-spacing:-1px;line-height:1}
  .rule{width:74px;height:5px;background:var(--clay);border-radius:99px;margin:22px 0 22px;opacity:.9}
  .hero{font-family:'Jua';font-size:46px;line-height:1.28;color:var(--ink);letter-spacing:-1px}
  .hero .c{color:var(--clay)}
  .sub{font-family:'GowunDodum';font-size:22px;color:var(--ink2);margin-top:20px;line-height:1.5;letter-spacing:-.3px}

  /* 오른쪽: 작게 꾸민 레시피 표지 목업 */
  .cover-wrap{position:absolute;right:96px;top:50%;transform:translateY(-50%) rotate(-5deg);width:262px;
    filter:drop-shadow(0 22px 36px rgba(90,65,45,.20))}
  .cover-card{background:#fffdf8;border-radius:24px;padding:15px 15px 17px}
  .cover{position:relative;height:236px;border-radius:15px;overflow:hidden;background-color:#f4efe2;
    background-image:linear-gradient(#e7ddc7 1.3px,transparent 1.3px),linear-gradient(90deg,#e7ddc7 1.3px,transparent 1.3px);background-size:32px 32px}
  .tape{position:absolute;top:-4px;right:-16px;width:118px;height:29px;background:rgba(214,150,120,.68);transform:rotate(11deg);box-shadow:0 3px 8px rgba(70,60,45,.12)}
  .ttl{position:absolute;top:22px;left:0;right:0;text-align:center;font-family:'Gaegu';font-weight:700;font-size:34px;color:#c47a58;transform:rotate(-3deg)}
  .pot{position:absolute;left:52%;top:60%;transform:translate(-50%,-50%);width:96px;height:96px}
  .stk{position:absolute;width:44px;height:44px}
  .ln{height:11px;background:#eee7d8;border-radius:6px;margin-top:13px}
  .ln.s{width:58%}
  .cap{position:absolute;right:70px;bottom:44px;z-index:4;width:230px;text-align:center;transform:rotate(-4deg);
    font-family:'Gaegu';font-weight:700;font-size:22px;color:#b58a68;line-height:1.3}
  .cap .c{color:#c47a58}
  .badge{position:absolute;left:74px;bottom:40px;z-index:3;font-family:'GowunDodum';font-size:18px;letter-spacing:3px;color:var(--ink2)}
  .badge b{color:var(--clay);font-weight:400}
</style></head><body>
<div class="fg">
  <div class="left">
    <div class="word">한끼</div>
    <div class="rule"></div>
    <div class="hero">흩어진 레시피를, <span class="c">한곳에.</span></div>
    <div class="sub">인스타·유튜브·사진 속 그 레시피를 모으고<br>예쁘게 꾸미는 나만의 레시피북</div>
  </div>
  <div class="badge">N O W&nbsp;&nbsp;O N&nbsp;&nbsp;<b>GOOGLE&nbsp;PLAY</b></div>

  <div class="cover-wrap">
    <div class="cover-card">
      <div class="cover">
        <div class="tape"></div>
        <div class="ttl">우리집 김치찌개</div>
        <div class="pot"><svg viewBox="0 0 48 48"><ellipse cx="24" cy="30" rx="14" ry="11" fill="#4a4a4e"/><path d="M10 27a14 8 0 0 0 28 0" fill="#3c3c40"/><path d="M11 25h26v3H11z" fill="#5a5a5f"/><circle cx="20" cy="24" r="1.7" fill="#e0a83a"/><circle cx="27" cy="26" r="1.7" fill="#cf6f5a"/><circle cx="23" cy="27" r="1.5" fill="#8ca86e"/><path d="M20 16c-1.5 2 .5 3.2-.5 5M25 15c-1.5 2 .5 3.2-.5 5" stroke="#cfcfcf" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></svg></div>
        <div class="stk" style="left:14px;bottom:12px"><svg viewBox="0 0 48 48"><path d="M24 41C8 29.5 8.5 16.5 16 13c4.3-2 8 .9 8 4.6 0-3.7 3.7-6.6 8-4.6 7.5 3.5 8 16.5-8 28Z" fill="#dd918a" stroke="#71604b" stroke-width="2" stroke-linejoin="round"/></svg></div>
        <div class="stk" style="right:14px;bottom:18px;width:38px;height:38px"><svg viewBox="0 0 48 48"><path d="M24 5.5l5.2 10 11.2 1.6-8.1 7.8 1.9 11.1L24 32.6 13.8 38l1.9-11.1L7.6 19l11.2-1.6z" fill="#e0c169" stroke="#71604b" stroke-width="2" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="ln"></div><div class="ln s"></div>
    </div>
  </div>
  <div class="cap">스티커·손글씨로<br><span class="c">표지도 내 맘대로 ♥</span></div>
</div>
</body></html>
