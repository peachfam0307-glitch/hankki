<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{background:#777}
  .card{width:1000px;background:radial-gradient(120% 100% at 50% 0%,#fdfcf9,#efe9dd);padding:56px 60px 48px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .title{font-family:'Jua';font-size:44px;color:#4a4136}
  .sub{font-family:'GowunDodum';font-size:22px;color:#94897a;margin-bottom:26px}
  .row{display:flex;gap:70px}
  .col{display:flex;flex-direction:column;align-items:center;gap:18px}
  .big{width:300px;height:300px;border-radius:66px;overflow:hidden;box-shadow:0 16px 40px rgba(90,65,45,.22)}
  .big img{width:100%;height:100%;display:block}
  .smallrow{display:flex;gap:26px;align-items:flex-end}
  .mini{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sq{width:104px;height:104px;border-radius:26px;overflow:hidden;box-shadow:0 6px 14px rgba(60,45,30,.2)}
  .cir{width:104px;height:104px;border-radius:50%;overflow:hidden;box-shadow:0 6px 14px rgba(60,45,30,.2)}
  .sq img,.cir img{width:100%;height:100%;display:block}
  .mlbl{font-family:'GowunDodum';font-size:17px;color:#8a8071}
  .name{font-family:'Jua';font-size:30px;color:#4a4136;background:#fff;border:1.5px solid #e6ded0;border-radius:999px;padding:8px 28px}
  .desc{font-family:'GowunDodum';font-size:19px;color:#94897a;text-align:center;line-height:1.5}
</style></head><body>
<div class="card">
  <div class="title">곰곰이 아이콘 비교 🐻</div>
  <div class="sub">폰마다 네모/동그라미로 잘리니 · 작은 크기까지 같이 봐요</div>
  <div class="row">
    <div class="col">
      <div class="name">A · 곰 크게</div>
      <div class="big"><img src="../../../public/icons/icon-512-v5.png"></div>
      <div class="smallrow">
        <div class="mini"><div class="sq"><img src="../../../public/icons/icon-512-v5.png"></div><div class="mlbl">네모 폰</div></div>
        <div class="mini"><div class="cir"><img src="../../../public/icons/icon-512-v5.png"></div><div class="mlbl">동그라미 폰</div></div>
      </div>
      <div class="desc">곰이 꽉 차서 존재감 최고<br>단, 동그라미 폰에선 모자·귀 끝이 살짝 잘릴 수 있음</div>
    </div>
    <div class="col">
      <div class="name">B · 여백 넉넉</div>
      <div class="big"><img src="../../../public/icons/icon-maskable-512-v5.png"></div>
      <div class="smallrow">
        <div class="mini"><div class="sq"><img src="../../../public/icons/icon-maskable-512-v5.png"></div><div class="mlbl">네모 폰</div></div>
        <div class="mini"><div class="cir"><img src="../../../public/icons/icon-maskable-512-v5.png"></div><div class="mlbl">동그라미 폰</div></div>
      </div>
      <div class="desc">어떤 모양으로 잘려도 곰이 안전<br>대신 곰이 한 뼘 작아 보임</div>
    </div>
  </div>
</div>
</body></html>
