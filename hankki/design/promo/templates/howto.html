<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  :root{--ink:#4a4136;--ink2:#94897a;--clay:#c47a58;--card:#fffdf8;--line:#e6ded0}
  body{background:#777}
  .card{position:relative;overflow:hidden;width:1080px;height:1350px;
    background:radial-gradient(130% 90% at 50% -5%,#fdfcf9,#f3eee4);padding:82px 76px 66px;display:flex;flex-direction:column;align-items:center}
  .tag{font-family:'GowunDodum';font-size:24px;letter-spacing:2px;color:#fff;background:var(--clay);padding:10px 26px;border-radius:999px}
  .title{font-family:'Jua';font-size:62px;color:var(--ink);letter-spacing:-1px;margin-top:24px;text-align:center}
  .title .c{color:var(--clay)}
  .sub{font-family:'GowunDodum';font-size:27px;color:var(--ink2);margin-top:12px}
  .steps{margin-top:46px;width:100%;display:flex;flex-direction:column;gap:22px}
  .st{display:flex;align-items:center;gap:26px;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:26px 32px;box-shadow:0 10px 26px rgba(120,95,65,.06)}
  .num{flex:0 0 auto;width:62px;height:62px;border-radius:50%;background:var(--clay);color:#fff;font-family:'Jua';font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(150,95,60,.24)}
  .st .tx{font-family:'GowunDodum';font-size:31px;color:var(--ink);line-height:1.35}
  .st .tx b{color:var(--clay);font-weight:400}
  .st .tx small{display:block;font-size:23px;color:var(--ink2);margin-top:4px}
  .foot{margin-top:auto;padding-top:34px;display:flex;align-items:center;gap:18px;justify-content:center}
  .foot svg{width:66px;height:66px}
  .foot .t{font-family:'Gaegu';font-weight:700;font-size:34px;color:var(--clay);line-height:1.3}
</style></head><body>
<div class="card">
  <div class="tag">한끼 · 테스터 참여 방법</div>
  <div class="title">이렇게 참여해요 <span class="c">(2분)</span></div>
  <div class="sub">안드로이드(갤럭시) 폰에서 진행해 주세요</div>

  <div class="steps">
    <div class="st"><div class="num">1</div><div class="tx"><b>초대 링크</b>를 안드로이드 폰에서 열기</div></div>
    <div class="st"><div class="num">2</div><div class="tx">‘<b>테스터가 되겠습니다</b>’ 누르기<small>Become a tester 버튼</small></div></div>
    <div class="st"><div class="num">3</div><div class="tx">잠시 뒤 <b>Play 스토어 → ‘설치’</b><small>안 뜨면 링크 다시 열거나 몇 분 후 재시도</small></div></div>
    <div class="st"><div class="num">4</div><div class="tx"><b>2주간</b> 지우지 말고 가끔 열어보기 🙏</div></div>
  </div>

  <div class="foot">
    <svg viewBox="0 0 48 48">
      <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
      <circle cx="24" cy="28" r="13" fill="#b98a63"/><ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
      <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
      <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
      <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
      <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
      <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/><circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/><circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    </svg>
    <div class="t">도와주셔서 감사해요!<br>흩어진 레시피를, 한곳에 💛</div>
  </div>
</div>
</body></html>
