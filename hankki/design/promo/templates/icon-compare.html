<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body{background:#777}
  .phone{position:relative;width:900px;height:1850px;border-radius:96px;background:#0d0d0f;padding:16px}
  .screen{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;
    background:radial-gradient(120% 90% at 78% 62%, #e8b78f 0%, #ecd9c3 34%, #efe4d4 60%, #f4ece0 100%)}
  .notch{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#0d0d0f;z-index:5}
  .status{position:absolute;top:0;left:0;right:0;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;font-family:'GowunDodum';font-size:26px;color:#3f3a33}
  .head{position:absolute;top:96px;left:0;right:0;text-align:center;font-family:'Jua';font-size:40px;color:#5b4a37}
  .head small{display:block;font-family:'GowunDodum';font-size:24px;color:#8a7c68;margin-top:6px}
  .rowlabel{font-family:'GowunDodum';font-size:25px;color:#6b5b46;margin:0 0 6px 8px}
  .sec{position:absolute;left:52px;right:52px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:34px;column-gap:30px}
  .app{display:flex;flex-direction:column;align-items:center;gap:12px}
  .ico{width:174px;height:174px;border-radius:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(90,65,45,.2);overflow:hidden}
  .ico svg{width:76%;height:76%;display:block}
  .lbl{font-family:'GowunDodum';font-size:24px;color:#463f36}
  .lbl .star{color:#c47a58;font-weight:700}
  img.ic{width:174px;height:174px;border-radius:44px;object-fit:cover;box-shadow:0 8px 18px rgba(90,65,45,.2)}
</style>
</head><body>
