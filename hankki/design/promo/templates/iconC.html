<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body{background:#8a8a8a;padding:44px;display:flex;gap:54px;align-items:flex-end}
  .col{display:flex;flex-direction:column;align-items:center;gap:16px}
  .ico{width:300px;height:300px;border-radius:66px;overflow:hidden;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.22);background:radial-gradient(120% 120% at 30% 18%,#faf7f0,#f0eadd)}
  .small{width:100px;height:100px;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 5px 14px rgba(0,0,0,.25)}
  .small .ico{width:300px;height:300px;border-radius:66px;transform:scale(0.3333);transform-origin:top left}
  .lbl{font-family:'GowunDodum';font-size:21px;color:#fff}
  .word{font-family:'Jua';line-height:.9;letter-spacing:-1px}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style></head><body>

<div class="col">
  <div class="ico" id="A"><div class="wrap"><svg viewBox="0 0 48 48" style="width:210px;height:210px" class="bear"></svg></div></div>
  <div class="small"><div class="ico"><div class="wrap"><svg viewBox="0 0 48 48" style="width:210px;height:210px" class="bear"></svg></div></div></div>
  <div class="lbl">C 원조 (글씨 없음)</div>
</div>

<div class="col">
  <div class="ico" id="B"><div class="wrap" style="gap:4px"><svg viewBox="0 0 48 48" style="width:166px;height:166px" class="bear"></svg><div class="word" style="font-size:58px;color:#9a7551">한끼</div></div></div>
  <div class="small"><div class="ico"><div class="wrap" style="gap:4px"><svg viewBox="0 0 48 48" style="width:166px;height:166px" class="bear"></svg><div class="word" style="font-size:58px;color:#9a7551">한끼</div></div></div></div>
  <div class="lbl">C + 한끼 (곰돌이색)</div>
</div>

<script>
  const BEAR=`
    <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
    <circle cx="14.5" cy="18" r="2.2" fill="#d9b593"/><circle cx="33.5" cy="18" r="2.2" fill="#d9b593"/>
    <circle cx="24" cy="28" r="13" fill="#b98a63"/>
    <ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
    <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
    <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
    <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
    <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    <circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    <circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>`;
  document.querySelectorAll('.bear').forEach(el=>el.innerHTML=BEAR)
</script>
</body></html>
