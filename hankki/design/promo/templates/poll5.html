<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body{background:#777}
  .card{position:relative;width:1080px;height:1350px;background:radial-gradient(130% 90% at 50% 0%,#fdfcf9,#f4efe6);
    padding:72px 70px 60px;display:flex;flex-direction:column;align-items:center}
  .top{font-family:'Jua';font-size:56px;color:#5f4d3b;letter-spacing:-1px;text-align:center;line-height:1.3}
  .top .c{color:#c47a58}
  .sub{font-family:'GowunDodum';font-size:27px;color:#94897a;margin-top:14px;text-align:center}
  .grid{margin-top:44px;display:flex;flex-wrap:wrap;justify-content:center;gap:38px 46px;width:100%}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px;width:246px}
  .tag{font-family:'Jua';font-size:32px;color:#fff;background:#c47a58;width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;box-shadow:0 7px 16px rgba(150,95,60,.24)}
  .ico{width:230px;height:230px;border-radius:54px;overflow:hidden;position:relative;box-shadow:0 14px 32px rgba(110,84,58,.16)}
  .word{font-family:'Jua';line-height:.9;letter-spacing:-1px}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .foot{margin-top:auto;padding-top:30px;text-align:center}
  .foot .t{font-family:'Gaegu';font-weight:700;font-size:36px;color:#c47a58}
</style></head><body>
<div class="card">
  <div class="top">한끼 앱 아이콘, <span class="c">몇 번</span>이 예뻐?</div>
  <div class="sub">제일 예쁜 번호로 답해주세요 :)</div>

  <div class="grid">
    <!-- A -->
    <div class="cell"><div class="tag">A</div>
      <div class="ico" style="background:radial-gradient(120% 120% at 30% 20%,#faf7f0,#f2ece0)">
        <div class="wrap" style="gap:16px"><div class="word" style="font-size:92px;color:#5f4d3b">한끼</div><div style="width:74px;height:7px;background:#c47a58;border-radius:99px"></div></div>
      </div></div>
    <!-- B -->
    <div class="cell"><div class="tag">B</div>
      <div class="ico" style="background:radial-gradient(120% 120% at 30% 20%,#cf8863,#bd6f4c)">
        <div class="wrap" style="gap:14px"><div class="word" style="font-size:94px;color:#fbf3e9">한끼</div><div style="width:74px;height:7px;background:rgba(255,255,255,.72);border-radius:99px"></div></div>
      </div></div>
    <!-- C -->
    <div class="cell"><div class="tag">C</div>
      <div class="ico" style="background:radial-gradient(120% 120% at 30% 18%,#faf7f0,#f0eadd)">
        <div class="wrap"><svg viewBox="0 0 48 48" style="width:160px;height:160px" class="bear"></svg></div>
      </div></div>
    <!-- D -->
    <div class="cell"><div class="tag">D</div>
      <div class="ico" style="background:radial-gradient(120% 120% at 30% 18%,#cf8863,#bd6f4c)">
        <div class="wrap" style="gap:2px"><svg viewBox="0 0 48 48" style="width:116px;height:116px;margin-top:8px" class="bearL"></svg><div class="word" style="font-size:46px;color:#fbf3e9">한끼</div></div>
      </div></div>
    <!-- E -->
    <div class="cell"><div class="tag">E</div>
      <div class="ico" style="background:radial-gradient(120% 120% at 30% 18%,#faf7f0,#f0eadd)">
        <div class="wrap" style="gap:2px"><svg viewBox="0 0 48 48" style="width:120px;height:120px" class="bear"></svg><div class="word" style="font-size:44px;color:#9a7551">한끼</div></div>
      </div></div>
  </div>

  <div class="foot"><div class="t">A · B · C · D · E — 편하게 번호로 답해줘 💛</div></div>
</div>
<script>
  const BEAR=`
    <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
    <circle cx="14.5" cy="18" r="2.2" fill="#d9b593"/><circle cx="33.5" cy="18" r="2.2" fill="#d9b593"/>
    <circle cx="24" cy="28" r="13" fill="#b98a63"/>
    <ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
    <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
    <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
    <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
    <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    <circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    <circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>`;
  const BEARL=BEAR.replace('fill="#b98a63"/>\n    <ellipse','fill="#c69a72"/>\n    <ellipse').replace('fill="#ecd9bd"','fill="#efe0c9"')
  document.querySelectorAll('.bear').forEach(el=>el.innerHTML=BEAR)
  document.querySelectorAll('.bearL').forEach(el=>el.innerHTML=BEARL)
</script>
</body></html>
