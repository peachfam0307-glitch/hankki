<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body{background:#777}
  .phone{position:relative;width:900px;height:1850px;border-radius:96px;background:#0d0d0f;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .screen{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;
    background:radial-gradient(120% 90% at 78% 62%, #e8b78f 0%, #ecd9c3 34%, #efe4d4 60%, #f4ece0 100%)}
  /* 상태바 */
  .status{position:absolute;top:0;left:0;right:0;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;font-family:'GowunDodum';font-size:26px;color:#3f3a33}
  .status .r{display:flex;align-items:center;gap:12px;font-size:22px}
  .notch{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#0d0d0f}
  /* 앱 그리드 */
  .grid{position:absolute;top:150px;left:44px;right:44px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:40px;column-gap:24px}
  .app{display:flex;flex-direction:column;align-items:center;gap:12px}
  .ico{width:132px;height:132px;border-radius:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(60,45,30,.14);overflow:hidden}
  .ico svg{width:76px;height:76px}
  .lbl{font-family:'GowunDodum';font-size:23px;color:#463f36;text-shadow:0 1px 2px rgba(255,255,255,.5)}
  .hankki{width:132px;height:132px;border-radius:34px;object-fit:cover;box-shadow:0 8px 18px rgba(90,65,45,.22)}
  /* 하단 독 */
  .dock{position:absolute;bottom:52px;left:44px;right:44px;height:150px;border-radius:44px;background:rgba(255,255,255,.34);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-around;padding:0 20px}
  .dock .ico{width:120px;height:120px;box-shadow:none}
  .dots{position:absolute;bottom:224px;left:0;right:0;display:flex;justify-content:center;gap:14px}
  .dots span{width:12px;height:12px;border-radius:50%;background:rgba(80,60,40,.28)}
  .dots span.on{background:rgba(80,60,40,.7)}
</style></head><body>
<div class="phone">
 <div class="screen">

  <div class="status"><span>10:30</span><span class="r">📶 100% 🔋</span></div>

    <div class="app"><div class="ico" style="background:#03c75a"><span style="font-family:'Jua';font-size:78px;color:#fff">N</span></div><div class="lbl">네이버</div></div>
    <div class="app"><div class="ico" style="background:#fff"><span style="font-family:'Jua';font-size:30px;color:#e94b4b;background:#e94b4b;color:#fff;border-radius:50%;width:88px;height:88px;display:flex;align-items:center;justify-content:center">쿠팡</span></div><div class="lbl">쿠팡</div></div>

    <div class="app"><div class="ico" style="background:#fff"><svg viewBox="0 0 48 48"><rect x="7" y="13" width="34" height="22" rx="7" fill="#ff0000"/><path d="M21 19l9 5-9 5z" fill="#fff"/></svg></div><div class="lbl">YouTube</div></div>

    <div class="app"><div class="ico" style="background:#1d8fff"><svg viewBox="0 0 48 48"><path d="M10 14a3 3 0 0 1 3-3h22a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H21l-8 7v-7h-0a3 3 0 0 1-3-3z" fill="#fff"/><circle cx="19" cy="20.5" r="2" fill="#1d8fff"/><circle cx="24" cy="20.5" r="2" fill="#1d8fff"/><circle cx="29" cy="20.5" r="2" fill="#1d8fff"/></svg></div><div class="lbl">메시지</div></div>
    <div class="app"><div class="ico" style="background:#fff"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" fill="none" stroke="#4285f4" stroke-width="6"/><path d="M24 9a15 15 0 0 1 13 7.5H24z" fill="#ea4335"/><path d="M37 16.5A15 15 0 0 1 30 37l-6-13z" fill="#fbbc05"/><path d="M30 37A15 15 0 0 1 11 31l13-7z" fill="#34a853"/><circle cx="24" cy="24" r="6" fill="#4285f4"/></svg></div><div class="lbl">Chrome</div></div>

    <!-- row 4 -->
    <div class="app"><div class="ico" style="background:#fff"><svg viewBox="0 0 48 48"><path d="M13 9l24 15-24 15z" fill="none"/><path d="M13 9v30l11-7-11-7z" fill="#34a853"/><path d="M13 9l14 8.5L20 24z" fill="#4285f4"/><path d="M13 39l14-8.5L20 24z" fill="#ea4335"/><path d="M27 17.5L37 24l-10 6.5L20 24z" fill="#fbbc05"/></svg></div><div class="lbl">Play 스토어</div></div>

    <div class="app"><div class="ico" style="background:#f3efe8"><svg viewBox="0 0 48 48" fill="none" stroke="#4a4136" stroke-width="2.6" stroke-linecap="round"><circle cx="24" cy="25" r="15"/><path d="M24 16v9l6 4"/><path d="M18 7h12"/></svg></div><div class="lbl">시계</div></div>
    <div class="app"><div class="ico" style="background:#e8552e"><svg viewBox="0 0 48 48"><path d="M12 10h18l6 6v22H12z" fill="#fff"/><path d="M30 10v6h6z" fill="#f3cdbf"/></svg></div><div class="lbl">메모</div></div>
    <!-- row 5 — 우리 앱! -->
    <div class="app"><img class="hankki" src="../../../public/icons/icon-512-v5.png"><div class="lbl">한끼</div></div>
  </div>

  <div class="dots"><span></span><span class="on"></span><span></span><span></span></div>

    <div class="ico" style="background:#20c65a"><svg viewBox="0 0 48 48"><path d="M14 10c-2 0-4 2-4 5 0 12 11 23 23 23 3 0 5-2 5-4 0-1-.5-2-1.5-2.5l-6-2.5c-1-.4-2 0-2.5.8l-1.5 2c-4-2-7-5-9-9l2-1.5c.8-.5 1.2-1.5.8-2.5l-2.5-6C20 11.5 19 11 18 11z" fill="#fff"/></svg></div>
    <div class="ico" style="background:#e88a3c"><svg viewBox="0 0 48 48"><circle cx="24" cy="18" r="8" fill="#fff"/><path d="M10 40c0-8 6-12 14-12s14 4 14 12z" fill="#fff"/></svg></div>

</div>
