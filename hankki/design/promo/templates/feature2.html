<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  :root{--ink:#4a4136;--ink2:#9a8f7e;--clay:#c47a58;--line:#ece5d8}
  body{background:#777}
  /* 더 하얀·포근한 배경 (어제 느낌) */
  .fg{position:relative;overflow:hidden;width:1024px;height:500px;
    background:radial-gradient(130% 120% at 22% 0%, #fdfcf9 0%, #f7f4ee 60%, #f2eee6 100%);
    display:flex;align-items:center;padding:0 72px}

  .left{position:relative;z-index:5;width:520px}
  .word-row{display:flex;align-items:baseline;gap:18px}
  .word{font-family:'Jua';font-size:76px;color:#5f4d3b;letter-spacing:-1px;line-height:.9}
  .latin{font-family:'GowunDodum';font-size:24px;letter-spacing:7px;color:#c3b6a2}
  .hero{font-family:'Jua';font-size:47px;line-height:1.3;color:var(--ink);letter-spacing:-1px;margin-top:26px}
  .hero .c{color:var(--clay)}
  .sub{font-family:'GowunDodum';font-size:23px;color:var(--ink2);margin-top:18px;letter-spacing:-.3px}
  .pills{display:flex;gap:13px;margin-top:26px}
  .pill{font-family:'GowunDodum';font-size:21px;color:#8a7c68;background:#fff;border:1.5px solid var(--line);
    border-radius:999px;padding:11px 22px;box-shadow:0 6px 16px rgba(120,95,65,.06)}

  /* 오른쪽: 진짜 레시피 카드 목업 */
  .stage{position:absolute;right:44px;top:50%;transform:translateY(-50%);width:420px;height:500px}
  .card{position:absolute;left:78px;top:74px;width:288px;background:#fff;border-radius:26px;z-index:5;
    box-shadow:0 26px 48px rgba(110,84,58,.16);transform:rotate(4deg);overflow:hidden}
  .card .photo{height:118px;background:linear-gradient(160deg,#efe6d5,#e7dcc6);display:flex;align-items:center;justify-content:center}
  .card .photo svg{width:70px;height:70px}
  .card .body{padding:18px 20px 20px}
  .card .t{font-family:'Jua';font-size:27px;color:var(--ink);letter-spacing:-.5px}
  .card .lbl{font-family:'GowunDodum';font-size:15px;color:#b3a794;margin:11px 0 7px}
  .card .ing{font-family:'GowunDodum';font-size:18px;color:#6f6455;line-height:1.7}
  .card .ing i{color:#c9b48f;font-style:normal;margin-right:9px}
  .card .tags{display:flex;gap:8px;margin-top:14px}
  .card .tag{font-family:'GowunDodum';font-size:15px;color:#8a7c68;background:#f5f0e7;border-radius:8px;padding:6px 13px}

  /* 곰곰 셰프 아바타 — 카드 왼쪽 아래 빼꼼 */
  .bear{position:absolute;left:-14px;top:278px;width:128px;height:128px;border-radius:50%;
    background:#f6f3ee;box-shadow:0 12px 26px rgba(110,84,58,.16);z-index:3;overflow:hidden}
  .bear svg{width:100%;height:100%;transform:scale(1.06)}
  /* 말풍선 */
  .bubble{position:absolute;left:104px;top:22px;z-index:7;font-family:'Gaegu';font-weight:700;font-size:26px;color:#c47a58;
    background:#fff;border:2px solid #f0d9cd;border-radius:18px;padding:8px 18px;box-shadow:0 8px 18px rgba(110,84,58,.10)}
  .bubble::after{content:'';position:absolute;left:26px;bottom:-11px;width:18px;height:18px;background:#fff;
    border-right:2px solid #f0d9cd;border-bottom:2px solid #f0d9cd;transform:rotate(45deg)}
  /* 포스트잇 */
  .note{position:absolute;right:0px;top:288px;z-index:6;width:108px;height:94px;background:#fbeec6;border-radius:6px;
    box-shadow:0 10px 22px rgba(110,84,58,.14);transform:rotate(7deg);display:flex;align-items:center;justify-content:center;
    font-family:'Gaegu';font-weight:700;font-size:22px;color:#9a7b52;text-align:center;line-height:1.25}
  /* 하트 스티커 (표정) */
  .heart{position:absolute;right:30px;top:120px;width:50px;height:50px;z-index:6;transform:rotate(8deg)}
</style></head><body>
<div class="fg">
  <div class="left">
    <div class="word-row"><span class="word">한끼</span><span class="latin">HANKKI</span></div>
    <div class="hero">흩어진 레시피를,<br><span class="c">내 레시피북</span>으로.</div>
    <div class="sub">장보고 · 요리하고 · 내 맘대로 꾸미기까지</div>
    <div class="pills"><span class="pill">레시피북</span><span class="pill">꾸미기</span><span class="pill">장보기</span></div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="photo">
        <svg viewBox="0 0 48 48"><circle cx="22" cy="27" r="12" fill="#3f3f43"/><circle cx="22" cy="27" r="9.4" fill="#55555a"/><circle cx="22" cy="27" r="5.2" fill="#f6ead0"/><circle cx="22" cy="27" r="2.6" fill="#e6a93c"/><rect x="32" y="25.4" width="13" height="3.2" rx="1.6" fill="#8a5a37"/></svg>
      </div>
      <div class="body">
        <div class="t">엄마표 김치볶음밥</div>
        <div class="lbl">재료</div>
        <div class="ing"><i>·</i>김치 1컵<br><i>·</i>밥 1공기<br><i>·</i>삼겹살 100g</div>
        <div class="tags"><span class="tag">한식</span><span class="tag">15분</span></div>
      </div>
    </div>

    <div class="bubble">맛있어!</div>

    <div class="bear">
      <svg viewBox="0 0 48 48">
        <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
        <circle cx="14.5" cy="18" r="2.2" fill="#d9b593"/><circle cx="33.5" cy="18" r="2.2" fill="#d9b593"/>
        <circle cx="24" cy="28" r="13" fill="#b98a63"/>
        <ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
        <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
        <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
        <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
        <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
        <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
        <g transform="rotate(14 39.5 30)">
          <rect x="38.4" y="28" width="2.2" height="7.6" rx="1.1" fill="#f7f3e4" stroke="#d5cbaa" stroke-width="0.6"/>
          <path d="M39.5 28.2c-.8-1.9-.8-3.8-.1-5.7M38.8 28.1c-1.4-1.2-2.2-2.8-2.5-4.6M40.2 28.1c1.1-1.4 1.7-3 1.8-4.9" stroke="#7fa05a" stroke-width="1.25" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <svg class="heart" viewBox="0 0 48 48"><path d="M24 41C8 29.5 8.5 16.5 16 13c4.3-2 8 .9 8 4.6 0-3.7 3.7-6.6 8-4.6 7.5 3.5 8 16.5-8 28Z" fill="#e79a92" stroke="#c9776e" stroke-width="1.6" stroke-linejoin="round"/><circle cx="20" cy="24" r="1.3" fill="#7a4a44"/><circle cx="28" cy="24" r="1.3" fill="#7a4a44"/><path d="M21 28q3 2 6 0" stroke="#7a4a44" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>

    <div class="note">애들이<br>좋아함</div>
  </div>
</div>
</body></html>
