<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  :root{--bg:#f7f4ee;--ink:#4a4136;--ink2:#94897a;--line:#ece5d8;--clay:#c47a58;--card:#fff}
  body{background:#777}
  .card{position:relative;overflow:hidden;width:1080px;height:1350px;background:var(--bg);color:var(--ink);
    padding:104px 96px 92px;display:flex;flex-direction:column}
  .bg-wash{position:absolute;inset:0;background:radial-gradient(130% 90% at 80% 4%, #fdfcf9 0%, #f7f4ee 58%, #f2eee6 100%)}
  .z{position:relative;z-index:2}
  .word{font-family:'Jua';font-size:66px;color:#5f4d3b;letter-spacing:-1px;line-height:1}
  .now{font-family:'GowunDodum';font-size:23px;letter-spacing:4px;color:var(--ink2);margin-top:16px}
  .now b{color:var(--clay);font-weight:400}

  .kick{font-family:'GowunDodum';font-size:31px;color:var(--ink2);letter-spacing:-.3px;margin-top:96px}
  .hero{font-family:'Jua';font-size:92px;line-height:1.16;letter-spacing:-1.5px;margin-top:22px}
  .hero .c{color:var(--clay)}
  .rule{width:96px;height:5px;background:var(--clay);border-radius:99px;margin-top:52px;opacity:.9}

  .diff{margin-top:60px;display:flex;flex-direction:column;gap:38px}
  .row{display:flex;align-items:center;gap:34px}
  .ic{flex:0 0 auto;width:104px;height:104px;border-radius:28px;background:var(--card);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(120,95,65,.06)}
  .ic svg{width:56px;height:56px}
  .rt{font-family:'Jua';font-size:44px;line-height:1.2;color:var(--ink)}
  .rt .c{color:var(--clay)}
  .rd{font-family:'GowunDodum';font-size:29px;color:var(--ink2);margin-top:8px;line-height:1.4}

  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
  .slogan{font-family:'Jua';font-size:44px;color:#5f4d3b;line-height:1.32;letter-spacing:-.5px}
  .store{text-align:right}
  .gp{display:inline-flex;align-items:center;gap:12px;background:#4a4136;color:#fff;border-radius:16px;padding:16px 24px}
  .gp .tri{width:0;height:0;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
  .gp .gt{display:block;font-family:'GowunDodum';font-size:19px;line-height:1;color:#cabfae;letter-spacing:.5px}
  .gp .gb{display:block;font-family:'Jua';font-size:31px;line-height:1.05;color:#fff;margin-top:4px}
  .find{font-family:'GowunDodum';font-size:24px;color:var(--ink2);margin-top:16px}
  .find b{color:var(--clay);font-weight:400}
</style></head><body>
<div class="card">
  <div class="bg-wash"></div>

  <!-- 곰곰 셰프 — 표지 뒤에서 빼꼼 (대표 그래픽과 톤 통일) -->
  <div style="position:absolute;top:566px;left:626px;width:118px;height:118px;border-radius:50%;background:#f6f3ee;box-shadow:0 12px 26px rgba(110,84,58,.16);z-index:1;overflow:hidden">
    <svg viewBox="0 0 48 48" style="width:100%;height:100%;transform:scale(1.06)">
      <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
      <circle cx="14.5" cy="18" r="2.2" fill="#d9b593"/><circle cx="33.5" cy="18" r="2.2" fill="#d9b593"/>
      <circle cx="24" cy="28" r="13" fill="#b98a63"/>
      <ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
      <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
      <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
      <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
      <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
      <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <g transform="rotate(14 39.5 30)">
        <rect x="38.4" y="28" width="2.2" height="7.6" rx="1.1" fill="#f7f3e4" stroke="#d5cbaa" stroke-width="0.6"/>
        <path d="M39.5 28.2c-.8-1.9-.8-3.8-.1-5.7M38.8 28.1c-1.4-1.2-2.2-2.8-2.5-4.6M40.2 28.1c1.1-1.4 1.7-3 1.8-4.9" stroke="#7fa05a" stroke-width="1.25" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- 꾸미기 맛보기: 작게 꾸민 레시피 표지 하나 (셀링포인트 시각화) -->
  <div style="position:absolute;top:330px;right:70px;width:268px;z-index:1;transform:rotate(-5deg);filter:drop-shadow(0 20px 34px rgba(90,65,45,.17))">
    <div style="background:#fffdf8;border-radius:24px;padding:16px 16px 18px">
      <div style="position:relative;height:216px;border-radius:15px;overflow:hidden;background-color:#f4efe2;background-image:linear-gradient(#e7ddc7 1.3px,transparent 1.3px),linear-gradient(90deg,#e7ddc7 1.3px,transparent 1.3px);background-size:33px 33px">
        <div style="position:absolute;top:-4px;right:-16px;width:120px;height:30px;background:rgba(214,150,120,.68);transform:rotate(11deg);box-shadow:0 3px 8px rgba(70,60,45,.12)"></div>
        <div style="position:absolute;top:22px;left:0;right:0;text-align:center;font-family:'Gaegu';font-weight:700;font-size:35px;color:#c47a58;transform:rotate(-3deg)">우리집 김치찌개</div>
        <div style="position:absolute;left:52%;top:58%;transform:translate(-50%,-50%);width:96px;height:96px"><svg viewBox="0 0 48 48"><ellipse cx="24" cy="30" rx="14" ry="11" fill="#4a4a4e"/><path d="M10 27a14 8 0 0 0 28 0" fill="#3c3c40"/><path d="M11 25h26v3H11z" fill="#5a5a5f"/><circle cx="20" cy="24" r="1.7" fill="#e0a83a"/><circle cx="27" cy="26" r="1.7" fill="#cf6f5a"/><circle cx="23" cy="27" r="1.5" fill="#8ca86e"/><path d="M20 16c-1.5 2 .5 3.2-.5 5M25 15c-1.5 2 .5 3.2-.5 5" stroke="#cfcfcf" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></svg></div>
        <div style="position:absolute;left:14px;bottom:12px;width:46px;height:46px"><svg viewBox="0 0 48 48"><path d="M24 41C8 29.5 8.5 16.5 16 13c4.3-2 8 .9 8 4.6 0-3.7 3.7-6.6 8-4.6 7.5 3.5 8 16.5-8 28Z" fill="#dd918a" stroke="#71604b" stroke-width="2" stroke-linejoin="round"/></svg></div>
        <div style="position:absolute;right:16px;bottom:20px;width:40px;height:40px"><svg viewBox="0 0 48 48"><path d="M24 5.5l5.2 10 11.2 1.6-8.1 7.8 1.9 11.1L24 32.6 13.8 38l1.9-11.1L7.6 19l11.2-1.6z" fill="#e0c169" stroke="#71604b" stroke-width="2" stroke-linejoin="round"/></svg></div>
      </div>
      <div style="height:11px;background:#eee7d8;border-radius:6px;margin-top:14px"></div>
      <div style="height:11px;width:58%;background:#eee7d8;border-radius:6px;margin-top:8px"></div>
    </div>
  </div>
  <div style="position:absolute;top:636px;right:56px;width:300px;text-align:center;z-index:1;transform:rotate(-4deg);font-family:'Gaegu';font-weight:700;font-size:29px;color:#b58a68;line-height:1.32">스티커·테이프·손글씨로<br><span style="color:#c47a58">표지도 내 맘대로 ♥</span></div>

  <div class="z">
    <div class="word">한끼</div>
    <div class="now">N O W&nbsp;&nbsp;O N&nbsp;&nbsp;<b>GOOGLE&nbsp;PLAY</b></div>
  </div>

  <div class="z">
    <div class="kick">인스타 · 유튜브 · 사진 속, 저장만 하고 못 찾던 그 레시피</div>
    <div class="hero">이제 <span class="c">한끼</span>에<br>다 모여요.</div>
    <div class="rule"></div>
  </div>

  <div class="z diff">
    <div class="row">
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#4a4136" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7v18"/><path d="M16 18l8 8 8-8"/><path d="M9 29v6a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3v-6"/></svg></div>
      <div><div class="rt">남의 레시피 말고, <span class="c">내 레시피</span></div><div class="rd">화면 캡처 한 장이면, 흩어진 레시피가 내 걸로</div></div>
    </div>
    <div class="row">
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#4a4136" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 24C18.5 16 11 16.5 11 22s7.5 5.5 13 2"/><path d="M24 24c5.5-8 13-7.5 13-2s-7.5 5.5-13 2"/><circle cx="24" cy="24" r="2.6" fill="#4a4136" stroke="none"/><path d="M21.5 26l-4.5 9M26.5 26l4.5 9"/></svg></div>
      <div><div class="rt">표지를 <span class="c">내 취향대로</span> 꾸미기</div><div class="rd">다꾸 감성으로 만드는 세상 하나뿐인 레시피북</div></div>
    </div>
    <div class="row">
      <div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#4a4136" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11H13l3.4 17.2a2.6 2.6 0 0 0 2.55 2.1h13.2a2.6 2.6 0 0 0 2.5-1.9L40.5 17H15"/><circle cx="20.5" cy="37" r="2.5"/><circle cx="33" cy="37" r="2.5"/></svg></div>
      <div><div class="rt">장보기부터 <span class="c">살림까지</span></div><div class="rd">주부 18년 안목의 살림템 추천은 덤</div></div>
    </div>
  </div>

  <div class="z foot">
    <div class="slogan">흩어진 레시피를,<br>한곳에.</div>
    <div class="store">
      <span class="gp"><span class="tri"></span><span><span class="gt">지금 다운로드</span><span class="gb">Google Play</span></span></span>
      <div class="find">‘<b>한끼</b>’ 검색</div>
    </div>
  </div>
</div>
</body></html>
