<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  :root{--ink:#4a4136;--ink2:#8f8474;--clay:#c47a58;--card:#fffdf8;--line:#e6ded0}
  body{background:#777}
  .card{position:relative;overflow:hidden;width:1080px;height:1350px;
    background:radial-gradient(130% 90% at 50% -5%,#fdfcf9,#f1ece2);padding:64px 68px 56px;display:flex;flex-direction:column;align-items:center}

  /* 플랫폼 대표 배지 */
  .plat{display:flex;align-items:center;gap:20px;background:#eef2f6;border:2.5px solid #d7dee6;border-radius:999px;padding:16px 40px 16px 30px}
  .plat .apple{width:54px;height:54px}
  .plat .pt{font-family:'Jua';font-size:46px;color:#5b6675;letter-spacing:-.5px}
  .plat .pt small{font-family:'GowunDodum';font-size:26px;color:#7a838f;letter-spacing:0}

  .title{font-family:'Jua';font-size:60px;color:var(--ink);letter-spacing:-1px;margin-top:22px;text-align:center;line-height:1.12}
  .title .c{color:var(--clay)}

  /* 왕 큰 핵심 배너 */
  .alert{margin-top:26px;width:100%;background:linear-gradient(180deg,#c8825f,#bd6f4c);border-radius:30px;padding:34px 40px;box-shadow:0 16px 34px rgba(170,95,55,.28);display:flex;flex-direction:column;gap:14px}
  .al{display:flex;align-items:center;gap:22px;justify-content:center}
  .al .em{font-size:52px;line-height:1}
  .al .tx{font-family:'Jua';font-size:52px;color:#fff;letter-spacing:-.5px}
  .al .tx u{text-decoration:none;color:#ffe7b0}
  .al .tx .big{font-size:62px}
  .aldiv{height:2px;background:rgba(255,255,255,.28);margin:2px 30px}

  /* 사파리 경고 스트립 */
  .warn{margin-top:20px;width:100%;display:flex;align-items:center;gap:20px;background:#eef4fb;border:2.5px solid #cddff2;border-radius:22px;padding:24px 30px}
  .warn .wic{font-size:44px;line-height:1;flex:0 0 auto}
  .warn .wt{font-family:'GowunDodum';font-size:29px;color:#4877a8;line-height:1.4}
  .warn .wt b{color:#2f6bb0;font-weight:400}

  .urlchip{margin-top:18px;font-family:'GowunDodum';font-size:30px;color:var(--clay);background:#fff;border:2px dashed #e0cdb9;border-radius:16px;padding:14px 30px;letter-spacing:.3px}

  .steps{margin-top:20px;width:100%;display:flex;flex-direction:column;gap:15px}
  .st{display:flex;align-items:center;gap:24px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:20px 30px;box-shadow:0 8px 22px rgba(120,95,65,.05)}
  .num{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--clay);color:#fff;font-family:'Jua';font-size:31px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(150,95,60,.24)}
  .st .tx{font-family:'GowunDodum';font-size:30px;color:var(--ink);line-height:1.3}
  .st .tx b{color:var(--clay);font-weight:400}
  .st .tx small{display:block;font-size:22px;color:var(--ink2);margin-top:3px}

  .foot{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:18px;justify-content:center}
  .foot svg{width:58px;height:58px}
  .foot .t{font-family:'Gaegu';font-weight:700;font-size:32px;color:var(--clay);line-height:1.25;text-align:center}
</style></head><body>
<div class="card">
  <div class="plat">
    <svg class="apple" viewBox="0 0 48 48" fill="#5b6675"><path d="M32.6 25.3c0-4 3.3-5.9 3.4-6-1.9-2.7-4.8-3.1-5.8-3.2-2.5-.2-4.8 1.4-6 1.4-1.2 0-3.2-1.4-5.2-1.4-2.7 0-5.1 1.5-6.5 3.9-2.8 4.8-.7 11.9 2 15.8 1.3 1.9 2.9 4 4.9 3.9 2-.1 2.7-1.3 5.1-1.3 2.4 0 3 1.3 5.1 1.2 2.1 0 3.4-1.9 4.7-3.8 1.5-2.2 2.1-4.3 2.1-4.4-.1 0-4-1.5-4-6.1zM28.8 13.4c1.1-1.3 1.8-3.1 1.6-4.9-1.6.1-3.5 1-4.6 2.3-1 1.2-1.9 3-1.6 4.8 1.7.1 3.5-.9 4.6-2.2z"/></svg>
    <div class="pt">아이폰<br><small>앱스토어 없이 · 사파리로</small></div>
  </div>

  <div class="title">이렇게 <span class="c">설치</span>해요</div>

  <div class="alert">
    <div class="al"><span class="em">📲</span><span class="tx"><u class="big">오늘</u> 꼭 설치!</span></div>
    <div class="aldiv"></div>
    <div class="al"><span class="em">🗓️</span><span class="tx"><u>8월 10일</u>까지 유지</span></div>
  </div>

  <div class="warn">
    <span class="wic">🧭</span>
    <div class="wt">아이폰은 <b>꼭 사파리(Safari)</b>로 열어주세요. 크롬·카톡 브라우저에선 ‘홈 화면에 추가’가 안 나와요!</div>
  </div>

  <div class="urlchip">peachfam0307-glitch.github.io/hankki</div>

  <div class="steps">
    <div class="st"><div class="num">1</div><div class="tx"><b>사파리</b>로 위 주소 열기</div></div>
    <div class="st"><div class="num">2</div><div class="tx">아래 <b>공유 버튼</b> 탭<small>네모 + 위 화살표 모양</small></div></div>
    <div class="st"><div class="num">3</div><div class="tx"><b>‘홈 화면에 추가’</b> → 추가<small>메뉴를 조금 내리면 있어요</small></div></div>
    <div class="st"><div class="num">4</div><div class="tx">홈 화면 <b>한끼 아이콘</b>으로 실행!</div></div>
  </div>

  <div class="foot">
    <svg viewBox="0 0 48 48">
      <circle cx="14.5" cy="18" r="4.6" fill="#b98a63"/><circle cx="33.5" cy="18" r="4.6" fill="#b98a63"/>
      <circle cx="24" cy="28" r="13" fill="#b98a63"/><ellipse cx="24" cy="32.5" rx="6.4" ry="4.6" fill="#ecd9bd"/>
      <rect x="22.6" y="30" width="2.8" height="2.2" rx="1.1" fill="#5f4632"/>
      <path d="M24 32.4v1.6M24 34c-.9.9-2 .9-2.8.2M24 34c.9.9 2 .9 2.8.2" stroke="#5f4632" stroke-width="1" fill="none" stroke-linecap="round"/>
      <circle cx="18.6" cy="27.5" r="1.35" fill="#3d3830"/><circle cx="29.4" cy="27.5" r="1.35" fill="#3d3830"/>
      <circle cx="15.6" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/><circle cx="32.4" cy="31" r="2.1" fill="#f0b9a6" opacity="0.75"/>
      <rect x="15.5" y="14.6" width="17" height="3.6" rx="1.8" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
      <circle cx="16.8" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/><circle cx="24" cy="10.6" r="3.9" fill="#fff" stroke="#e2ded2" stroke-width="1"/><circle cx="31.2" cy="12.6" r="3.4" fill="#fff" stroke="#e2ded2" stroke-width="1"/>
    </svg>
    <div class="t">도와주셔서 감사해요!<br>흩어진 레시피를, 한곳에 💛</div>
  </div>
</div>
</body></html>
