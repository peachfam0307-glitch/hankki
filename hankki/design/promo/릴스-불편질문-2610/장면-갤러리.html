<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:D;src:url(dohyeon-korean-400.woff2)}
@font-face{font-family:P;src:url(nanumpen-korean-400.woff2)}
@font-face{font-family:G;src:url(gaegu-korean-400.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:sans-serif}
.bg{position:absolute;left:0;top:-8px;width:1080px;height:1935px;background:url(q2bg.png) center/cover;animation:push 3s linear both}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.04)}}
.scr{position:absolute;left:352px;top:270px;width:374px;height:796px;border-radius:38px;overflow:hidden;background:#fff}
.grid{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;animation:scroll 2.4s cubic-bezier(.45,0,.25,1) .1s both}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-2950px)}}
.t{aspect-ratio:9/16;position:relative;overflow:hidden;background:#fff}
.t img{position:absolute;left:0;width:100%;height:46%;object-fit:cover}
.t b{position:absolute;left:5px;right:5px;font:700 13px/1.15 sans-serif;color:#222}
.t i{position:absolute;left:6px;height:4px;border-radius:2px;background:#ddd}
.v{background:#111}.v img{top:30%;height:40%}.v b{bottom:22%;text-align:center;color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:2px}
.ig img{top:12%;height:58%}.ig b{top:73%;font-weight:400;font-size:11px}
.bl b{top:6%;font-size:14px}.bl img{top:24%}
.tag{position:absolute;left:600px;top:160px;padding:18px 34px;font-family:D;font-size:62px;background:#f6d8cd;color:#2f2823;rotate:6deg;box-shadow:0 14px 22px -8px rgba(40,30,20,.3)}
.tag b{font-weight:400;color:#b5583a}
.sfx{position:absolute;left:90px;top:1110px;font-family:D;font-size:170px;color:#fffaf0;-webkit-text-stroke:14px #6b4f3a;paint-order:stroke fill;text-shadow:0 10px 0 #6b4f3a;rotate:-6deg;opacity:0;animation:bigpop .35s 2.35s cubic-bezier(.2,1.5,.4,1) both}
@keyframes bigpop{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
</style>
<div class="bg"></div>
<div class="scr"><div class="grid" id="g"></div></div>
<div class="tag"><b id="n">0</b> / 3,000장</div>
<div class="sfx">어딨어?!</div>
<script>
const N=['통단호박 크림스프','계란후라이조림','집에서 하는 족발','감자타코','양배추 돼지고기 볶음','고등어조림','고등어구이','고등어김치찜','황태국','황태장아찌','얼큰 샤브 칼국수','순살찜닭','양배추나물','오징어 감자조림']
const SUB=['간장 2스푼 넣고','중불에서 5분','설탕 반 스푼만','마지막에 참기름','물 3컵 붓고','뚜껑 덮고 10분']
const g=document.getElementById('g');const K=['v','ig','bl']
for(let i=0;i<3*60;i++){const k=i%14,ty=K[(i*7+Math.floor(i/3))%3];const d=document.createElement('div');d.className='t '+ty
 let h='<img decoding="sync" loading="eager" src="d_r'+String(k).padStart(2,'0')+'.jpg">'
 if(ty==='v')h+='<b>'+SUB[i%6]+'</b>'
 if(ty==='ig')h+='<b>'+N[k]+' 황금레시피 저장각</b><i style="top:84%;width:60%"></i><i style="top:89%;width:40%"></i>'
 if(ty==='bl')h+='<b>'+N[k]+' 만드는 법</b><i style="top:73%;width:85%"></i><i style="top:78%;width:70%"></i><i style="top:83%;width:80%"></i><i style="top:88%;width:50%"></i>'
 d.innerHTML=h;g.appendChild(d)}
const n=document.getElementById('n');const tick=()=>{const a=document.getAnimations().find(x=>x.animationName==='scroll');const t=(a?.currentTime??0)/1000;const k=Math.min(1,Math.max(0,(t-.1)/2.4));n.textContent=Math.round(2847*(1-Math.pow(1-k,2))).toLocaleString();requestAnimationFrame(tick)};tick()
</script>
