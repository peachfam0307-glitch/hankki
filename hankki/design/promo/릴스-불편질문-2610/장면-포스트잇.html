<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:J;src:url(jua-korean-400.woff2),url(jua-latin-400.woff2)}
@font-face{font-family:P;src:url(nanumpen-korean-400.woff2)}
@font-face{font-family:G;src:url(gaegu-korean-400.woff2)}
@font-face{font-family:S;src:url(singleday-korean-400.woff2)}
@font-face{font-family:H;src:url(himelody-korean-400.woff2)}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{font-family:J;background:#efe6d8}
#stage{position:absolute;inset:0;animation:cam .55s 2.45s both}
@keyframes cam{0%{transform:scale(1)}20%{transform:scale(1.07) rotate(-1.6deg)}40%{transform:scale(1.05) rotate(1.3deg)}60%{transform:scale(1.06) rotate(-.7deg)}100%{transform:scale(1.04)}}
/* 부엌 벽 타일 + 조리대 */
.wall{position:absolute;inset:0 0 260px 0;background-color:#f4ede2;background-image:linear-gradient(#e6dccd 2px,transparent 2px),linear-gradient(90deg,#e6dccd 2px,transparent 2px);background-size:120px 90px}
.counter{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(#b98a5e,#a67650);box-shadow:inset 0 10px 0 #cfa077}
.fridge{position:absolute;left:110px;top:300px;width:860px;height:1380px;border-radius:44px;background:linear-gradient(105deg,#fbfcfc 0%,#eef1f3 55%,#dfe4e8 100%);box-shadow:0 40px 70px rgba(80,60,40,.25),inset 0 0 0 5px #d9dfe3,inset -30px 0 40px rgba(255,255,255,.6)}
.fridge::after{content:"";position:absolute;left:0;right:0;top:420px;height:6px;background:#d4dade}
.handle{position:absolute;right:46px;top:170px;width:24px;height:200px;border-radius:12px;background:linear-gradient(90deg,#c3cbd1,#e9edf0)}
.handle.b{top:500px;height:320px}
.note{position:absolute;width:300px;height:300px;padding:30px 26px 20px;color:#3d3028;opacity:0;
 background:linear-gradient(135deg,var(--c) 0%,var(--c) 70%,var(--c2) 100%);
 box-shadow:0 2px 2px rgba(0,0,0,.08),0 14px 22px -6px rgba(0,0,0,.22);clip-path:polygon(0 0,100% 0,100% 88%,92% 100%,0 100%)}
.note::after{content:"";position:absolute;right:0;bottom:0;width:24px;height:36px;background:linear-gradient(225deg,rgba(0,0,0,.18),rgba(255,255,255,.4) 60%,transparent);clip-path:polygon(100% 0,0 100%,100% 100%)}
.note h4{margin:0 0 10px;font-weight:400;font-size:46px;line-height:1;border-bottom:3px solid rgba(60,40,30,.55);padding-bottom:6px;display:inline-block}
.note p{margin:0;font-size:36px;line-height:1.18}
.note .x{text-decoration:line-through;text-decoration-thickness:3px;opacity:.7}
.note .em{color:#c4553a}
.mag{position:absolute;width:56px;height:56px;border-radius:50%;left:50%;top:-18px;margin-left:-28px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),var(--m);box-shadow:0 6px 8px rgba(0,0,0,.25)}
@keyframes stick{0%{opacity:0;transform:translateY(-300px) rotate(var(--r0)) scale(1.4)}55%{opacity:1;transform:translateY(12px) rotate(var(--r)) scale(.96)}100%{opacity:1;transform:translateY(0) rotate(var(--r)) scale(1)}}
.cap{position:absolute;left:30px;right:30px;top:70px;text-align:center;font-size:92px;color:#2b211b;line-height:1.1;opacity:0;animation:pop .45s cubic-bezier(.2,1.5,.4,1) .1s forwards;z-index:9;text-shadow:0 5px 0 #fff,0 -2px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff}
.cap b{color:#d0562f;font-weight:400}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.sfx{position:absolute;font-size:100px;color:#fff;-webkit-text-stroke:11px #d0562f;paint-order:stroke fill;opacity:0;z-index:8}
@keyframes sfx{0%{opacity:0;transform:scale(.3) rotate(var(--r))}30%{opacity:1;transform:scale(1.2) rotate(var(--r))}70%{opacity:1;transform:scale(1) rotate(var(--r))}100%{opacity:0;transform:scale(1) rotate(var(--r))}}
.big{font-size:180px;-webkit-text-stroke:16px #2b211b;color:#ffe066;text-shadow:0 12px 0 #2b211b}
@keyframes bigpop{0%{opacity:0;transform:scale(.2) rotate(-8deg)}40%{opacity:1;transform:scale(1.15) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.lines{position:absolute;inset:0;z-index:7;opacity:0;background:repeating-conic-gradient(from 0deg at 75% 80%,rgba(43,33,27,.0) 0deg 6deg,rgba(43,33,27,.10) 6deg 8deg);animation:show .01s 2.45s forwards, hide .01s 3.0s forwards}
.bear{position:absolute;width:560px;left:500px;top:1310px;z-index:6;filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
.b1{animation:inb .5s cubic-bezier(.2,1.3,.4,1) .2s both, hide .01s 2.45s forwards}
.b2{opacity:0;animation:show .01s 2.45s forwards, shake .12s 2.45s 5 both}
@keyframes inb{from{transform:translateY(560px)}to{transform:translateY(0)}}
@keyframes show{to{opacity:1}}@keyframes hide{to{opacity:0}}
@keyframes shake{0%,100%{translate:0}25%{translate:-18px}75%{translate:18px}}
.slap{z-index:9;left:770px;top:1240px;width:240px;height:220px;padding:22px 20px;animation:slap .28s 2.4s cubic-bezier(.5,0,.6,1.4) forwards}
.slap h4{font-size:40px}
@keyframes slap{0%{opacity:1;transform:translate(-700px,-900px) rotate(-60deg) scale(1.6)}100%{opacity:1;transform:translate(0,0) rotate(9deg) scale(1)}}
.drop{position:absolute;width:44px;height:62px;background:linear-gradient(#a9dcf7,#5fb0e4);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;z-index:10;animation:drip .7s forwards}
@keyframes drip{0%{opacity:0;transform:translateY(-10px)}25%{opacity:1}100%{opacity:1;transform:translateY(46px)}}
</style>
<div id="stage">
<div class="wall"></div><div class="counter"></div>
<div class="fridge"><div class="handle"></div><div class="handle b"></div></div>
<div id="notes"></div>
<div class="lines"></div>
<img class="bear b1" src="ge_s104.png"><img class="bear b2" src="ge_s103.png">
<div class="note slap" style="--c:#ffd0d0;--c2:#f3b5b5;font-family:P"><h4>???</h4><p>이건 무슨<br>레시피<span class="em">더라..</span></p></div>
<div class="drop" style="left:600px;top:1320px;animation-delay:2.65s"></div>
<div class="drop" style="left:980px;top:1350px;animation-delay:2.75s;width:34px;height:48px"></div>
<div class="sfx big" style="left:90px;top:1150px;--r:-6deg;animation:bigpop .35s 2.5s cubic-bezier(.2,1.5,.4,1) both">덕지덕지</div>
<div class="cap">레시피 아직도<br><b>포스트잇</b>에 적음?</div>
</div>
<script>
const R=[
['김치찌개','김치 반 포기<br>돼지고기 한 줌<br>고춧가루 1'],
['불고기','간장 4 · 설탕 2<br>배 <span class="x">1/2</span> 1/4<br>참기름 <span class="em">많이!</span>'],
['된장찌개','된장 1큰술<br>멸치육수 2컵<br>애호박 · 두부'],
['계란말이','계란 4개<br>소금 한 꼬집<br>파 <span class="em">송송</span>'],
['엄마 미역국','미역 한 줌<br>국간장 2<br>소고기 <span class="x">100g</span>'],
['떡볶이','고추장 2<br>설탕 1 · 물엿 1<br>어묵 <span class="em">많이</span>'],
['잡채','당면 30분 불리기<br>간장 3 · 설탕 1'],
['카레','감자 3 · 양파 2<br>카레가루 반 봉'],
['제육볶음','고추장 2<br>고춧가루 1<br>간장 1'],
['갈비찜','배 갈아 넣기<br>간장 5 · 마늘'],
['비빔국수','고추장 2<br>식초 <span class="em">2!!</span><br>설탕 1'],
['순두부','계란 톡<br>고춧가루 기름'],
['닭볶음탕','감자 큼직<br>간장 4 · 고추장 1'],
['콩나물국','소금 · 새우젓'],
['부침개','부침가루 1컵<br>물 <span class="x">1컵</span> 조금만'],
['어묵탕','무 · 대파<br>국간장 1'],
['오징어볶음','고추장 2 · 설탕 1'],
['짜장','춘장 볶기<br>감자 · 양파'],
['김밥','단무지 · 시금치<br>참기름 소금'],
['나물','소금 한 꼬집<br>참기름'],
['???','이거 뭐였지'],
['소불고기','?<br>?']];
const C=[['#ffe98f','#f5d66a'],['#ffd0d0','#f3b5b5'],['#cdeec4','#b2dfa6'],['#d3e5ff','#b6d0f5'],['#ffdcae','#f3c58b']];
const M=['#e05a47','#3f8fd6','#f2b632','#4caf6a','#9b6bd6'];
const F=['P','G','S','H'];
const POS=[[150,560],[500,520],[170,900],[520,880],[330,720],[640,1120],[140,1220],[400,1080],[680,700],[120,380],[560,360],[300,420],[720,940],[230,1060],[480,1240],[620,560],[160,740],[440,920],[700,1300],[300,1300],[80,1000],[520,700]];
const el=document.getElementById('notes'),st=document.getElementById('stage');let t=0.35,gap=0.3;
R.forEach((r,i)=>{const d=document.createElement('div');d.className='note';const c=C[i%5];d.style.setProperty('--c',c[0]);d.style.setProperty('--c2',c[1]);d.style.fontFamily=F[i%4];
d.innerHTML=`${i%3===0?`<div class="mag" style="--m:${M[i%5]}"></div>`:''}<h4>${r[0]}</h4><p>${r[1]}</p>`;
const [x,y]=POS[i];d.style.left=x+'px';d.style.top=y+'px';const rr=(i*37%17-8);d.style.setProperty('--r',rr+'deg');d.style.setProperty('--r0',(rr*4)+'deg');
d.style.animation=`stick .3s cubic-bezier(.3,1.25,.5,1) ${t.toFixed(2)}s forwards`;el.appendChild(d);
if(i===0||i===2||i===4){const f=document.createElement('div');f.className='sfx';f.textContent='착!';f.style.left=(x+170)+'px';f.style.top=(y-50)+'px';f.style.setProperty('--r',(i%4?9:-9)+'deg');f.style.animation=`sfx .45s ${(t+0.12).toFixed(2)}s forwards`;st.appendChild(f)}
t+=gap;gap=Math.max(0.05,gap*0.8)});
</script>
