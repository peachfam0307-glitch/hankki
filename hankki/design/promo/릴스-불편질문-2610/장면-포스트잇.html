<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:J;src:url(jua-korean-400.woff2),url(jua-latin-400.woff2)}
@font-face{font-family:P;src:url(nanumpen-korean-400.woff2)}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#f6efe4;font-family:J}
#stage{position:absolute;inset:0;animation:cam .5s 2.35s both}
@keyframes cam{0%{transform:scale(1)}20%{transform:scale(1.08) rotate(-1.5deg)}40%{transform:scale(1.06) rotate(1.2deg)}60%{transform:scale(1.07) rotate(-.8deg)}100%{transform:scale(1.05)}}
.fridge{position:absolute;left:90px;top:330px;width:900px;height:1250px;border-radius:48px;background:linear-gradient(160deg,#fdfdfb,#e9ecee);box-shadow:0 30px 60px rgba(90,70,50,.18), inset 0 0 0 6px #dfe3e6}
.handle{position:absolute;right:60px;top:420px;width:26px;height:300px;border-radius:13px;background:#cfd5da}
.note{position:absolute;width:250px;height:240px;padding:26px 22px;font-family:P;font-size:44px;line-height:1.05;color:#4a3b2f;box-shadow:0 10px 18px rgba(0,0,0,.14);opacity:0}
.note::before{content:"";position:absolute;top:-14px;left:95px;width:60px;height:30px;background:rgba(255,255,255,.7);transform:rotate(-4deg)}
@keyframes stick{0%{opacity:0;transform:translateY(-260px) rotate(var(--r0)) scale(1.35)}55%{opacity:1;transform:translateY(10px) rotate(var(--r)) scale(.96)}100%{opacity:1;transform:translateY(0) rotate(var(--r)) scale(1)}}
.cap{position:absolute;left:40px;right:40px;top:96px;text-align:center;font-size:88px;color:#2f2620;line-height:1.12;opacity:0;animation:pop .45s cubic-bezier(.2,1.5,.4,1) .1s forwards;z-index:5;text-shadow:0 4px 0 #fff}
.cap b{color:#c4553a;font-weight:400}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.sfx{position:absolute;font-size:96px;color:#fff;-webkit-text-stroke:10px #c4553a;paint-order:stroke fill;opacity:0;z-index:6}
@keyframes sfx{0%{opacity:0;transform:scale(.3) rotate(var(--r))}30%{opacity:1;transform:scale(1.2) rotate(var(--r))}70%{opacity:1;transform:scale(1) rotate(var(--r))}100%{opacity:0;transform:scale(1) rotate(var(--r))}}
.big{font-size:170px;-webkit-text-stroke:14px #2f2620;color:#ffe58a}
@keyframes bigpop{0%{opacity:0;transform:scale(.2) rotate(-8deg)}40%{opacity:1;transform:scale(1.15) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.bear{position:absolute;width:540px;left:500px;top:1320px;z-index:4}
.b1{animation:inb .5s cubic-bezier(.2,1.3,.4,1) .2s both, hide .01s 2.35s forwards}
.b2{opacity:0;animation:show .01s 2.35s forwards, shake .12s 2.35s 5 both}
@keyframes inb{from{transform:translateY(520px)}to{transform:translateY(0)}}
@keyframes show{to{opacity:1}}@keyframes hide{to{opacity:0}}
@keyframes shake{0%,100%{translate:0}25%{translate:-18px}75%{translate:18px}}
.slap{position:absolute;left:760px;top:1255px;width:230px;height:200px;background:#ffc6c6;padding:30px 24px;font-family:P;font-size:52px;line-height:1;color:#4a3b2f;box-shadow:0 14px 22px rgba(0,0,0,.2);z-index:7;opacity:0;animation:slap .28s 2.3s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes slap{0%{opacity:1;transform:translate(-700px,-900px) rotate(-60deg) scale(1.6)}100%{opacity:1;transform:translate(0,0) rotate(8deg) scale(1)}}
.drop{position:absolute;width:44px;height:62px;background:#7cc0ea;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;z-index:8;animation:drip .7s forwards}
@keyframes drip{0%{opacity:0;transform:translateY(-10px)}25%{opacity:1}100%{opacity:1;transform:translateY(46px)}}
</style>
<div id="stage">
<div class="cap">레시피 아직도<br><b>포스트잇</b>에 적음?</div>
<div class="fridge"><div class="handle"></div></div>
<div id="notes"></div>
<img class="bear b1" src="ge_s104.png"><img class="bear b2" src="ge_s103.png">
<div class="slap">이건<br>무슨<br>레시피?</div>
<div class="drop" style="left:600px;top:1330px;animation-delay:2.55s"></div>
<div class="drop" style="left:960px;top:1360px;animation-delay:2.65s;width:34px;height:48px"></div>
<div class="sfx big" style="left:120px;top:1120px;--r:-6deg;animation:bigpop .35s 2.4s cubic-bezier(.2,1.5,.4,1) both">덕지덕지</div>
</div>
<script>
const T=['김치찌개<br>김치 반포기','간장2<br>설탕1<br>참기름..?','불고기 양념<br>배 1/4','된장 1큰술<br>멸치육수!','계란말이<br>소금 조금','잡채<br>당면 30분','떡볶이<br>고추장2<br>설탕?','엄마 미역국<br>국간장..','카레<br>감자3','???','어묵탕<br>무 넣기','제육 양념<br>고춧가루2','이거 뭐였지','갈비찜<br>배 갈기','비빔국수<br>식초!!','순두부<br>계란 톡','닭볶음탕<br>감자 큼직','오징어볶음','나물<br>소금 한꼬집','???','콩나물국','부침개<br>물 조금만','짜장<br>춘장 볶기','김밥<br>단무지'];
const C=['#ffe58a','#ffc6c6','#c9ecc1','#cfe3ff','#ffd9a8'];
const el=document.getElementById('notes');let t=0.35,gap=0.22;
T.forEach((s,i)=>{const d=document.createElement('div');d.className='note';d.innerHTML=s;d.style.background=C[i%5];
const x=60+((i*263)%820),y=360+((i*197)%1100)-(i>12?((i*53)%180):0);
d.style.left=x+'px';d.style.top=y+'px';const r=(i*37%21-10);d.style.setProperty('--r',r+'deg');d.style.setProperty('--r0',(r*4)+'deg');
d.style.animation=`stick .3s cubic-bezier(.3,1.25,.5,1) ${t.toFixed(2)}s forwards`;el.appendChild(d);
if(i===1||i===4||i===8){const f=document.createElement('div');f.className='sfx';f.textContent='착!';f.style.left=(x+120)+'px';f.style.top=(y-40)+'px';f.style.setProperty('--r',(i%2?8:-8)+'deg');f.style.animation=`sfx .45s ${(t+0.12).toFixed(2)}s forwards`;document.getElementById('stage').appendChild(f)}
t+=gap;gap=Math.max(0.045,gap*0.84)});
</script>
