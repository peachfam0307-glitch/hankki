<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:D;src:url(dohyeon-korean-400.woff2),url(dohyeon-latin-400.woff2)}@font-face{font-family:J;src:url(jua-korean-400.woff2),url(jua-latin-400.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#fbf7ef}
.phone{position:absolute;left:150px;top:230px;width:780px;height:960px;border-radius:56px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -20px rgba(80,60,40,.35),0 0 0 14px #fffdf8;animation:pin .5s cubic-bezier(.2,1.3,.4,1) both}
.phone img{position:absolute;left:0;width:100%;top:0;transform-origin:50% var(--fy);animation:zoom 2.6s .3s ease-in-out both}
@keyframes pin{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes zoom{from{transform:translateY(40px)}to{transform:translateY(0)}}
.ring{position:absolute;left:var(--rx);top:var(--ry);width:var(--rw);height:var(--rh);border:9px solid #e8735a;border-radius:40px;opacity:0;animation:ring .5s 1.4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes ring{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.run{position:absolute;bottom:430px;width:400px;height:480px;z-index:5}
.run img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.L{left:340px;transform-origin:30% 100%;animation:runL 1.0s .3s linear both}.R{right:340px;transform-origin:70% 100%;animation:runR 1.0s .3s linear both}
@keyframes runL{0%{transform:translateX(-760px) rotate(16deg) skewX(-8deg)}22%{transform:translateX(-260px) rotate(18deg) skewX(-10deg)}30%{transform:translateX(-120px) rotate(-24deg) skewX(12deg)}55%{transform:translateX(40px) rotate(-30deg) skewX(14deg)}72%{transform:translateX(70px) rotate(-18deg) skewX(6deg)}84%{transform:translateX(30px) rotate(8deg) skewX(-3deg)}93%{transform:translateX(0) rotate(-3deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes runR{0%{transform:translateX(760px) rotate(-16deg) skewX(8deg)}22%{transform:translateX(260px) rotate(-18deg) skewX(10deg)}30%{transform:translateX(120px) rotate(24deg) skewX(-12deg)}55%{transform:translateX(-40px) rotate(30deg) skewX(-14deg)}72%{transform:translateX(-70px) rotate(18deg) skewX(-6deg)}84%{transform:translateX(-30px) rotate(-8deg) skewX(3deg)}93%{transform:translateX(0) rotate(3deg)}100%{transform:translateX(0) rotate(0)}}
.skid{position:absolute;bottom:418px;height:14px;width:0;border-radius:7px;background:repeating-linear-gradient(90deg,rgba(60,45,35,.55) 0 22px,transparent 22px 34px);opacity:0;animation:skid .7s .58s ease-out both}
@keyframes skid{0%{opacity:0;width:0}20%{opacity:1}70%{opacity:1;width:380px}100%{opacity:0;width:380px}}
.dust{position:absolute;bottom:410px;border-radius:50%;background:#e4dacb;opacity:0}
@keyframes dust{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.5)}}
.run .bob{animation:bob .45s 1.45s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.lines{position:absolute;bottom:560px;width:300px;height:200px;opacity:0;background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(43,36,32,.35) 26px 32px);animation:lines .5s .35s both}
@keyframes lines{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translateX(var(--lx))}}
.puff{position:absolute;bottom:420px;width:90px;height:90px;border-radius:50%;background:#e9e1d3;opacity:0;animation:puff .6s .8s both}
@keyframes puff{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4) translateY(-30px)}}
.cap{position:absolute;left:60px;right:60px;bottom:250px;text-align:center;font-family:J,D;font-size:80px;color:#5a3a24;z-index:9;white-space:nowrap;word-break:keep-all}
.cap span{display:inline-block;background:#ffe9a8;border-radius:22px;padding:14px 34px 18px;box-shadow:0 10px 24px -8px rgba(40,30,20,.3);rotate:-1.5deg;animation:pop .45s 1.3s cubic-bezier(.2,1.4,.4,1) both}
.cap b{color:#e8735a;font-weight:400}.cap span:empty{display:none}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
/* 🎬 두 박자 — 「헉!」 표정 컷 → 「해결!」 에피소드 컷 */
.b1{position:absolute;z-index:7;left:40px;bottom:440px;width:340px;height:380px;transform-origin:50% 100%;animation:b1in .35s .35s cubic-bezier(.2,1.6,.4,1) both, b1shake .1s .7s 6 both, b1out .3s 1.45s ease-in both}
.b1 img,.b2 img{width:100%;height:100%;object-fit:contain;object-position:bottom}
@keyframes b1in{from{transform:translateY(1000px) scale(.6)}to{transform:translateY(0) scale(1)}}
@keyframes b1shake{0%,100%{translate:0}50%{translate:12px}}
@keyframes b1out{to{transform:translateY(1100px) scale(.7)}}
.b2{position:absolute;z-index:7;right:20px;bottom:420px;width:560px;height:460px;animation:b2in .55s 1.55s cubic-bezier(.2,1.4,.4,1) both, b2bob .5s 2.15s ease-in-out infinite}
@keyframes b2in{0%{transform:translateX(700px) rotate(14deg)}70%{transform:translateX(-30px) rotate(-5deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes b2bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.fx{position:absolute;z-index:8;font-family:J,D;color:#fffdf8;-webkit-text-stroke:12px #5a3a24;paint-order:stroke fill;opacity:0}
@keyframes fxp{0%{opacity:0;transform:scale(.3) rotate(var(--r))}35%{opacity:1;transform:scale(1.2) rotate(var(--r))}75%{opacity:1;transform:scale(1) rotate(var(--r))}100%{opacity:0}}
.ht{position:absolute;z-index:8;width:46px;height:46px;opacity:0;background:#e8735a;clip-path:path("M23 42 C-8 22 6 0 23 13 C40 0 54 22 23 42Z")}
@keyframes htp{0%{opacity:0;transform:translateY(0) scale(.3)}30%{opacity:1;transform:translateY(-40px) scale(1.1)}100%{opacity:0;transform:translateY(-160px) scale(.8)}}
/* 👀 빼꼼 — 폰 «뒤»에 숨어 있다 옆으로 반만 나온다 */
.peekc{position:absolute;z-index:1;width:330px;height:420px;left:580px;top:500px;transform-origin:20% 100%;animation:peekR 2.4s .3s ease-in-out both}
.peekc img{width:100%;height:100%;object-fit:contain;object-position:bottom}
@keyframes peekR{0%{transform:translateX(-200px) rotate(0)}18%{transform:translateX(180px) rotate(14deg)}30%{transform:translateX(150px) rotate(10deg)}42%{transform:translateX(0) rotate(2deg)}56%{transform:translateX(190px) rotate(16deg)}66%{transform:translateX(170px) rotate(12deg)}100%{transform:translateX(170px) rotate(12deg)}}
.phone{z-index:2}.ring{z-index:3}
.bub{position:absolute;z-index:6;right:30px;top:380px;font-family:J,D;font-size:60px;color:#5a3a24;background:#fffdf8;border:6px solid #5a3a24;border-radius:40px;padding:18px 30px;animation:bpop .4s 1.75s cubic-bezier(.2,1.6,.4,1) both;rotate:4deg}
.bub::after{content:"";position:absolute;right:120px;bottom:-34px;border:18px solid transparent;border-top:24px solid #5a3a24}
@keyframes bpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
</style>
<div class="phone"><img id="shot"></div><div class="ring" id="ring"></div>
<div class="lines" id="lines"></div><div class="puff" id="puff"></div><div class="skid" id="skid"></div><div id="dusts"></div>
<div class="run" id="run"><div class="bob" style="width:100%;height:100%"><img id="ch"></div></div>
<div class="cap"><span id="cap"></span></div>
<script>
const q=new URLSearchParams(location.search)
const shot=document.getElementById('shot');shot.src=q.get('img');shot.style.top=(q.get('top')||0)+'px';shot.style.setProperty('--fy',(q.get('fy')||'40')+'%')
const r=document.getElementById('ring');const [rx,ry,rw,rh]=(q.get('ring')||'').split(',');if(rx){r.style.setProperty('--rx',rx+'px');r.style.setProperty('--ry',ry+'px');r.style.setProperty('--rw',rw+'px');r.style.setProperty('--rh',rh+'px')}else r.remove()
const side=q.get('side')||'L';const run=document.getElementById('run');run.classList.add(side);document.getElementById('ch').src=q.get('ch')
if(q.get('mode')==='beats'){run.style.display='none';['lines','puff','skid','dusts'].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display='none'});
const add=(h)=>{const t=document.createElement('div');t.innerHTML=h;document.body.appendChild(t.firstElementChild)}
add('<div class="b1"><img src="'+q.get('ch1')+'"></div>');add('<div class="b2"><img src="'+q.get('ch2')+'"></div>')
add('<div class="fx" style="left:60px;top:'+(q.get('fy1')||900)+'px;font-size:110px;--r:-10deg;animation:fxp .9s .45s both">'+(q.get('fx1')||'헉!')+'</div>')
add('<div class="fx" style="right:50px;top:'+(q.get('fy2')||860)+'px;font-size:96px;--r:8deg;animation:fxp 1s 1.75s both">'+(q.get('fx2')||'뾰로롱~')+'</div>')
for(let i=0;i<7;i++)add('<div class="ht" style="left:'+(560+i*60)+'px;top:'+(1150+(i%3)*40)+'px;animation:htp 1s '+(1.8+i*0.08).toFixed(2)+'s both"></div>')
document.querySelector('.cap span').style.animationDelay='1.9s';const rg2=document.getElementById('ring');if(rg2)rg2.style.animationDelay='.8s'}
if(q.get('mode')==='peek'){const ph=document.querySelector('.phone');ph.style.left='30px';const rg=document.getElementById('ring');if(rg){rg.style.left=(parseInt(rx)-120)+'px'}run.style.display='none';['lines','puff','skid','dusts'].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display='none'});const pc=document.createElement('div');pc.className='peekc';pc.innerHTML='<img src="'+q.get('ch')+'">';document.body.appendChild(pc);if(q.get('bub')){const b=document.createElement('div');b.className='bub';b.innerHTML=q.get('bub');document.body.appendChild(b)}}
const L=document.getElementById('lines');L.style[side==='L'?'left':'right']='-20px';L.style.setProperty('--lx',side==='L'?'-200px':'200px')
const P=document.getElementById('puff');P.style[side==='L'?'left':'right']='640px'
document.getElementById('cap').innerHTML=q.get('cap')
const K=document.getElementById('skid');K.style[side==='L'?'left':'right']='300px'
const DS=document.getElementById('dusts');for(let i=0;i<7;i++){const d=document.createElement('div');d.className='dust';const s=50+i*14;d.style.width=d.style.height=s+'px';d.style[side==='L'?'left':'right']=(240+i*45)+'px';d.style.setProperty('--dx',(side==='L'?-1:1)*(40+i*12)+'px');d.style.animation='dust .8s '+(0.58+i*0.06).toFixed(2)+'s ease-out both';DS.appendChild(d)}
</script>
<style>
.tp{position:absolute;z-index:7;width:270px;height:270px;bottom:470px;transform-origin:50% 0;animation:tpin .55s .5s cubic-bezier(.3,1.35,.5,1) both}
.tp.R{right:70px}.tp.L{left:70px}
.tp .pp{position:absolute;inset:0;background:#fffdf8;border-radius:22px;box-shadow:0 14px 24px -10px rgba(60,40,25,.35);padding:14px}
.tp img{width:100%;height:100%;object-fit:contain}
@keyframes tpin{0%{opacity:0;transform:translateY(-900px) rotate(var(--r0))}70%{opacity:1;transform:translateY(18px) rotate(var(--r))}100%{opacity:1;transform:translateY(0) rotate(var(--r))}}
.tape{position:absolute;width:190px;height:58px;background:rgba(232,214,160,.82);top:-22px;box-shadow:0 2px 4px rgba(0,0,0,.08);opacity:0;animation:tape .18s both}
.tape::before,.tape::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:inherit;clip-path:polygon(0 0,100% 10%,0 25%,100% 40%,0 55%,100% 70%,0 85%,100% 100%)}
.tape::before{left:-9px;transform:scaleX(-1)}.tape::after{right:-9px}
@keyframes tape{from{opacity:0;transform:scale(1.4) rotate(var(--t))}to{opacity:1;transform:scale(1) rotate(var(--t))}}
.chak{position:absolute;z-index:9;font-family:D;color:#fffaf0;-webkit-text-stroke:12px #6b4f3a;paint-order:stroke fill;text-shadow:0 8px 0 #6b4f3a;opacity:0}
@keyframes chak{0%{opacity:0;transform:scale(.3) rotate(var(--r))}40%{opacity:1;transform:scale(1.15) rotate(var(--r))}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
</style>
<script>
if(q.get('mode')==='tape'){document.getElementById('run').style.display='none';['lines','puff','skid','dusts'].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display='none'})
 const sd=q.get('side')||'R',r=sd==='R'?5:-5,t=document.createElement('div');t.className='tp '+sd;t.style.setProperty('--r',r+'deg');t.style.setProperty('--r0',(r*4)+'deg')
 t.innerHTML='<div class="pp"><img src="'+q.get('ch')+'"></div><div class="tape" style="left:50%;margin-left:-80px;width:160px;height:46px;top:-20px;--t:'+(sd==='R'?-4:4)+'deg;animation-delay:1.0s"></div>';document.body.appendChild(t)
 const c=document.createElement('div');c.className='chak';c.textContent=q.get('fx')||'착!';c.style.cssText='font-size:110px;top:'+(q.get('fy')||1230)+'px;'+(sd==='R'?'right:370px':'left:370px')+';--r:'+(sd==='R'?8:-8)+'deg;animation:chak .35s 1.05s cubic-bezier(.2,1.5,.4,1) both';document.body.appendChild(c)}
</script>
