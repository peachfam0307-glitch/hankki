*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{font-family:J;background:#eceae6}
#stage{position:absolute;inset:0;animation:cam .55s 2.45s both}

.door::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.28;mix-blend-mode:multiply}
.door::after{content:"";position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(rgba(0,0,0,.02),transparent)}

.note{position:absolute;width:350px;height:420px;padding:26px 24px 18px;color:#2f2823;opacity:0;
 background:linear-gradient(135deg,var(--c) 0%,var(--c) 70%,var(--c2) 100%);
 box-shadow:0 1px 1px rgba(0,0,0,.06),0 16px 24px -8px rgba(40,30,20,.22);clip-path:polygon(0 0,100% 0,100% 89%,92% 100%,0 100%)}

.cap{display:none;position:absolute;left:70px;top:1230px;font-family:D,J;font-size:96px;color:#2b2420;line-height:1.08;opacity:0;animation:pop .45s cubic-bezier(.2,1.4,.4,1) .1s forwards;z-index:11;transform-origin:0 50%}

.cap b{color:#b5583a;font-weight:400}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.sfx{position:absolute;font-family:D;font-size:96px;color:#fffaf0;-webkit-text-stroke:11px #6b4f3a;paint-order:stroke fill;opacity:0;z-index:8}
@keyframes sfx{0%{opacity:0;transform:scale(.3) rotate(var(--r))}30%{opacity:1;transform:scale(1.2) rotate(var(--r))}70%{opacity:1;transform:scale(1) rotate(var(--r))}100%{opacity:0;transform:scale(1) rotate(var(--r))}}
.big{font-family:D,J;font-size:170px;-webkit-text-stroke:14px #6b4f3a;color:#fffaf0;text-shadow:0 10px 0 #6b4f3a}
@keyframes bigpop{0%{opacity:0;transform:scale(.2) rotate(-8deg)}40%{opacity:1;transform:scale(1.15) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.lines{position:absolute;inset:0;z-index:7;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 36%,rgba(43,36,32,0) 0deg 6deg,rgba(43,36,32,.07) 6deg 8deg);animation:show .01s 2.45s forwards, hide .01s 3.0s forwards}
.bear{position:absolute;width:560px;left:500px;top:1310px;z-index:6;filter:drop-shadow(0 18px 18px rgba(0,0,0,.16))}
.b1{animation:inb .5s cubic-bezier(.2,1.3,.4,1) .2s both, hide .01s 2.45s forwards}
.b2{opacity:0;animation:show .01s 2.45s forwards, shake .12s 2.45s 5 both}
@keyframes inb{from{transform:translateY(560px)}to{transform:translateY(0)}}
@keyframes show{to{opacity:1}}@keyframes hide{to{opacity:0}}
@keyframes shake{0%,100%{translate:0}25%{translate:-18px}75%{translate:18px}}
.slap{z-index:9;left:240px;top:340px;width:600px;height:600px;padding:50px 46px;animation:slap .26s 2.4s cubic-bezier(.5,0,.6,1.3) forwards}
.slap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.slap h4{font-size:110px;border:0;margin:0 0 10px}.slap p{font-size:104px !important;line-height:1.1}
@keyframes slap{0%{opacity:1;transform:translate(-900px,-1200px) rotate(-50deg) scale(.6)}100%{opacity:1;transform:translate(0,0) rotate(-5deg) scale(1)}}
.drop{position:absolute;width:44px;height:62px;background:linear-gradient(#bfe0f2,#7fb4d6);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;z-index:10;animation:drip .7s forwards}
@keyframes drip{0%{opacity:0;transform:translateY(-10px)}25%{opacity:1}100%{opacity:1;transform:translateY(46px)}}
</style>
