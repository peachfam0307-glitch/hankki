<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:BH;src:url(blackhansans-korean-400.woff2)}@font-face{font-family:BH;src:url(blackhansans-latin-400.woff2);unicode-range:U+0000-00FF}
html,body{margin:0;width:1080px;height:1920px;background:transparent}
.capA{position:absolute;left:40px;right:40px;bottom:230px;text-align:center;font-family:BH;line-height:1.1}
.capA span{display:inline-block;white-space:nowrap;border-radius:26px}
.capA .l1{font-size:84px;padding:18px 40px 22px}
.capA .l2{font-size:96px;padding:14px 40px 18px;margin-top:22px}
</style><div class="capA"><span class="l1" id="a"></span><br><span class="l2" id="b"></span></div>
<script>const q=new URLSearchParams(location.search);a.textContent=q.get('a');b.textContent=q.get('b')
const bg=q.get('bg'),ink=q.get('ink'),sh=q.get('sh')
Object.assign(a.style,{background:ink,color:bg,boxShadow:'0 14px 0 '+sh});Object.assign(b.style,{background:bg,color:ink,boxShadow:'0 14px 0 '+sh})</script>
