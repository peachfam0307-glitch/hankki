<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:D;src:url(dohyeon-korean-400.woff2),url(dohyeon-latin-400.woff2)}@font-face{font-family:J;src:url(jua-korean-400.woff2),url(jua-latin-400.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#fbf7ef}
/* 📱 갤럭시 잠금화면 — 실제 알림 문구(sw.js·pantryExpiry.js) 그대로 */
.phone{position:absolute;left:150px;top:200px;width:780px;height:1280px;border-radius:70px;background:#1d1a17;padding:18px;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(80,60,40,.4)}
.scr{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:linear-gradient(170deg,#f7e3c6 0%,#f2cfc2 45%,#d9dfcf 100%);font-family:"Noto Sans KR",system-ui,sans-serif}
.cam{position:absolute;left:50%;top:22px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#111}
.clock{position:absolute;left:0;right:0;top:150px;text-align:center;color:#fff;font-size:150px;font-weight:300;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.15)}
.date{position:absolute;left:0;right:0;top:120px;text-align:center;color:#fff;font-size:34px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.card{position:absolute;left:30px;right:30px;top:440px;background:rgba(255,255,255,.92);border-radius:40px;padding:30px 34px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);animation:drop .6s .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{transform:translateY(-520px);opacity:0}to{transform:translateY(0);opacity:1}}
.hd{display:flex;align-items:center;gap:14px;color:#6b6b6b;font-size:28px}
.hd img{width:48px;height:48px;border-radius:12px}
.tt{margin-top:14px;font-size:38px;font-weight:700;color:#1d1d1d}
.bd{margin-top:6px;font-size:36px;color:#333}
.fx{position:absolute;z-index:8;font-family:J,D;color:#fffdf8;-webkit-text-stroke:12px #2b2420;paint-order:stroke fill;opacity:0;font-size:110px;right:70px;top:150px;animation:fxp 1s .55s both}
@keyframes fxp{0%{opacity:0;transform:scale(.3) rotate(10deg)}35%{opacity:1;transform:scale(1.2) rotate(10deg)}75%{opacity:1;transform:scale(1) rotate(10deg)}100%{opacity:0}}
.ring{position:absolute;left:150px;top:620px;width:780px;height:260px;border:9px solid #b5583a;border-radius:56px;opacity:0;animation:rg .5s 1.3s cubic-bezier(.2,1.5,.4,1) both}
@keyframes rg{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:scale(1)}}
.hand{position:absolute;z-index:9;width:190px;left:700px;top:880px;opacity:0;animation:hand 1.1s 1.7s ease-in-out both}
@keyframes hand{0%{opacity:0;transform:translate(160px,220px)}40%{opacity:1;transform:translate(0,0)}60%{transform:translate(0,0) scale(.88)}75%{transform:translate(0,0) scale(1)}100%{opacity:1}}
.cap{position:absolute;left:60px;right:60px;bottom:250px;text-align:center;font-family:D,J;font-size:76px;color:#2b2420;white-space:nowrap}
.cap span{display:inline-block;background:#fffdf8;padding:12px 30px 16px;box-shadow:0 10px 24px -8px rgba(40,30,20,.3);rotate:-1.5deg;animation:pop .45s 1.2s cubic-bezier(.2,1.4,.4,1) both}
.cap b{color:#b5583a;font-weight:400}.cap{display:none}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
</style>
<div class="phone"><div class="scr"><div class="cam"></div><div class="date">10월 23일 금요일</div><div class="clock">9:00</div>
<div class="card"><div class="hd"><img src="icon192.png">한끼 · 지금</div><div class="tt">한끼</div><div class="bd">🧊 냉장고 두부 외 2개 2일 남았어요</div></div></div></div>
<div class="ring"></div><img class="hand" src="hand_point.png"><div class="fx">띵!</div>
<div class="cap"><span>유통기한 임박하면 <b>폰으로 알림</b></span></div>
