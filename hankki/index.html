<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192-v7.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180-v7.png" />
    <!-- interactive-widget=resizes-content: 키보드가 올라오면 화면이 줄어들어 입력칸 아래 내용도 스크롤로 볼 수 있게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FDFBF7" />
    <!-- 저장된 테마를 첫 페인트 전에 적용해 깜빡임(FOUC) 방지 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hankki-theme') || 'cream'
          if (t !== 'cream') document.documentElement.setAttribute('data-theme', t)
          var c = { cream: '#F5F6F4', sage: '#f1f3ee', dark: '#1b201a' }[t]
          var m = document.querySelector('meta[name="theme-color"]')
          if (c && m) m.setAttribute('content', c)
        } catch (e) {}
      })()
    </script>
    <!-- 뒤로가기(안드로이드)로 앱이 곧장 종료되지 않도록, React 로딩 전에 히스토리 버퍼를 깐다 -->
    <script>
      (function () {
        try { if (!(history.state && history.state.hankki)) history.pushState({ hankki: 1 }, '') } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="한끼" />
    <meta name="description" content="흩어진 레시피를, 한곳에. 나만의 레시피 아카이브 — 한끼." />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <!-- 🔤 꾸미기 글씨체 여섯은 **전부 우리 파일**이다 (`src/styles.css` 의 @font-face)
         ⛔ 2026-08-07 까지 여기에 구글 폰트 CDN 링크가 있었고, 「임팩트」·「라운드」는 **그것으로만** 왔다.
            → ⑴오프라인이면 안 떴고 ⑵`fontEmbed.js` 가 못 심어서
              **그 글씨체로 쓴 글자가 공유 카드에서 다른 글씨로** 나갔다.
         ✅ 원본 TTF(google/fonts · OFL 1.1)를 받아 `tools/font-subset.py` 로 잘라 넣었다.
            ⚠️ 글씨체를 더할 땐 **①`styles.css` @font-face ②`fontEmbed.js` FAMILIES** 둘 다 손볼 것. -->
    <title>한끼 — 나만의 레시피 아카이브</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
