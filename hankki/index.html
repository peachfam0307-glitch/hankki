<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180-v3.png" />
    <!-- interactive-widget=resizes-content: 키보드가 올라오면 화면이 줄어들어 입력칸 아래 내용도 스크롤로 볼 수 있게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F5F6F4" />
    <!-- 저장된 테마를 첫 페인트 전에 적용해 깜빡임(FOUC) 방지 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hankki-theme') || 'cream'
          if (t !== 'cream') document.documentElement.setAttribute('data-theme', t)
          var c = { cream: '#F5F6F4', sage: '#f1f3ee', dark: '#1b201a' }[t]
          var m = document.querySelector('meta[name="theme-color"]')
          if (c && m) m.setAttribute('content', c)
        } catch (e) {}
      })()
    </script>
    <!-- 뒤로가기(안드로이드)로 앱이 곧장 종료되지 않도록, React 로딩 전에 히스토리 버퍼를 깐다 -->
    <script>
      (function () {
        try { if (!(history.state && history.state.hankki)) history.pushState({ hankki: 1 }, '') } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="한끼" />
    <meta name="description" content="흩어진 레시피를, 한곳에. 나만의 레시피 아카이브 — 한끼." />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <!-- 고운돋움 — 포스트잇 손글씨 톤(앱 아이콘과 같은 글씨체). 오프라인이면 Pretendard 로 자연 대체 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/gowun-dodum@5.2.5/index.min.css"
    />
    <!-- 개구체(Gaegu) — 꾸미기 글자 스티커 '귀염체' -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.2.5/index.min.css"
    />
    <title>한끼 — 나만의 레시피 아카이브</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
