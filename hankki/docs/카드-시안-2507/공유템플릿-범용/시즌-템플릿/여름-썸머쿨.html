*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px}

.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(60,140,150,.05) 1px,transparent 1px);background-size:7px 7px;pointer-events:none}

.sun{position:absolute;top:-70px;right:-60px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(255,246,205,.95),rgba(255,238,170,.5) 46%,transparent 70%)}

.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9),rgba(255,255,255,.16) 60%,transparent);box-shadow:inset 0 0 8px rgba(255,255,255,.5)}

.b3{width:54px;height:54px;right:96px;top:300px}.b4{width:30px;height:30px;right:180px;top:410px}

.waves{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:1}

.brand{position:relative;text-align:center;font-family:'Jua';font-size:38px;color:#2b7f8c;letter-spacing:1px;z-index:6}.brand .h{color:#ff8f9c}

.season{position:absolute;top:150px;left:70px;z-index:8;transform:rotate(-8deg);font-family:'Jua';font-size:24px;color:#fff;background:linear-gradient(180deg,#ff9fae,#ff7f92);padding:11px 24px;border-radius:14px;box-shadow:0 8px 16px -6px rgba(220,90,110,.6),inset 0 2px 0 rgba(255,255,255,.4)}
.season b{font-size:26px}
/* cool panel */
.pop{position:absolute;left:46px;right:46px;top:250px;height:640px;border-radius:60px;background:linear-gradient(160deg,#7fd0dd,#4fb6cb 58%,#3a9fc0);box-shadow:0 34px 60px -24px rgba(30,110,130,.55),inset 0 3px 0 rgba(255,255,255,.4)}
.pop .gloss{position:absolute;left:0;right:0;top:0;height:52%;border-radius:60px 60px 120px 120px/60px 60px 60px 60px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none}
.pop .dot{position:absolute;inset:0;border-radius:60px;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.13) 5px,transparent 6px);background-size:64px 64px;background-position:20px 20px}
/* hero — glossy die-cut sticker (띠부씰 느낌: 두꺼운 흰테 + 강한 그림자) */
.hero{position:absolute;left:50%;bottom:452px;transform:translateX(-50%);width:452px;z-index:7;
 filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(4px 4px 0 #fff) drop-shadow(-4px 4px 0 #fff) drop-shadow(4px -4px 0 #fff) drop-shadow(-4px -4px 0 #fff) drop-shadow(0 24px 22px rgba(20,90,110,.42))}
/* Y2K sparkle stars */
.spark{position:absolute;z-index:8}
.spark svg{display:block}
.s1{top:410px;right:200px;width:64px;height:64px}
.s2{top:560px;left:150px;width:44px;height:44px}
.s3{top:330px;left:250px;width:34px;height:34px}

.stamp{position:absolute;top:264px;right:88px;width:150px;height:150px;transform:rotate(12deg);z-index:8}
.stamp svg{position:absolute;inset:0}
.stamp .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua';color:#fff;line-height:1.02;text-align:center;text-shadow:0 1px 2px rgba(20,90,110,.4)}
.stamp .txt b{font-size:30px}.stamp .txt s{font-size:17px;text-decoration:none;letter-spacing:2px;margin-top:2px;opacity:.95}
/* title */
.info{position:absolute;left:0;right:0;bottom:150px;text-align:center;z-index:6}
.kick{font-family:'Gaegu';font-weight:700;font-size:34px;color:#2f96a6;letter-spacing:1px}
.title{font-family:'Jua';font-size:88px;color:#144e5c;letter-spacing:-1.5px;line-height:1;margin-top:6px}

.metabar{display:inline-flex;gap:10px;align-items:center;margin-top:18px;font-size:24px;color:#3f8a97}
