*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px}
body{font-family:'GowunDodum',sans-serif;background:#f4f0e8;color:#3a3128;padding:60px 64px;position:relative;overflow:hidden}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(150,120,80,.06) 1px,transparent 1px);background-size:7px 7px;pointer-events:none}

.head .p{position:relative;display:inline-block;color:#d9724a}

.chips{position:relative;margin-top:34px;display:flex;gap:12px;z-index:5}
.chip{padding:12px 26px;border-radius:999px;background:#fffdf8;box-shadow:0 8px 20px -12px rgba(120,80,50,.5),inset 0 0 0 2px rgba(216,150,110,.25);font-family:'Jua';font-size:30px;color:#8a5f3c}
/* stamp */
.stamp{position:absolute;top:70px;right:64px;width:138px;height:138px;transform:rotate(11deg);z-index:6}
.stamp .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua';color:#c47a58;line-height:1.05;text-align:center}
.stamp .txt b{font-size:31px}.stamp .txt s{font-size:18px;text-decoration:none;letter-spacing:3px;margin-top:3px}

 filter:drop-shadow(3px 0 0 #fffdf8) drop-shadow(-3px 0 0 #fffdf8) drop-shadow(0 3px 0 #fffdf8) drop-shadow(0 -3px 0 #fffdf8) drop-shadow(3px 3px 0 #fffdf8) drop-shadow(-3px 3px 0 #fffdf8) drop-shadow(3px -3px 0 #fffdf8) drop-shadow(-3px -3px 0 #fffdf8) drop-shadow(0 22px 20px rgba(120,60,40,.34))}
.more{position:absolute;left:64px;bottom:150px;z-index:6;font-family:'Jua';font-size:34px;color:#3a3128}
