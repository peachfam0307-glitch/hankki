<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한끼 받기</title>
<meta name="robots" content="noindex">
<!--
  🔗🔗 **인스타 프로필 링크가 스토어로 가게 하는 «징검다리» 페이지**

  📮 창업자 2026-08-29 = *"인스타 프로필에 주소 클릭이 안돼"* → *"남편폰으로 …눌러봤는데 안눌러져"*
     → (웹앱 주소로 바꿔 보고) *"이제 눌리거든? 근데 누르면 웹 한끼로 바로 가 스토어로 가는게 아니라"*
     → *"남편폰은 이미 깔려있어서 그런가"*

  ⭐⭐ **실물로 갈린 것 = 인스타는 «물음표 뒤 쿼리»가 붙은 주소를 링크로 안 만든다.**
     · `play.google.com/store/apps/details?id=…`  → 파랗게 보이는데 **눌리지 않는다**(남편 폰에서도)
     · `peachfam0307-glitch.github.io/hankki/`     → **눌린다**
     ⛔ 그런데 Play 스토어 주소는 **`?id=` 가 필수**라 뺄 수가 없다.

  ⛔ 그래서 웹앱 주소를 넣었더니 이번엔 **설치로 안 이어진다** —
     · 이미 깐 사람 → TWA(App Links)라 **앱이 열린다** ✅ (창업자 짐작이 맞았다)
     · **안 깐 사람 → 그냥 웹 한끼가 열린다** ⛔ ← 정작 우리가 잡아야 할 사람

  ✅ **이 페이지가 그 사이를 잇는다** — 주소에 물음표가 없어 인스타에서 눌리고, 열리면 스토어로 보낸다.

  ⛔⛔ **자동 이동만 믿지 않는다** — 인스타 «인앱 브라우저»가 스크립트 이동을 막는 일이 있다.
     그래서 **큰 버튼을 같이** 둔다. 자동이 실패해도 유저가 한 번 누르면 간다.
  ⚠️ 그리고 **1.2초 기다렸다가** 보낸다 — 곧바로 튕기면 유저는 «뭐가 지나갔는지» 모른 채 스토어에 떨어진다.

  📌 주소는 `src/nudges.js` 의 `STORE_URL` 과 «같아야» 한다. 여기 손으로 적혀 있으니
     스토어 주소가 바뀌면 **두 곳을 같이** 고친다(⛔이 페이지는 빌드에 안 섞이는 정적 파일이라 import 를 못 쓴다).
-->
<style>
  :root { color-scheme: light dark;
    --bg:#fdfbf7; --card:#fff; --line:#efe8dc; --text:#3d3830; --sub:#8f887b; --pt:#5878a0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171b; --card:#202026; --line:rgba(255,255,255,.10);
            --text:#ecebf1; --sub:#9a97a2; --pt:#7093c0; } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.6 }
  .box { width:100%; max-width:420px; text-align:center }
  .logo { width:104px; height:104px; border-radius:26px; margin:0 auto 18px; display:block }
  h1 { font-size:24px; margin:0 0 6px; letter-spacing:-.4px }
  .sub { color:var(--sub); font-size:15px; margin:0 0 26px }
  .btn { display:block; width:100%; padding:17px; border-radius:15px; background:var(--pt);
    color:#fff; text-decoration:none; font-size:17px; font-weight:700; margin-bottom:10px }
  .ghost { display:block; width:100%; padding:15px; border-radius:15px; background:transparent;
    color:var(--sub); text-decoration:none; font-size:14px; border:1.5px solid var(--line) }
  .note { color:var(--sub); font-size:13px; margin-top:18px }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="./icons/icon-512-v7.png" alt="한끼">
    <h1>한끼 받으러 가는 중…</h1>
    <p class="sub">잠시 뒤 Play 스토어가 열려요</p>
    <!-- 🏷️ [2026-09-12] 꼬리표(referrer) 를 달았다 — Play 콘솔이 «이 징검다리로 온 설치»를 따로 세준다.
         📮 창업자 = *"이게 되는지 알면 인스타로 계속 사람몇명왔다 셀때 나한테 말했어야지"* — 내가 늦었다.
         ⭐ 형식은 구글 공식 = `&referrer=` 안에 utm_* 를 «URL 인코딩해서» 넣는다(%3D 는 = · %26 은 &).
            https://support.google.com/analytics/answer/10917952
         ⛔ 스토어 주소가 바뀌면 src/nudges.js 의 STORE_URL 과 «같이» 고친다. -->
    <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=io.github.peachfam0307_glitch.twa&referrer=utm_source%3Dhankki_bridge%26utm_medium%3Dinstagram%26utm_campaign%3Dprofile_link">Play 스토어에서 받기</a>
    <!-- ⛔⛔ [창업자 확정 2026-09-08] 「앱 없이 웹으로 먼저 볼래요」 단추를 «지웠다».
         📮 창업자 = *"웹으로 볼래요도 빼"* · *"굳이.. 힘들게 돈까지 써가면서 광고하는데 다운을 받게 해야지.."*
         ⭐ 이 페이지는 «인스타 광고로 온 사람»이 처음 닿는 자리다 — 광고비를 써서 데려온 사람을
            웹으로 흘려보내면 ⑴설치가 안 되고 ⑵로그인도 안 하고 ⑶콘솔에도 안 잡힌다(＝광고 효과를 못 잰다).
         ⛔ 되살리지 말 것 — v12.73 에서 앱 안 「그냥 보기」를 없앤 것과 «같은 결정»이다. -->
    <!-- ⛔ 유니코드 이모지를 쓰지 않는다(절대원칙) — 위 앱 아이콘이 이미 꼬르곰이라 그림은 충분하다 -->
    <p class="note">꼬르곰 · 펭펭과 레꾸해요</p>
  </div>
<script>
  // 📊📊 [2026-09-12] **징검다리 계측** — 여기가 여태 «깜깜»했다.
  //    광고 → 프로필(83명 셈) → [깜깜] → 징검다리 → [깜깜] → 스토어 → 설치(15명 셈)
  //    📮 창업자 = *"나는 이런게 되는지도 모르잖아"* — 알려주는 게 내 일이었다. 늦게 넣는다.
  //
  //    잰다 = ① bridge      — 이 페이지에 «온» 사람 N
  //           ② bridge_go   — 스토어로 «간» 사람 M (단추를 눌렀든 자동으로 넘어갔든)
  //    ⭐ N 과 M 만 있으면 「프로필 왔다고 다 스토어로 가진 않는다」가 숫자가 된다.
  //
  //    ⛔ 못 보는 것 = M 중 «실제 설치»는 Play 콘솔이 센다. 사람 단위로 못 이어 붙인다.
  //       → 그래서 위 단추에 referrer 꼬리표를 따로 달았다(구글이 세준다).
  //    ⚠️ 측정 ID 는 앱과 «같다»(G-L20V2VE1CS) — 그래서 GA4 「사용자 수」에 안 깐 사람도 섞인다.
  //       page_title 로 갈라 봐야 한다(bridge / bridge_go 는 앱 화면이 아니다).
  //    📌 앱(src/stats.js)과 «같은 방식» = page_view 의 page_title 에 이름을 싣는다(웹 스트림이라 그렇다).
  (function () {
    var ID = 'G-L20V2VE1CS'
    var 갔다 = false
    try {
      window.dataLayer = window.dataLayer || []
      window.gtag = function () { window.dataLayer.push(arguments) }
      gtag('js', new Date())
      // ⛔ send_page_view: false — gtag 가 «스스로» 보내면 이름이 안 실린다.
      gtag('config', ID, { send_page_view: false })
      gtag('event', 'page_view', { page_title: 'bridge' })
      var s = document.createElement('script')
      s.async = true
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID
      // ⛔⛔ 여기가 제일 위험한 자리 — gtag 가 «붙기 전»에 스토어로 튕기면 계측이 통째로 날아간다.
      //    dataLayer 에 쌓아둔 것은 gtag.js 가 내려와야 비로소 밖으로 나간다.
      //    ⭐ 그래서 «붙은 뒤»에 이동 타이머를 시작한다. 못 붙으면(onerror) 그때도 바로 보낸다.
      //    ⚠️ 상한 3초 — 인터넷이 느려도 «스토어로 가는 길»을 계측 때문에 막지 않는다.
      s.onload = 타이머시작
      s.onerror = 타이머시작
      document.head.appendChild(s)
      setTimeout(타이머시작, 3000)
    } catch (e) { 타이머시작() }

    // ⭐ 「갔다」를 «한 번»만 보낸다 — 단추를 눌렀는데 자동 이동도 걸리면 두 번 세진다.
    function 갔다고보낸다() {
      if (갔다) return
      갔다 = true
      try { gtag('event', 'page_view', { page_title: 'bridge_go' }) } catch (e) {}
    }
    try {
      document.getElementById('go').addEventListener('click', 갔다고보낸다)
    } catch (e) { /* noop */ }

    // ⛔ `location.href` 대신 `replace` — 뒤로가기를 눌렀을 때 이 페이지로 다시 튕기지 않게.
    // ⚠️ 인앱 브라우저가 막으면 아무 일도 안 일어난다 → 위 버튼이 그때를 위한 길이다.
    // ⭐ «한 번»만 건다 — onload·onerror·3초 상한이 셋 다 이 함수를 부른다.
    var 걸었나 = false
    function 타이머시작() {
      if (걸었나) return
      걸었나 = true
      setTimeout(function () {
        갔다고보낸다()
        try { location.replace(document.getElementById('go').href) } catch (e) {}
      }, 1200)
    }

  })()
</script>
</body>
</html>
