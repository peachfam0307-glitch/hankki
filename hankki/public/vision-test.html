<style>

<h1>👁 눈 시험판</h1>
<p class="sub">사진을 <b>직접 보는 AI</b>가 지금보다 나은지 재는 판이야. ⛔앱은 이 길을 안 써.</p>

<!-- 📌 [2026-09-01] 창업자 = *"테스트링크 리셋하는 법 없어? 계속 붙여넣어야하니 불편쓰"*
     ⭐ 고치는 건 페이지가 아니라 «찾아오는 길»이다 — 홈 화면에 한 번 박으면 끝난다. -->
<div class="card" style="padding:11px 12px">

<label>운영자 열쇠 <span class="k">(이 폰 안에만 저장돼요)</span></label>
<!-- ⛔ autocapitalize·autocorrect 를 꺼야 한다 — 폰 키보드가 첫 글자를 대문자로 바꾸면 «다른 열쇠»가 된다 -->
<input id="key" type="password" placeholder="FOUNDER_SECRET"
       autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
<!-- ⭐ 값은 안 보여주고 «글자 수»만 — 붙여넣을 때 딸려온 빈칸을 눈으로 잡을 수 있다 -->

<div class="row">

  <button class="ghost" id="열쇠지움" style="margin-top:6px">🗑 열쇠 지우기</button>
</div>
<!-- 🔐 [2026-09-01] 이 열쇠를 «한끼 앱에도» 넣는다 — 창업자가 값을 손으로 옮길 필요가 없다.
     📮 창업자 = *"열쇠 자리에 FOUNDER_SECRET 값?? 이게 뭔지모르겠어"* → *"만들어줘"*
     ⭐⭐ 되는 이유 = 이 페이지와 앱이 **같은 주소(origin)** 다
        (`…github.io/hankki/vision-test.html` ↔ `…github.io/hankki/`) → localStorage 를 같이 쓴다.
     ⛔ 그래서 여기서 `hankki:founder` 를 써 넣으면 앱이 그대로 읽는다(`src/App.jsx:60` 이 넣는 그 열쇠).
     ⛔ 값은 화면에 안 띄운다 — 넣었다는 말만 한다. -->
<div class="row">
  <button class="ghost" id="앱에넣기" style="margin-top:6px">🔐 이 열쇠를 한끼 앱에도 넣기</button>

<!-- 📣 [2026-09-01] 알림을 «화면 글자»로 — 폰 크롬은 alert 을 여러 번 띄우면
     「이 사이트에서 더 보지 않기」가 걸려 **아무 일도 안 나는 것처럼** 보인다(창업자 실물). -->

<div class="card" id="판정" style="display:none">
  <b>👀 볼 것 넷</b>
  <div class="chk"><input type="checkbox" id="c1"><label for="c1" style="margin:0;font-weight:400">「휴/퓨삼치」가 <b>삼치간장조림</b>이 되나</label></div>
  <div class="chk"><input type="checkbox" id="c2"><label for="c2" style="margin:0;font-weight:400">「= 200ml」가 <b>물 200ml</b>가 되나</label></div>
  <div class="chk"><input type="checkbox" id="c3"><label for="c3" style="margin:0;font-weight:400">「생가즈 조그」가 <b>생강즙 조금</b>이 되나</label></div>
  <div class="chk"><input type="checkbox" id="c4"><label for="c4" style="margin:0;font-weight:400">⛔「끼얹어」·「15스푼」을 <b>안</b> 건드리나</label></div>
  <button class="ghost" id="복사">📋 결과 복사하기</button>

<script>
const $ = (id) => document.getElementById(id)
const S = { url: 'hankki:vt:url', key: 'hankki:vt:key', txt: 'hankki:vt:txt' }
try { $('url').value = localStorage.getItem(S.url) || 'https://hankki-tidy.annyeong-hankki.workers.dev'
      $('key').value = localStorage.getItem(S.key) || '' } catch {}
// ⛔⛔ [2026-09-01 사고] 열쇠를 «다듬지 않아서» 첫 판이 통째로 막혔다(unauthorized).
//   붙여넣을 때 딸려오는 빈칸·줄바꿈 하나면 «다른 열쇠»가 된다. 폰에선 그게 눈에 안 보인다.
//   ✅ 넣을 때 한 번, 보낼 때 한 번 — 두 곳에서 다듬는다.
// ⛔ «양 끝»만 뗀다 — 가운데 빈칸까지 지우면 «빈칸이 든 진짜 열쇠»를 내가 망가뜨린다.
//   (안 바꾸는 게 잘못 바꾸는 것보다 낫다 — polish.js 와 같은 원칙)
//   ＋ 눈에 안 보이는 zero-width 도 뗀다(카톡·메모장에서 붙여넣을 때 딸려온다)
const 열쇠 = () => $('key').value.replace(/^[\s​-‍﻿]+|[\s​-‍﻿]+$/g, '')
const 주소 = () => $('url').value.trim().replace(/\/+$/, '')
const 저장 = () => { try { localStorage.setItem(S.url, 주소()); localStorage.setItem(S.key, 열쇠()) } catch {} }
const 열쇠수보이기 = () => {
  const v = $('key').value
  const 깎은 = 열쇠()
  const 가운데빈칸 = (깎은.match(/\s/g) || []).length
  $('열쇠수').textContent = !v ? ''
    : ('글자 ' + 깎은.length + '자'
       + (v.length !== 깎은.length ? ' ⚠️ 앞뒤 빈칸 ' + (v.length - 깎은.length) + '개를 떼어냈어요' : ' ✅')
       + (가운데빈칸 ? ' ⚠️ 가운데에 빈칸이 ' + 가운데빈칸 + '개 있어요(안 지웠어요)' : ''))
}
$('url').addEventListener('change', 저장)
$('key').addEventListener('input', 열쇠수보이기)
$('key').addEventListener('change', () => { $('key').value = 열쇠(); 저장(); 열쇠수보이기() })
열쇠수보이기()
$('열쇠지움').onclick = () => { $('key').value = ''; 저장(); 열쇠수보이기(); 말('열쇠를 지웠어 — 다시 넣어줘', true) }

// 🔐 한끼 앱의 «운영자 열쇠» — 이 페이지와 앱이 같은 주소라 저장소를 같이 쓴다.
//   ⛔ 이름을 바꾸면 안 된다 — 앱이 이 이름으로만 읽는다(`src/App.jsx:60` · `src/tidy.js:81` · `src/ocr.js:68`).
const 앱열쇠칸 = 'hankki:founder'
const 앱열쇠보이기 = () => {
  let v = ''
  try { v = localStorage.getItem(앱열쇠칸) || '' } catch {}
  // ⛔ 값은 «절대» 안 띄운다 — 들어 있나 · 지금 칸과 같나만 말한다
  $('앱열쇠').textContent = !v
    ? '앱에 열쇠 없음 — 지금은 「유저」로 세고 AI 실패 이유도 안 보여요'
    : (v === 열쇠()
        ? '✅ 앱에 들어 있어요 (' + v.length + '자 · 위 칸과 같아요)'
        : '⚠️ 앱에 «다른» 열쇠가 들어 있어요 (' + v.length + '자) — 다시 넣으면 덮어써요')
}
$('앱에넣기').onclick = () => {
  const k = 열쇠()
  // ⛔ 빈 값으로 덮지 않는다 — 없는 값으로 덮는 건 «지우는 것»이다(규칙 18 ⓙ)
  if (!k) { 말('위 칸에 열쇠를 먼저 넣어줘 — 빈 값으로 덮지 않을게', true); 앱열쇠보이기(); return }
  try { localStorage.setItem(앱열쇠칸, k) } catch (e) { 말('못 넣었어: ' + String(e && e.message || e), true); return }
  저장()
  앱열쇠보이기()
  말('🔐 한끼 앱에도 넣었어 — 이제 앱이 나를 「창업자」로 세고, AI 가 실패하면 이유를 화면에 보여줘')
}
$('앱에서빼기').onclick = () => {
  try { localStorage.removeItem(앱열쇠칸) } catch {}
  앱열쇠보이기()
  말('🚪 앱에서 뺐어 — 이제 앱이 나를 «보통 유저»로 봐 (여기 시험판 열쇠는 그대로야)')
}
$('key').addEventListener('input', 앱열쇠보이기)
앱열쇠보이기()

// 🔑 열쇠만 먼저 본다 — GET `?vision=1&key=…` 는 열쇠가 «맞으면» post_only 를 준다.
//   ⭐ 그래서 사진을 안 보내고도 열쇠 하나만 딱 가를 수 있다.
async function 열쇠검사() {
  const u = 주소(), k = 열쇠()
  if (!u || !k) { 말('주소와 열쇠를 넣어줘', true); return null }
  try {
    const r = await fetch(u + '/?vision=1&key=' + encodeURIComponent(k))
    const j = await r.json()
    if (j && j.error === 'post_only') return { ok: true, 말: '✅ 열쇠 맞아' }
    if (j && j.error === 'unauthorized') return { ok: false, 말: '⛔ 열쇠가 달라 — 대시보드의 FOUNDER_SECRET 과 안 맞아' }
    if (j && j.error === 'no_secret') return { ok: false, 말: '⛔ 워커에 FOUNDER_SECRET 이 안 들어 있어' }
    if (j && j.error === 'method_not_allowed') return { ok: false, 말: '⛔ 워커가 «옛 판»이야 — 새 워커 파일을 다시 붙여줘' }
    return { ok: false, 말: '❓ 모르는 답: ' + JSON.stringify(j).slice(0, 200) }
  } catch (e) { return { ok: false, 말: '⛔ 워커에 못 닿았어: ' + String(e && e.message || e) } }
}
$('열쇠확인').onclick = async () => { const r = await 열쇠검사(); if (r) 말(r.말, !r.ok) }

// 📣 화면 글자로 알린다 (alert 대신)
function 말(글, 나쁨, 조용히) {
  const el = $('알림')
  el.style.display = 'block'
  el.innerHTML = '<b class="' + (나쁨 ? 'bad' : 'ok') + '">' + String(글).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</b>'
  // ⛔ 처음 열 때는 굴리지 않는다 — 알림이 단추 «아래»라 페이지가 대뜸 내려가 버린다
  if (!조용히) el.scrollIntoView({ block: 'nearest' })
}

// 🔗 이 페이지 주소 복사 — ⛔ clipboard 는 «성공으로 resolve 되고도» 실제 복사가 안 되는 폰이 있다(v10.97)
//    그래서 실패하면 글자를 골라 준다(길게 눌러 복사).
$('주소복사').onclick = async () => {
  const 여기 = location.href.split('#')[0]
  try { await navigator.clipboard.writeText(여기); 말('복사했어 — 붙여넣어 «들어갔는지» 꼭 확인해줘') }
  catch {
    const p = document.createElement('pre'); p.textContent = 여기; p.id = '주소판'
    const 옛 = document.getElementById('주소판'); if (옛) 옛.remove()
    $('알림').after(p)
    const r = document.createRange(); r.selectNodeContents(p)
    const s = getSelection(); s.removeAllRanges(); s.addRange(r)
    말('복사가 막힌 폰이야 — 아래 주소를 길게 눌러 복사해줘', true)
  }
}

// 📝 붙여넣은 글자도 저장한다 — 원문을 붙여넣고 앱에 갔다 오면 통째로 날아갔다(2026-09-01 창업자 실물)
try { $('txt').value = localStorage.getItem(S.txt) || '' } catch {}
$('txt').addEventListener('input', () => { try { localStorage.setItem(S.txt, $('txt').value) } catch {} })

// ⛔⛔ [2026-09-01] **사진은 «저장하지 않는다»**(용량) — 그래서 페이지를 나갔다 오면 사라진다.
//   그 사실을 «눈에 보이게» 한다. 그 전엔 ▶ 를 눌러도 alert 이 막혀 아무 일도 안 나는 것처럼 보였다.
let 원본 = ''
function 단추상태(조용히) {
  const 있나 = !!원본
  $('go').disabled = !있나; $('go3').disabled = !있나
  $('go').style.opacity = $('go3').style.opacity = 있나 ? '1' : '0.45'
  if (!있나) 말('📷 사진을 먼저 골라주세요 — 이 페이지를 나갔다 오면 사진은 사라져요(글자·열쇠는 남아요)', true, 조용히)
  else $('알림').style.display = 'none'
}
$('pic').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return
  const r = new FileReader()
  r.onload = () => { 원본 = String(r.result); $('미리').src = 원본; $('미리').style.display = 'block'; 단추상태() }
  r.readAsDataURL(f)
})
단추상태(true)   // ⭐ 처음 열 때는 조용히

// 긴 변을 max 로 줄인다. ⭐ 0 이면 원본 그대로 보낸다.
//   ⛔ 이게 이 판의 «두 번째 미지수»를 잰다 — 작은 한글이 줄이면 뭉개지나.
function 줄이기(dataUrl, max) {
  if (!max) return Promise.resolve(dataUrl)
  return new Promise((res) => {
    const im = new Image()
    im.onload = () => {
      const 긴 = Math.max(im.width, im.height)
      if (긴 <= max) return res(dataUrl)
      const s = max / 긴
      const c = document.createElement('canvas')
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s)
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height)
      res(c.toDataURL('image/jpeg', 0.92))
    }
    im.onerror = () => res(dataUrl)
    im.src = dataUrl
  })
}

const 결과들 = []

function 그리기(제목, r, 잰크기) {
  const d = document.createElement('div'); d.className = 'card'
  const 좋 = r && r.ok
  const 요약 = r && r.결과
  d.innerHTML = '<b>' + 제목 + '</b> <span class="' + (좋 ? 'ok' : 'bad') + '">' + (좋 ? '통했다' : '실패') + '</span>'
    + '<div class="k">' + (잰크기 || '') + (r && r.모양 ? ' · ' + r.모양 : '') + (r && r.ms ? ' · ' + r.ms + 'ms' : '') + '</div>'
    + (r && r.usage ? '<div class="k">usage = ' + JSON.stringify(r.usage) + '</div>' : '<div class="k">usage 없음</div>')
    + (요약 ? '<pre>' + 안전(
        '제목: ' + (요약.title || '') + '\n\n재료\n· ' + (요약.ingredients || []).join('\n· ')
        + '\n\n만드는 법\n' + (요약.steps || []).map((s, i) => (i + 1) + '. ' + s).join('\n')
        + (요약.memo ? '\n\n메모: ' + 요약.memo : '')) + '</pre>'
      : '<pre>' + 안전(JSON.stringify(r, null, 1).slice(0, 3000)) + '</pre>')
  $('out').appendChild(d)
  결과들.push(제목 + ' ' + (잰크기 || '') + '\n' + JSON.stringify(r, null, 1))
  $('판정').style.display = 'block'
}
const 안전 = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')

async function 한번(max) {
  if (!원본) { 단추상태(); return }
  const url = 주소()
  const key = 열쇠()
  if (!url || !key) { 말('주소와 열쇠를 넣어줘', true); return }
  저장()
  // ⛔ `max` 는 <select> 값이라 «글자»다 — "0" 도 참이라 「긴 변 0px」로 찍혔다(2026-09-01 실물).
  const 폭 = Number(max) || 0
  const 사진 = await 줄이기(원본, 폭)
  const 갈래 = $('txt').value.trim() ? 'ⓒ 사진＋글자' : 'ⓑ 사진만'
  const 잰크기 = (폭 ? '긴 변 ' + 폭 + 'px' : '원본') + ' · ' + Math.round(사진.length / 1024) + 'KB'
  const 대기 = document.createElement('div'); 대기.className = 'card'; 대기.textContent = '재는 중… ' + 잰크기
  $('out').appendChild(대기)
  let r
  try {
    const resp = await fetch(url + '/?vision=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-hankki-founder': key },
      body: JSON.stringify({ image: 사진, text: $('txt').value.trim(), model: $('model').value.trim() || undefined }),
    })
    r = await resp.json()
  } catch (e) { r = { ok: false, error: '못 보냈다', why: String(e && e.message || e) } }
  대기.remove()
  // ⭐⭐ [2026-09-01] **실패하면 페이지가 «스스로» 원인을 갈라 말한다.**
  //   ⛔ 그 전엔 `unauthorized` 만 보여줘서 창업자가 두 원인(열쇠가 다름 / 워커가 옛 판) 사이에서 멈췄다.
  //      시행착오는 창업자가 아니라 코드가 한다(규칙 8).
  if (r && r.error === 'unauthorized') {
    const k = await 열쇠검사()
    r = { ...r, 왜그런가: k ? k.말 : '(열쇠 검사를 못 돌렸다)' }
  }
  그리기(갈래, r, 잰크기)
}

$('go').onclick = () => 한번($('size').value)
