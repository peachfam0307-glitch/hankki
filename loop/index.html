<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F7F8FA">
<title>loop</title>
<style>
  @font-face{ font-family:'Pretendard'; src:url('./fonts/pretendard.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  @font-face{ font-family:'GowunDodum'; src:url('./fonts/gowun.woff2') format('woff2'); font-display:swap; }
  @font-face{ font-family:'Jua'; src:url('./fonts/jua.woff2') format('woff2'); font-display:swap; }
  @font-face{ font-family:'DoHyeon'; src:url('./fonts/dohyeon.woff2') format('woff2'); font-display:swap; }
  @font-face{ font-family:'Dongle'; src:url('./fonts/dongle.woff2') format('woff2'); font-display:swap; }

  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#1B1F27; --ink2:#4A515C; --mut:#9AA0AA;
    --line:#EEF0F3; --line2:#E4E7EC; --accent:#46618C; --accent-soft:#E9EFF6; --accent-ink:#46618C;
    --sun:#C56B6B; --sat:#9A8F76; --shadow:0 12px 30px rgba(20,24,32,.12);
    --app-font:'Pretendard';
  }
  html[data-theme="dark"]{
    --bg:#0E1219; --surface:#161B22; --surface2:#1D232C; --ink:#EAEDF2; --ink2:#B4BCC7; --mut:#7E8896;
    --line:#222833; --line2:#2A313C; --accent:#6E88AE; --accent-soft:#25303F; --accent-ink:#9DBBE4;
    --sun:#D08B8B; --sat:#B4A98C; --shadow:0 14px 34px rgba(0,0,0,.5);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--app-font),-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    font-size:15px;
  }
  #app{ height:100dvh; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .safe-top{ height:env(safe-area-inset-top); flex-shrink:0; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 8px; flex-shrink:0; }
  .mon{ font-size:22px; font-weight:600; letter-spacing:-.02em; display:flex; align-items:baseline; gap:7px; }
  .mon .yr{ font-size:13px; color:var(--mut); font-weight:500; }
  .mon .nav{ display:inline-flex; gap:2px; margin-left:4px; }
  .mon .nav button{ width:26px; height:26px; border-radius:8px; display:grid; place-items:center; color:var(--mut); }
  .mon .nav button:active{ background:var(--surface2); }
  .mon .nav svg{ width:16px; }
  .rgt{ display:flex; align-items:center; gap:8px; }
  .seg{ display:inline-flex; gap:2px; background:var(--surface2); border-radius:9px; padding:2px; }
  .seg button{ font-size:11.5px; font-weight:600; color:var(--mut); padding:6px 9px; border-radius:7px; }
  .seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(20,24,32,.10); }
  html[data-theme="dark"] .seg button.on{ background:#2C3542; box-shadow:none; }
  .iconbtn{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--ink2); }
  .iconbtn:active{ background:var(--surface2); }
  .iconbtn svg{ width:20px; }

  /* ---------- weekday head ---------- */
  .wk{ display:grid; grid-template-columns:repeat(7,1fr); padding:2px 8px 3px; flex-shrink:0; }
  .wk span{ text-align:center; font-size:10.5px; letter-spacing:.05em; color:var(--mut); font-weight:600; }
  .wk .su{ color:var(--sun); } .wk .sa{ color:var(--sat); }

  /* ---------- month grid ---------- */
  .grid{ flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; padding:0 8px 6px; min-height:0; }
  .cell{ border-top:1px solid var(--line); padding:4px 3px 2px; overflow:hidden; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .cell:active{ background:var(--surface2); border-radius:8px; }
  .dn{ font-size:12px; font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums; padding-left:2px; }
  .cell.oth .dn{ color:var(--mut); opacity:.55; }
  .cell.su .dn{ color:var(--sun); } .cell.sa .dn{ color:var(--sat); }
  .cell.today .dn{ background:var(--ink); color:var(--bg); width:19px; height:19px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .el{ font-size:10px; line-height:1.2; border-radius:5px; padding:2px 4px; word-break:break-all; overflow-wrap:anywhere; font-weight:500; display:flex; align-items:center; gap:3px; }
  .el .es{ width:11px; height:11px; flex-shrink:0; opacity:.85; }
  .el .es svg{ width:11px; height:11px; display:block; }
  .more{ font-size:9.5px; color:var(--mut); padding-left:3px; font-weight:600; }

  /* ---------- list view ---------- */
  .listview{ flex:1; overflow-y:auto; padding:4px 16px 90px; }
  .lday{ display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  .lday .ld{ width:44px; flex-shrink:0; text-align:center; }
  .lday .ld b{ display:block; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
  .lday .ld s{ display:block; font-size:10.5px; color:var(--mut); font-style:normal; margin-top:1px; }
  .lday.hastoday .ld b{ color:var(--accent-ink); }
  .lev{ flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .lrow{ display:flex; align-items:center; gap:9px; }
  .lrow .bar{ width:3px; align-self:stretch; border-radius:3px; flex-shrink:0; }
  .lrow .lnm{ font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px; min-width:0; }
  .lrow .lnm .es{ width:16px; height:16px; border-radius:6px; display:inline-grid; place-items:center; flex-shrink:0; }
  .lrow .lnm .es svg{ width:11px; height:11px; }
  .lrow .lt{ margin-left:auto; font-size:11px; color:var(--mut); font-weight:500; white-space:nowrap; padding-left:8px; }
  .cnt{ font-size:9.5px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); padding:1px 6px; border-radius:5px; margin-left:2px; }
  .empty{ text-align:center; color:var(--mut); font-size:13px; padding:60px 20px; line-height:1.7; }

  /* ---------- FAB ---------- */
  .fab{ position:absolute; right:18px; bottom:calc(20px + env(safe-area-inset-bottom)); width:50px; height:50px; border-radius:17px; background:var(--ink); color:var(--bg); display:grid; place-items:center; box-shadow:var(--shadow); z-index:20; }
  .fab:active{ transform:scale(.94); }
  .fab svg{ width:22px; }

  /* ---------- sheet / modal ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(10,14,20,.42); z-index:40; opacity:0; pointer-events:none; transition:opacity .22s; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto; background:var(--surface); border-radius:26px 26px 0 0; z-index:50; transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); max-height:92dvh; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.18); }
  .sheet.show{ transform:translateY(0); }
  .grab{ width:38px; height:4px; border-radius:3px; background:var(--line2); margin:9px auto 2px; flex-shrink:0; }

  /* day sheet */
  .dsh-head{ padding:10px 20px 8px; }
  .dsh-head .row{ display:flex; align-items:flex-start; justify-content:space-between; }
  .dsh-head .dd{ font-size:25px; font-weight:600; letter-spacing:-.02em; }
  .dsh-head .dd small{ font-size:13px; color:var(--mut); font-weight:500; margin-left:7px; }
  .dsh-head .sub{ font-size:11px; color:var(--mut); margin-top:4px; }
  .tagbtn{ width:32px; height:32px; border-radius:10px; background:var(--surface2); display:grid; place-items:center; color:var(--ink2); }
  .tagbtn svg{ width:18px; }
  .tagstrip{ display:flex; gap:7px; flex-wrap:wrap; padding:8px 20px 4px; }
  .tag{ display:inline-flex; align-items:center; gap:5px; height:27px; padding:0 10px 0 8px; border-radius:8px; font-size:11.5px; font-weight:600; }
  .tag svg{ width:14px; height:14px; }
  .tag .rm{ margin-left:2px; opacity:.55; font-size:13px; }
  .dsh-list{ overflow-y:auto; padding:6px 20px 4px; }
  .dev{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .dev:first-child{ border-top:none; }
  .dev .dt{ width:52px; flex-shrink:0; text-align:right; }
  .dev .dt b{ display:block; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .dev .dt s{ display:block; font-size:10px; color:var(--mut); font-style:normal; margin-top:1px; }
  .dev .bar{ width:3px; border-radius:3px; flex-shrink:0; }
  .dev .body{ flex:1; min-width:0; }
  .dev .body .nm{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .dev .body .nm .es{ width:18px; height:18px; border-radius:6px; display:inline-grid; place-items:center; flex-shrink:0; }
  .dev .body .nm .es svg{ width:12px; height:12px; }
  .dev .body .mt{ display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .dev .body .mt span{ font-size:11px; color:var(--mut); font-weight:500; display:inline-flex; align-items:center; gap:3px; }
  .dev .body .mt svg{ width:12px; }
  .chipn{ color:var(--accent-ink)!important; background:var(--accent-soft); padding:2px 7px; border-radius:6px; font-weight:600!important; }
  .addbar{ margin:8px 16px calc(14px + env(safe-area-inset-bottom)); height:48px; border-radius:15px; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:600; flex-shrink:0; }
  .addbar:active{ opacity:.85; } .addbar svg{ width:18px; }

  /* editor */
  .ed{ display:flex; flex-direction:column; height:88dvh; }
  .ed-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 18px 6px; flex-shrink:0; }
  .ed-head .x,.ed-head .sv{ font-size:14px; font-weight:600; padding:8px 4px; }
  .ed-head .x{ color:var(--mut); } .ed-head .sv{ color:var(--accent-ink); font-weight:700; }
  .ed-head .ttl{ font-size:15px; font-weight:600; }
  .ed-body{ overflow-y:auto; padding:4px 18px calc(20px + env(safe-area-inset-bottom)); }
  .ti{ width:100%; font-size:20px; font-weight:600; letter-spacing:-.02em; padding:10px 2px 12px; border:none; border-bottom:1px solid var(--line); background:none; color:var(--ink); outline:none; font-family:inherit; }
  .ti::placeholder{ color:var(--mut); font-weight:500; }
  .fr{ display:flex; align-items:center; gap:12px; padding:14px 2px; border-bottom:1px solid var(--line); min-height:52px; }
  .fr .ic{ width:20px; color:var(--mut); flex-shrink:0; } .fr .ic svg{ width:20px; display:block; }
  .fr .lb{ font-size:13.5px; font-weight:500; flex:1; }
  .fr .vl{ display:flex; align-items:center; gap:8px; }
  .fr input[type=date],.fr input[type=time]{ font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--surface2); border:none; border-radius:9px; padding:7px 9px; outline:none; }
  .fr input[type=text].memo{ flex:1; border:none; background:none; text-align:right; font-size:13px; color:var(--ink); outline:none; font-family:inherit; }
  .fr input[type=text].memo::placeholder{ color:var(--mut); }
  .tg{ width:44px; height:26px; border-radius:13px; background:var(--line2); position:relative; flex-shrink:0; transition:background .18s; }
  .tg.on{ background:var(--accent); }
  .tg::after{ content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:3px; left:3px; transition:left .18s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .tg.on::after{ left:21px; }
  .miniseg{ display:inline-flex; gap:3px; background:var(--surface2); border-radius:9px; padding:3px; flex-wrap:wrap; }
  .miniseg button{ font-size:11.5px; font-weight:600; color:var(--mut); padding:5px 9px; border-radius:7px; }
  .miniseg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,24,32,.08); }
  html[data-theme="dark"] .miniseg button.on{ background:#2C3542; box-shadow:none; }
  .daysel{ display:flex; gap:5px; margin-top:10px; }
  .daysel button{ width:30px; height:30px; border-radius:9px; font-size:11.5px; font-weight:600; background:var(--surface2); color:var(--mut); }
  .daysel button.on{ background:var(--accent); color:#fff; }
  .colorrow{ display:flex; gap:11px; }
  .colorrow button{ width:24px; height:24px; border-radius:50%; position:relative; }
  .colorrow button.on::after{ content:''; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--accent); }
  .stkrow{ display:flex; gap:9px; flex-wrap:wrap; margin-top:4px; }
  .stkrow button{ width:38px; height:38px; border-radius:12px; background:var(--surface2); display:grid; place-items:center; color:var(--ink2); }
  .stkrow button svg{ width:20px; height:20px; }
  .stkrow button.on{ background:var(--accent-soft); color:var(--accent-ink); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .subseg{ font-size:11px; color:var(--mut); font-weight:600; padding:14px 2px 6px; }

  /* picker sheet (sound / sticker library) */
  .pkr{ padding:6px 20px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .pkr h3{ font-size:16px; font-weight:600; margin:6px 0 12px; }
  .pkr .opt{ display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); }
  .pkr .opt .nm{ flex:1; font-size:14px; font-weight:500; }
  .pkr .opt .ck{ color:var(--accent-ink); } .pkr .opt .ck svg{ width:19px; }
  .pkr .opt .play{ width:32px; height:32px; border-radius:10px; background:var(--surface2); display:grid; place-items:center; color:var(--ink2); }
  .pkr .opt .play svg{ width:16px; }
  .stklib{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; padding:6px 0; }
  .stklib button{ aspect-ratio:1; border-radius:14px; background:var(--surface2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--ink2); }
  .stklib button svg{ width:22px; height:22px; }
  .stklib button span{ font-size:9px; color:var(--mut); font-weight:600; }
  .catlabel{ font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--mut); text-transform:uppercase; margin:14px 0 4px; }

  /* settings */
  .setwrap{ flex:1; overflow-y:auto; padding:6px 18px calc(30px + env(safe-area-inset-bottom)); }
  .setsec{ font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--mut); text-transform:uppercase; padding:16px 4px 8px; }
  .fontcard{ display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line2); border-radius:15px; padding:14px 15px; margin-bottom:9px; }
  .fontcard.on{ border-color:var(--accent); background:var(--accent-soft); }
  .fontcard .rad{ width:19px; height:19px; border-radius:50%; border:2px solid var(--line2); flex-shrink:0; position:relative; }
  .fontcard.on .rad{ border-color:var(--accent); }
  .fontcard.on .rad::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
  .fontcard .fx{ flex:1; } .fontcard .fnm{ font-size:16px; } .fontcard .fpv{ font-size:12px; color:var(--mut); margin-top:3px; }
  .badge{ font-size:9px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); padding:2px 6px; border-radius:5px; margin-left:6px; font-family:'Pretendard'; }
  html[data-theme="dark"] .fontcard.on .badge{ background:#31435a; }
  .toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:12px; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .del{ text-align:center; color:var(--sun); font-size:13.5px; font-weight:600; padding:16px; margin-top:8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================ storage ============================ */
const DB_KEY = 'loop.db.v1';
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { events:[], dayTags:{}, settings:{ theme:'light', font:'Pretendard' } };
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ toast('저장 공간이 부족해요'); } }
let db = loadDB();

/* ============================ helpers ============================ */
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYMD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const todayStr = ymd(new Date());
function addMonths(y,m,delta){ let mm=m+delta, yy=y; while(mm<0){mm+=12;yy--;} while(mm>11){mm-=12;yy++;} return [yy,mm]; }
function fmtTime(t){ if(!t) return ''; let [h,mi]=t.split(':').map(Number); const ap=h<12?'오전':'오후'; let hh=h%12; if(hh===0)hh=12; return `${ap} ${hh}:${pad(mi)}`; }
function fmtTimeShort(t){ let [h,mi]=t.split(':').map(Number); return `${pad(h)}:${pad(mi)}`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* colors: [lightBg,lightFg,darkBg,darkFg,bar] */
const COLORS = {
  blue:['#E7EDF5','#42618E','#22303F','#9DBBE4','#6E88AE'],
  teal:['#E2F0F0','#3C7377','#1E3234','#84C3C6','#5F9296'],
  rose:['#F6E7ED','#94546F','#3A2530','#E1A7BC','#B06E88'],
  sage:['#E9F1EA','#597962','#243027','#A6CBB0','#7E9A85'],
  plum:['#F0EBF2','#6E5A79','#2E2634','#C6ADD1','#927B9C'],
  slate:['#ECEEF1','#59636F','#262B32','#AEB7C2','#8892A0'],
};
const COLOR_KEYS = Object.keys(COLORS);
function isDark(){ return db.settings.theme==='dark'; }
function col(k){ const c=COLORS[k]||COLORS.blue; return isDark()?{bg:c[2],fg:c[3],bar:c[4]}:{bg:c[0],fg:c[1],bar:c[4]}; }

/* ============================ sticker icons ============================ */
const IC = {
  book:'<path d="M5 20h14M6 20v-6a6 6 0 0 1 12 0v6"/><path d="M12 8V4M9.5 4h5"/>',
  coffee:'<path d="M5 8h11v4a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5V8Z"/><path d="M16 9h2.5a2 2 0 0 1 0 4H16"/><path d="M9 3.5c-.5.7-.5 1.4 0 2.1M12 3.5c-.5.7-.5 1.4 0 2.1"/>',
  heart:'<path d="M12 20s-7-4.5-7-9.5A3.4 3.4 0 0 1 12 8a3.4 3.4 0 0 1 7 2.5C19 15.5 12 20 12 20Z"/>',
  money:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 9.5h4a1.6 1.6 0 0 1 0 3.2h-3a1.6 1.6 0 0 0 0 3.2h4"/>',
  run:'<circle cx="15" cy="5" r="1.6"/><path d="M13 8l-3 2 2 3-2 5M13 8l3 2 3 .5M10 10l-2 4"/>',
  scissors:'<circle cx="7" cy="7" r="2.2"/><circle cx="7" cy="17" r="2.2"/><path d="M9 8.5 20 17M9 15.5 20 7"/>',
  brush:'<path d="M4 20c2 0 3-1.5 3-3.5C7 15 9 13 9 13l7-9 2 2-9 7s-2 2-3.5 2C3.5 15 4 18 4 20Z"/>',
  cake:'<path d="M4 21h16M5 21v-6h14v6M6 15a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0M12 8v4M12 5v.5"/>',
  party:'<path d="M4 20 8 9l7 7-11 4ZM14 4v2M18 8h2M15.5 5.5l1.2 1.2"/>',
  movie:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M9 6v12M15 6v12M4 10h5M15 10h5M4 14h5M15 14h5"/>',
  cat:'<path d="M5 9 4 4l4 3h8l4-3-1 5"/><path d="M5 9v4a7 5 0 0 0 14 0V9"/><path d="M9 13h.01M15 13h.01M11 15c.6.5 1.4.5 2 0"/>',

/* ============================ recurrence ============================ */
// return array of {date:'YYYY-MM-DD', n:sessionIndex} occurrences of ev within [from,to] inclusive
function occurrences(ev, from, to){
  const out=[]; const start=parseYMD(ev.date);
  const rep=ev.repeat||{type:'none'};
  const until = rep.until? parseYMD(rep.until):null;
  if(rep.type==='none'){
    if(ev.date>=from && ev.date<=to) out.push({date:ev.date,n:1});
    return out;
  }
  // iterate days from max(start,from) to to
  let cursor = parseYMD(from> ev.date? from: ev.date);
  const end = parseYMD(to);
  // session counter needs to start from series start; count from start to cursor-1 first
  let n=0;
  const step=(d)=>{ d.setDate(d.getDate()+1); };
  // precount sessions before 'from'
  let pre=parseYMD(ev.date);
  while(pre < cursor){
    if(matchRep(ev,pre) && (!until||pre<=until)) n++;
    step(pre);
  }
  let c=parseYMD(ev.date> from? ev.date: from);
  while(c<=end){
    if(until && c>until) break;
    if(matchRep(ev,c) && ymd(c)>=ev.date){ n++; out.push({date:ymd(c),n}); }
    step(c);
  }
  return out;
}
function matchRep(ev,d){
  const rep=ev.repeat;
  if(rep.type==='weekly'){ return (rep.days||[]).includes(d.getDay()); }
  if(rep.type==='monthly'){ return d.getDate()===parseYMD(ev.date).getDate(); }
  if(rep.type==='daily'){ return true; }
  return false;
}
// all events occurring on a specific date, sorted by time
function eventsOn(dateStr){
  const list=[];
  for(const ev of db.events){
    const occ=occurrences(ev,dateStr,dateStr);
    if(occ.length){ list.push({ev, n:occ[0].n}); }
  }
  list.sort((a,b)=>{
    const at=a.ev.allDay?'' : (a.ev.start||''); const bt=b.ev.allDay?'':(b.ev.start||'');
    if(a.ev.allDay!==b.ev.allDay) return a.ev.allDay?-1:1;
    return at.localeCompare(bt);
  });
  return list;
}

function monthGrid(){
  const first=new Date(view.y,view.m,1);
  const startDow=first.getDay();
  const gridStart=new Date(view.y,view.m,1-startDow);
  // build 6 weeks = 42 cells; trim last row if fully next-month
  let cells=[];
  for(let i=0;i<42;i++){ const d=new Date(gridStart); d.setDate(gridStart.getDate()+i); cells.push(d); }
  // trim to 5 rows if 6th row all next month
  if(cells[35].getMonth()!==view.m && cells[28].getMonth()!==view.m){} // keep simple; compute needed rows
  const needed = cells[35].getMonth()===view.m || (cells[35].getMonth()!==view.m && cells[34].getMonth()===view.m) ? 42 : 35;
  const rows = (cells[35].getMonth()!==view.m && cells[35].getDate()>1 && cells[35].getDate()<=7 && cells[34].getMonth()!==view.m)?35:42;
  const showCells = cells.slice(0, needsSix(view.y,view.m)?42:35);
  return `<div class="grid" style="grid-auto-rows:1fr">${showCells.map(d=>cellHTML(d)).join('')}</div>`;
}
function needsSix(y,m){ const first=new Date(y,m,1).getDay(); const days=new Date(y,m+1,0).getDate(); return (first+days)>35; }
function cellHTML(d){

  return `<div class="${cls.join(' ')}" onclick="openDay('${ds}')"><span class="dn">${d.getDate()}</span>${inner}</div>`;
}

let actx=null;
function beep(name){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const map={ '물방울':[880,0.12],'방울':[1200,0.1],'딩동':[660,0.2],'새소리':[1500,0.08],'실로폰':[1046,0.15],'팝':[500,0.06],'종':[784,0.4],'기본':[600,0.15] };
    const [f,dur]=map[name]||[600,0.15];
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

      </div>

      <div class="subseg">스티커</div>
      <div class="stkrow">
        ${['book','coffee','heart','money','scissors','brush','run','movie'].map(k=>`<button class="${d.sticker===k?'on':''}" onclick="draft.sticker=(draft.sticker==='${k}'?null:'${k}');renderEditor()">${svg(k)}</button>`).join('')}
        <button onclick="openStickerLib('event')" style="color:var(--mut)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>

      <div class="fr" style="margin-top:6px">
        <span class="ic">${iconMemo()}</span>
        <input class="memo" type="text" placeholder="메모" value="${escapeHtml(d.memo)}" oninput="draft.memo=this.value">
      </div>

      ${d.id?`<div class="del" onclick="deleteEvent()">이 일정 삭제</div>`:''}
    </div>
  </div>`;
  showSheet(body,false,true);
}
function openAlarmPick(){
  let html=`<div class="grab"></div><div class="pkr"><h3>알림 시점</h3>`;
  ALARM_OPTS.forEach(o=>{ const on=draft.alarm.minutes===o.m;
    html+=`<div class="opt"><div class="nm" onclick="draft.alarm.minutes=${o.m};closeSheet();setTimeout(()=>openEditor('__draft'),260)">${o.l}</div>${on?`<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg></span>`:''}</div>`; });
  html+=`</div>`; showSheet(html,true);
}
function setRepeat(k){ draft.repeat.type=k; if(k==='weekly'&&(!draft.repeat.days||!draft.repeat.days.length)){ draft.repeat.days=[parseYMD(draft.date).getDay()]; } if(k==='none') draft.countSessions=false; renderEditor(); }
function toggleDay(i){ const ds=draft.repeat.days||[]; const idx=ds.indexOf(i); if(idx>=0)ds.splice(idx,1); else ds.push(i); draft.repeat.days=ds; renderEditor(); }
function saveEvent(){
  const t=(draft.title||'').trim(); if(!t){ toast('일정 이름을 입력해주세요'); return; }
  draft.title=t;
  if(draft.repeat.type==='weekly' && (!draft.repeat.days||!draft.repeat.days.length)){ draft.repeat.days=[parseYMD(draft.date).getDay()]; }
  if(draft.id){ const i=db.events.findIndex(e=>e.id===draft.id); db.events[i]=draft; }
  else { draft.id=uid(); db.events.push(draft); }
  saveDB(); scheduleAlarms(); closeSheet();
  const savedDate=draft.date;
  setTimeout(()=>{ render(); if(curDay){ openDay(savedDate); } toast('저장했어요'); },260);
}
function deleteEvent(){
  db.events=db.events.filter(e=>e.id!==draft.id); saveDB(); closeSheet();
  setTimeout(()=>{ render(); if(curDay) openDay(curDay); toast('삭제했어요'); },260);
}

/* ============================ sheet infra ============================ */
let sheetEl=null, scrimEl=null;
function ensureSheet(){
  if(!scrimEl){ scrimEl=document.createElement('div'); scrimEl.className='scrim'; scrimEl.onclick=closeSheet; document.body.appendChild(scrimEl); }
  if(!sheetEl){ sheetEl=document.createElement('div'); sheetEl.className='sheet'; document.body.appendChild(sheetEl); }
}
function showSheet(html, compact, tall){
  ensureSheet();
  sheetEl.innerHTML=html;
  sheetEl.style.maxHeight = tall? '92dvh' : (compact? '80dvh' : '92dvh');
  requestAnimationFrame(()=>{ scrimEl.classList.add('show'); sheetEl.classList.add('show'); });
}
function closeSheet(){ if(sheetEl){ sheetEl.classList.remove('show'); scrimEl.classList.remove('show'); } }

/* ============================ toast ============================ */
let toastEl=null,toastT=null;
function toast(msg){
  if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl); }
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1600);
}

/* ============================ settings ============================ */
function openSettings(){ view.mode='settings'; render(); }
function renderSettings(){
  const fonts=[
    ['Jua','주아','애플민트 느낌 ★'],['Dongle','동글',''],['Pretendard','프리텐다드','기본·모던'],
    ['GowunDodum','고운돋움',''],['DoHyeon','도현',''],
  ];
  let html=`<div class="safe-top"></div>
  <div class="topbar"><div class="mon" style="font-size:18px"><button class="iconbtn" style="margin-left:-8px" onclick="view.mode='month';render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>설정</div></div>
  <div class="setwrap">
    <div class="setsec">테마</div>
    <div class="seg" style="width:100%">
      <button class="${!isDark()?'on':''}" style="flex:1;padding:11px" onclick="setTheme('light')">☀︎ 라이트</button>
      <button class="${isDark()?'on':''}" style="flex:1;padding:11px" onclick="setTheme('dark')">☾ 다크</button>
    </div>
    <div class="setsec">글씨체</div>`;
  fonts.forEach(([fam,name,badge])=>{
    const on=db.settings.font===fam;
    html+=`<div class="fontcard ${on?'on':''}" onclick="setFont('${fam}')">
      <span class="rad"></span>
      <div class="fx"><div class="fnm" style="font-family:'${fam}'">${name}${badge?`<span class="badge">${badge}</span>`:''}</div>
      <div class="fpv" style="font-family:'${fam}'">7월 14일 · 수학학원 10시 반</div></div>
    </div>`;
  });
  html+=`<div class="setsec">알림</div>
    <div class="fr" style="padding:14px 4px"><span class="lb">푸시 알림 권한</span><button class="miniseg" style="padding:0"><span style="padding:7px 12px;font-weight:600;color:var(--accent-ink)" onclick="askNotify()">권한 요청</span></button></div>
    <div style="font-size:11.5px;color:var(--mut);padding:4px 4px 0;line-height:1.7">앱을 설치(APK)하면 꺼져 있어도 알람이 울려요. 웹 미리보기에선 앱이 열려 있을 때만 동작해요.</div>
    <div class="setsec">데이터</div>
    <div class="fr" style="padding:14px 4px" onclick="exportData()"><span class="lb">내보내기 (백업)</span><span style="color:var(--mut)">↗</span></div>
    <div style="text-align:center;color:var(--mut);font-size:11px;padding:28px 0 10px">loop · v0.1</div>
  </div>`;
  app.innerHTML=html;
}
function setTheme(t){ db.settings.theme=t; saveDB(); render(); }
function setFont(f){ db.settings.font=f; saveDB(); render(); toast(f+' 적용'); }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', db.settings.theme);
  document.body.style.setProperty('--app-font', `'${db.settings.font}'`);
  const tc=isDark()?'#0E1219':'#F7F8FA'; const m=document.querySelector('meta[name=theme-color]'); if(m)m.setAttribute('content',tc);
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='loop-backup.json'; a.click();
    toast('백업 파일 저장');
  }catch(e){ toast('내보내기 실패'); }
}

/* ============================ notifications (web best-effort; swapped in native) ============================ */
function askNotify(){ if('Notification' in window){ Notification.requestPermission().then(p=>toast(p==='granted'?'알림 허용됨':'알림 거부됨')); } else toast('이 환경은 알림 미지원'); }
let alarmTimers=[];
function scheduleAlarms(){
  alarmTimers.forEach(t=>clearTimeout(t)); alarmTimers=[];
  if(!('Notification'in window)||Notification.permission!=='granted') return;
  const now=Date.now(); const horizon=now+ 1000*60*60*24; // next 24h (web keeps app-open only)
  const from=ymd(new Date()); const to=ymd(new Date(Date.now()+86400000));
  db.events.forEach(ev=>{
    if(!ev.alarm||!ev.alarm.on||ev.allDay) return;
    occurrences(ev,from,to).forEach(o=>{
      const [h,mi]=(ev.start||'09:00').split(':').map(Number);
      const dt=parseYMD(o.date); dt.setHours(h,mi,0,0);
      const fireAt=dt.getTime()-ev.alarm.minutes*60000;
      if(fireAt>now && fireAt<horizon){
        alarmTimers.push(setTimeout(()=>{ try{ new Notification('loop · '+ev.title,{body:alarmLabel(ev.alarm.minutes)+' · '+fmtTime(ev.start)}); beep(ev.sound); }catch(e){} }, fireAt-now));
      }
    });
  });
}

/* ============================ nav ============================ */
function shiftMonth(delta){ const [y,m]=addMonths(view.y,view.m,delta); view.y=y; view.m=m; render(); }
function goToday(){ const n=new Date(); view.y=n.getFullYear(); view.m=n.getMonth(); render(); }
function setMode(k){ view.mode=k; render(); }

/* ============================ seed (first run demo) ============================ */
function seedIfEmpty(){
  if(db.events.length) return;
  const n=new Date(); const y=n.getFullYear(), m=n.getMonth();
  const D=(day)=>`${y}-${pad(m+1)}-${pad(day)}`;
  db.events=[
    { id:uid(), title:'수학학원', date:D(1), allDay:false, start:'10:30', end:'12:00', color:'blue', sticker:'book', alarm:{on:true,minutes:30}, sound:'물방울', repeat:{type:'weekly',days:[2,4],until:null}, countSessions:true, memo:'' },
    { id:uid(), title:'필라테스', date:D(1), allDay:false, start:'19:00', end:'20:00', color:'teal', sticker:'run', alarm:{on:true,minutes:60}, sound:'딩동', repeat:{type:'weekly',days:[1],until:null}, countSessions:false, memo:'' },
    { id:uid(), title:'학원비 납부', date:D(15), allDay:true, start:'09:00', end:'', color:'rose', sticker:'money', alarm:{on:true,minutes:1440}, sound:'종', repeat:{type:'monthly',days:[],until:null}, countSessions:false, memo:'' },
    { id:uid(), title:'염색 예정', date:D(Math.min(18,new Date(y,m+1,0).getDate())), allDay:true, start:'09:00', end:'', color:'sage', sticker:'brush', alarm:{on:false,minutes:30}, sound:'물방울', repeat:{type:'none',days:[],until:null}, countSessions:false, memo:'' },
  ];
  db.dayTags[D(Math.min(new Date().getDate(), new Date(y,m+1,0).getDate()))]=['coffee','heart'];
  saveDB();
}

/* ============================ boot ============================ */
seedIfEmpty();
render();
if('Notification'in window && Notification.permission==='granted') scheduleAlarms();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ /* refresh today marker */ } });
</script>
